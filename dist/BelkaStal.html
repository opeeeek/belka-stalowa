  const yTop = Y(Math.max(yHalf, g.bp / 2)) - 10;
  p += Q.dimV(X(xL) - 26, Y(g.bp / 2), Y(-g.bp / 2), `b<tspan font-size="8" dy="2">p</tspan><tspan dy="-2"> = ${fmt(g.bp, 0)}</tspan>`);
  p += Q.dimV(X(-g.lp / 2) - 10, Y(g.sB / 2), Y(-g.sB / 2), `${fmt(g.sB, 0)}`, { right: false });
  p += Q.dimH(X(-g.lp / 2), X(g.lp / 2), Y(-Math.max(yHalf, g.bp / 2)) + 14, `l<tspan font-size="8" dy="2">p</tspan><tspan dy="-2"> = ${fmt(g.lp, 0)}</tspan>`, { below: true });
  if (g.nL > 1) p += Q.dimH(X(g.xs[0]), X(g.xs[1]), Y(-g.sB / 2) + 16, `s<tspan font-size="8" dy="2">L</tspan><tspan dy="-2"> = ${fmt(g.sL, 0)}</tspan>`, { below: true, fs: 9.5 });
  if (g.bc > 0) {
    p += Q.dimH(X(xC0), X(xC1), yTop - 14, `b<tspan font-size="8" dy="2">c</tspan><tspan dy="-2"> = ${fmt(g.bc, 0)}</tspan>`);
    p += Q.dimH(X(xC0), X(g.xs[0]), yTop, `${fmt(g.cxZ, 0)}`, { fs: 9.5 }) + Q.dimH(X(g.xs[g.xs.length - 1]), X(xC1), yTop, `${fmt(g.cxP, 0)}`, { fs: 9.5 });
  }
  p += tx(X(xR) - 2, Y(bf / 2) - 4, 'belka →', { a: 'end', fs: 9, c: '#4a5466' });
  // linia przekroju A–A (w poprzek belki, przez pierwszy rząd kotew)
  { const xa = X(g.xs[0]), ya = Y(Math.max(yHalf, g.bp / 2)) - 2, yb = Y(-Math.max(yHalf, g.bp / 2)) + 2; p += `<line x1="${xa}" y1="${ya}" x2="${xa}" y2="${yb}" stroke="#1d5bb8" stroke-width="0.9" stroke-dasharray="10 3 2 3"/>` + [[ya, -1], [yb, 1]].map(([yy, sg]) => `<path d="M ${xa} ${yy} l -9 0" stroke="#1d5bb8" stroke-width="1.6"/><path d="M ${xa - 9} ${yy} l 4 -3 l 0 6 z" fill="#1d5bb8"/>` + tx(xa - 14, yy + 4 * (sg > 0 ? 1 : 0) + (sg > 0 ? 6 : -2), 'A', { a: 'end', fs: 10, w: 700, c: '#1d5bb8' })).join(''); }
  const Hp = oy + (yHalf + 10) * kP + 26;
  const plan = svgOpen(Wd, Hp, 'class="anchsvg"') + p + '</svg>';

  // ---------------------------------------------------- przekrój A–A (w poprzek belki, przez kotwy)
  const top = tg + g.tp + H.tw + H.m + 2 * H.P, ztop = tg + g.tp + td + Math.max(60, 0.25 * (sec.h || 300));
  const zbot = -(Math.min(g.hc < 5e4 ? g.hc : hef + 150, Math.max(hef + (k.typ === 'wbetonowane' ? (L.tAP || 10) + H.m + 40 : 60), hef + 40)));
  const yW = (g.lc > 0 ? g.lc / 2 : g.bp / 2 + 80);
  const kS = Math.min((Wd - 130) / (2 * yW), 300 / (Math.max(ztop, top) - zbot));
  const ox2 = 30 + yW * kS, oz = 34 + Math.max(ztop, top) * kS;
  const XS = (y) => ox2 + y * kS, ZS = (z) => oz - z * kS;
  let s = tx(Wd / 2, 14, 'Przekrój A–A – kotwa w betonie', { fs: 10.5, w: 600, c: C.dim });
  // beton
  s += `<rect x="${XS(-yW)}" y="${ZS(0)}" width="${2 * yW * kS}" height="${-zbot * kS}" fill="${C.conc}" stroke="${C.concS}"/>`;
  for (let i = 0; i < 2 * yW * kS / 14; i++) { const x0 = XS(-yW) + i * 14; s += `<line x1="${x0}" y1="${ZS(0) + 3}" x2="${x0 + 6}" y2="${ZS(0) + 9}" stroke="#b7bdc8" stroke-width="0.6"/>`; }
  if (!(g.hc < 5e4) || g.hc > -zbot + 1) s += `<path d="M ${XS(-yW)} ${ZS(zbot)} l 20 -5 l 10 10 l 20 -5" fill="none" stroke="${C.concS}"/>`;
  // podlewka, płyta
  if (tg > 0) s += `<rect x="${XS(-g.bp / 2 - 8)}" y="${ZS(tg)}" width="${(g.bp + 16) * kS}" height="${tg * kS}" fill="${C.grout}" stroke="#9a907f" stroke-width="0.7"/>`;
  s += `<rect x="${XS(-g.bp / 2)}" y="${ZS(tg + g.tp)}" width="${g.bp * kS}" height="${g.tp * kS}" fill="${C.pl}" stroke="${C.plS}" stroke-width="1.1"/>`;
  // belka – pas dolny i środnik (urwany)
  const zb = tg + g.tp;
  s += `<rect x="${XS(-bf / 2)}" y="${ZS(zb + td)}" width="${bf * kS}" height="${td * kS}" fill="${C.beam}" stroke="${C.beamS}"/>`;
  s += `<rect x="${XS(-tw / 2)}" y="${ZS(ztop)}" width="${Math.max(1.5, tw * kS)}" height="${(ztop - zb - td) * kS}" fill="${C.beam}" stroke="${C.beamS}"/>`;
  s += `<path d="M ${XS(-tw / 2) - 8} ${ZS(ztop) + 3} l 6 -6 l 4 6 l 6 -6 l 6 6" fill="none" stroke="${C.beamS}" stroke-width="0.8"/>`;
  if (U.num(w.aw, 0) > 0) [1, -1].forEach(sg => { const a = U.num(w.aw) * kS; s += `<path d="M ${XS(sg * bf / 2)} ${ZS(zb)} l ${sg * a * 1.3} 0 l ${-sg * a * 1.3} ${-a * 1.3} z" fill="${C.weld}"/>`; });
  // kotwy
  g.ys.forEach((y, j) => {
    const xa = XS(y), dd = Math.max(2, d * kS);
    if (k.typ === 'wklejane') s += `<rect x="${xa - (L.dDrill || d + 4) / 2 * kS}" y="${ZS(0)}" width="${(L.dDrill || d + 4) * kS}" height="${hef * kS}" fill="${C.resin}" fill-opacity="0.75"/>`;
    const zBot = k.typ === 'wbetonowane' ? -(hef + (L.tAP || 10) + H.m) : k.typ === 'rozporowe' ? -(hef + 0.5 * d) : -hef;
    s += `<rect x="${xa - dd / 2}" y="${ZS(top)}" width="${dd}" height="${(top - zBot) * kS}" fill="${C.bolt}"/>`;
    for (let z = 0; z > zBot + 4; z -= Math.max(3, H.P * 2)) { /* gwint – kreski */ s += `<line x1="${xa - dd / 2}" y1="${ZS(z)}" x2="${xa + dd / 2}" y2="${ZS(z - 1)}" stroke="#6b7385" stroke-width="0.4"/>`; }
    if (k.typ === 'rozporowe') s += `<path d="M ${xa - dd / 2} ${ZS(-hef + 0.6 * d)} L ${xa - dd / 2 - 3} ${ZS(-hef)} L ${xa + dd / 2 + 3} ${ZS(-hef)} L ${xa + dd / 2} ${ZS(-hef + 0.6 * d)} Z" fill="#8a93a3"/>`;
    if (k.typ === 'wbetonowane') { const dh = (ko.T && ko.T.dh) || 3 * d; s += `<rect x="${xa - dh / 2 * kS}" y="${ZS(-hef)}" width="${dh * kS}" height="${(L.tAP || 10) * kS}" fill="${C.pl}" stroke="${C.plS}"/><rect x="${xa - 0.8 * d * kS}" y="${ZS(-hef - (L.tAP || 10))}" width="${1.6 * d * kS}" height="${H.m * kS}" fill="${C.bolt}"/>`; }
    // podkładka i nakrętka
    s += `<rect x="${xa - H.dw / 2 * kS}" y="${ZS(zb + H.tw)}" width="${H.dw * kS}" height="${Math.max(1.2, H.tw * kS)}" fill="#8a93a3" stroke="${C.bolt}" stroke-width="0.5"/>`;
    s += `<rect x="${xa - 0.8 * d * kS}" y="${ZS(zb + H.tw + H.m)}" width="${1.6 * d * kS}" height="${H.m * kS}" fill="${C.bolt}"/>`;
    if (j === 1) {
      // wymiary: h_ef i L
      s += Q.dimV(xa + Math.max(18, H.dw * kS / 2 + 10), ZS(0), ZS(-hef), `h<tspan font-size="8" dy="2">ef</tspan><tspan dy="-2"> = ${fmt(hef, 0)}</tspan>`, { right: true, fs: 9.5 });
      s += Q.dimV(xa + Math.max(18, H.dw * kS / 2 + 10) + 62, ZS(top), ZS(zBot), `L = ${fmt(L.Lr, 0)}`, { right: true, fs: 9.5 });
    }
  });
  s += Q.dimH(XS(g.ys[0]), XS(g.ys[1]), ZS(zbot) + 14, `s<tspan font-size="8" dy="2">B</tspan><tspan dy="-2"> = ${fmt(g.sB, 0)}</tspan>`, { below: true });
  s += tx(XS(-g.bp / 2) - 4, ZS(tg + g.tp / 2) + 3, `t<tspan font-size="8" dy="2">p</tspan><tspan dy="-2"> = ${fmt(g.tp, 0)}</tspan>`, { a: 'end', fs: 9, c: C.plS });
  if (tg > 0) s += tx(XS(-g.bp / 2) - 4, ZS(tg / 2) + 9, `t<tspan font-size="8" dy="2">g</tspan><tspan dy="-2"> = ${fmt(tg, 0)}</tspan>`, { a: 'end', fs: 9, c: '#7a6f5c' });
  const lab = `${g.n} × ${esc(k.d)} kl. ${esc(k.kl)} – ${esc(BS.KT.KROTKO[k.typ] || k.typ)}, L = ${fmt(L.Lr, 0)} mm${L.h0 ? `, otwór Ø${fmt(L.dDrill, 0)} × ${fmt(L.h0, 0)}` : ''}`;
  const Hs = ZS(zbot) + 52;
  s += tx(Wd / 2, Hs - 6, lab, { fs: 9.5, c: C.dim });
  const sect = svgOpen(Wd, Hs, 'class="anchsvg"') + s + '</svg>';
  return { plan, sect };
};

/* ------------------------------------------------------------ widok podłużny belki z połączeniami */
D.elevation = function (S, R, o) {
  o = o || {};
  const md = R.md, sec = R.sec; if (!md || !sec) return '';
  const W = o.W || 1000, ml = 50, mr = 50, L = md.L, X = (x) => ml + (W - ml - mr) * x / L;
  const hs = Math.max(26, Math.min(90, sec.h * 0.14)), yt = 60, yb = yt + hs;
  const tf = Math.max(2, hs * sec.tg / sec.h), tfd = Math.max(2, hs * sec.td / sec.h);
  let g = '';
  // belka
  if (sec.kind === 'RHS') g += `<rect x="${X(0)}" y="${yt}" width="${X(L) - X(0)}" height="${hs}" fill="#c9d4e6" stroke="#1b2230"/><line x1="${X(0)}" y1="${yt + tf}" x2="${X(L)}" y2="${yt + tf}" stroke="#7a8494" stroke-dasharray="6 3"/><line x1="${X(0)}" y1="${yb - tfd}" x2="${X(L)}" y2="${yb - tfd}" stroke="#7a8494" stroke-dasharray="6 3"/>`;
  else g += `<rect x="${X(0)}" y="${yt}" width="${X(L) - X(0)}" height="${tf}" fill="#c9d4e6" stroke="#1b2230"/><rect x="${X(0)}" y="${yb - tfd}" width="${X(L) - X(0)}" height="${tfd}" fill="#c9d4e6" stroke="#1b2230"/><rect x="${X(0)}" y="${yt + tf}" width="${X(L) - X(0)}" height="${hs - tf - tfd}" fill="#eef0f3" stroke="#9aa3b0" stroke-width="0.6"/>`;
  // podpory i węzły
  md.sup.forEach((p, i) => {
    const x = X(p.x), sp = S.podpory[i] || {}, w = sp.wezel || { typ: 'brak' };
    let d = '';
    if (w.typ === 'blacha_czolowa') {
      const tp = Math.max(3, U.num(w.tp) * hs / sec.h * 1.5), hp = U.num(w.hp) / sec.h * hs, ym = (yt + yb) / 2, side = p.x < L / 2 ? -1 : 1;
      d += `<rect x="${side < 0 ? x - tp : x}" y="${ym - hp / 2}" width="${tp}" height="${hp}" fill="#b5651d" fill-opacity="0.45" stroke="#b5651d"/>`;
      d += `<rect x="${side < 0 ? x - tp - 18 : x + tp}" y="${yt - 20}" width="18" height="${hs + 40}" fill="#eef0f3" stroke="#9aa3b0"/>`;
      const nr = Math.max(1, Math.round(U.num(w.nr))); for (let k = 0; k < nr; k++) { const yy = ym - hp / 2 + (k + 0.5) * hp / nr; d += `<line x1="${x - tp - 8}" y1="${yy}" x2="${x + tp + 8}" y2="${yy}" stroke="#39414f" stroke-width="2"/>`; }
    } else if (w.typ === 'katowniki') {
      const hp = U.num(w.hp) / sec.h * hs, ym = (yt + yb) / 2, side = p.x < L / 2 ? -1 : 1, wz = 18;
      d += `<rect x="${side < 0 ? x - 4 : x - wz + 4}" y="${ym - hp / 2}" width="${wz}" height="${hp}" fill="#b5651d" fill-opacity="0.45" stroke="#b5651d"/><rect x="${side < 0 ? x - 22 : x + 4}" y="${yt - 20}" width="18" height="${hs + 40}" fill="#eef0f3" stroke="#9aa3b0"/>`;
      const n = Math.max(1, Math.round(U.num(w.nr))); for (let k = 0; k < n; k++) d += `<circle cx="${x + side * -6}" cy="${ym - hp / 2 + (k + 0.5) * hp / n}" r="2.4" fill="#39414f"/>`;
    } else if (w.typ === 'spawane') {
      const side = p.x < L / 2 ? -1 : 1;
      d += `<rect x="${side < 0 ? x - 18 : x}" y="${yt - 20}" width="18" height="${hs + 40}" fill="#eef0f3" stroke="#9aa3b0"/><line x1="${x}" y1="${w.spoiny === 'srodnik' ? yt + tf : yt}" x2="${x}" y2="${w.spoiny === 'srodnik' ? yb - tfd : yb}" stroke="#c0262d" stroke-width="3"/>`;
    } else if (w.typ === 'blacha_zebrowa') {
      const hp = U.num(w.hp) / sec.h * hs, ym = (yt + yb) / 2, side = p.x < L / 2 ? -1 : 1, wz = 22;
      d += `<rect x="${side < 0 ? x - 6 : x - wz + 6}" y="${ym - hp / 2}" width="${wz}" height="${hp}" fill="#b5651d" fill-opacity="0.35" stroke="#b5651d"/><rect x="${side < 0 ? x - 24 : x + 6}" y="${yt - 20}" width="18" height="${hs + 40}" fill="#eef0f3" stroke="#9aa3b0"/>`;
      const n = Math.max(1, Math.round(U.num(w.n))); for (let k = 0; k < n; k++) d += `<circle cx="${x + side * -2}" cy="${ym - hp / 2 + (k + 0.5) * hp / n}" r="2.6" fill="#39414f"/>`;
    } else {
      if (w.typ === 'oparcie' && w.podloze !== 'stal') { const lp = Math.max(10, U.num(w.lp) / L * (W - ml - mr)); d += `<rect x="${x - lp / 2}" y="${yb}" width="${lp}" height="5" fill="#b5651d" fill-opacity="0.5" stroke="#b5651d"/><rect x="${x - lp / 2 - 10}" y="${yb + 5}" width="${lp + 20}" height="34" fill="#eef0f3" stroke="#9aa3b0"/>${tx(x, yb + 27, w.podloze === 'mur' ? 'mur' : 'beton', { fs: 9, c: '#7a8494' })}`; }
      else d += supportSym(p, x, yb);
      if (w.zebro) d += `<line x1="${x}" y1="${yt + tf}" x2="${x}" y2="${yb - tfd}" stroke="#b5651d" stroke-width="3"/>`;
    }
    g += `<g class="jnt" data-sup="${i}" style="cursor:pointer"><title>Podpora ${p.id} – kliknij, aby zmienić węzeł/oparcie</title><rect x="${x - 26}" y="${yt - 24}" width="52" height="${hs + 70}" fill="#ffffff" fill-opacity="0"/>${d}${tx(x, yb + 52, p.id, { fs: 11, w: 700 })}</g>`;
  });
  (S.styki || []).forEach((st2, j) => { const x = X(U.clamp(U.num(st2.x) * 1000, 0, L)), lw = Math.max(16, Math.min(60, 0.5 * (W - ml - mr) * 400 / L)); g += `<g class="sty" data-sty="${j}" style="cursor:pointer"><title>Styk S${j + 1} (x = ${fmt(U.num(st2.x), 2)} m) – kliknij, aby projektować</title><rect x="${x - lw / 2 - 4}" y="${yt - 26}" width="${lw + 8}" height="${hs + 52}" fill="#ffffff" fill-opacity="0"/>${st2.typ === 'spawany' ? `<line x1="${x}" y1="${yt}" x2="${x}" y2="${yb}" stroke="#c0262d" stroke-width="2.5"/>` : `<rect x="${x - lw / 2}" y="${yt - 4}" width="${lw}" height="4" fill="#e6a35a" stroke="#b5651d"/><rect x="${x - lw / 2}" y="${yb}" width="${lw}" height="4" fill="#e6a35a" stroke="#b5651d"/><rect x="${x - lw / 3}" y="${yt + tf + 3}" width="${lw * 2 / 3}" height="${Math.max(6, hs - tf - tfd - 6)}" fill="#e6a35a" fill-opacity="0.5" stroke="#b5651d"/>`}<line x1="${x}" y1="${yt - 8}" x2="${x}" y2="${yb + 8}" stroke="#1b2230" stroke-width="0.8" stroke-dasharray="3 2"/>${tx(x, yt - 12, 'S' + (j + 1), { fs: 10, w: 700, c: '#b5651d' })}</g>`; });
  md.tmp.forEach((t, i) => { const x = X(t.x); g += `<g class="tsupp" data-tmp="${i}" style="cursor:pointer" opacity="0.7"><rect x="${x - 10}" y="${yb}" width="20" height="40" fill="#ffffff" fill-opacity="0"/><line x1="${x}" y1="${yb}" x2="${x}" y2="${yb + 34}" stroke="#a35d00" stroke-width="2" stroke-dasharray="4 3"/>${tx(x, yb + 46, t.id + ' (montaż)', { fs: 9, c: '#a35d00' })}</g>`; });
  (md.stez || []).forEach(z => { const x = X(z.x); g += `<g class="rst" data-rst="${z.src}" style="cursor:pointer"><title>Stężenie ${z.typ} x = ${fmt(z.x / 1000, 2)} m</title><path d="M ${x - 6} ${yt - 14} L ${x + 6} ${yt - 14} L ${x} ${yt - 2} Z" fill="#1d5bb8"/><line x1="${x}" y1="${yt - 30}" x2="${x}" y2="${yt - 14}" stroke="#1d5bb8"/></g>`; });
  if ((md.ciagle || {}).pasG) g += `<line x1="${X(0)}" y1="${yt - 5}" x2="${X(L)}" y2="${yt - 5}" stroke="#1d5bb8" stroke-width="2" stroke-dasharray="3 3"/>`;
  // żebra pośrednie
  (R.zebra || []).forEach(z => { const x = X(z.x); g += `<g class="stf" data-stf="${z.src}" style="cursor:pointer"><title>Żebro środnika x = ${fmt(z.x / 1000, 2)} m – ${z.strona === 'jedna' ? 'jednostronne' : 'obustronne'} ${fmt(z.bs, 0)}×${fmt(z.ts, 0)} mm${z.c > 0 ? `, wcięcia 45° c = ${fmt(z.c, 0)} mm` : ''} (kliknij, aby zmienić)</title><rect x="${x - 5}" y="${yt}" width="10" height="${hs}" fill="#ffffff" fill-opacity="0"/><line x1="${x}" y1="${yt + tf}" x2="${x}" y2="${yb - tfd}" stroke="#b5651d" stroke-width="2.2"/></g>`; });
  // wymiary
  let y = yb + 72;
  const xs = [0].concat(md.sup.map(p => p.x)).concat([L]).filter((v, i, arr) => arr.indexOf(v) === i).sort((p, q) => p - q);
  for (let i = 1; i < xs.length; i++) if (xs[i] - xs[i - 1] > 1) g += dimH(X(xs[i - 1]), X(xs[i]), y, fmt((xs[i] - xs[i - 1]) / 1000, 2));
  y += 26; g += dimH(X(0), X(L), y, `długość belki ${fmt(L / 1000, 2)} m · ${esc(sec.nazwa)}`);
  // kursor
  g += `<g class="ecur" style="display:none;pointer-events:none"><line class="ecl" x1="0" y1="${yt - 30}" x2="0" y2="${yb + 30}" stroke="#1d5bb8" stroke-dasharray="3 2"/></g>`;
  o.out && Object.assign(o.out, { X, ml, mr, W });
  return svgOpen(W, y + 14, 'class="elev"') + g + '</svg>';
};

/* ------------------------------------------------------------ piktogramy */
D.pict = function (id, w, h) {
  w = w || 120; h = h || 46;
  const sc = J0().SCHEMATY.find(q => q.id === id) || {};
  const nS = sc.przesla || 0, wl = sc.wspL ? 0.6 : 0, wr = sc.wspP ? (nS ? 0.6 : 2) : 0;
  const tot = nS + wl + wr || 1, X = (u) => 8 + (w - 16) * u / tot, yb = h / 2;
  let g = `<line x1="${X(0)}" y1="${yb}" x2="${X(tot)}" y2="${yb}" stroke="#1b2230" stroke-width="2.4"/>`;
  const pos = []; let u = wl; pos.push(u); for (let i = 0; i < nS; i++) { u += 1; pos.push(u); }
  (sc.sup || []).forEach((t, i) => { const x = X(pos[i]); g += t === 'utwierdzenie' ? `<line x1="${x}" y1="${yb - 9}" x2="${x}" y2="${yb + 9}" stroke="#1b2230" stroke-width="2.2"/>${[-8, -3, 2, 7].map(k => `<line x1="${x}" y1="${yb + k}" x2="${x + (i ? 5 : -5)}" y2="${yb + k + 4}" stroke="#1b2230" stroke-width="0.8"/>`).join('')}` : `<path d="M ${x} ${yb + 1} l -5 9 l 10 0 Z" fill="#ffffff" stroke="#1b2230"/>`; });
  if (sc.tmp) { const x = X(wl + 0.5); g += `<path d="M ${x} ${yb + 1} l -5 9 l 10 0 Z" fill="none" stroke="#a35d00" stroke-dasharray="2 1.5"/>`; }
  if (sc.stages) g += `<line x1="${X(0)}" y1="${yb - 4}" x2="${X(tot)}" y2="${yb - 4}" stroke="#1d5bb8" stroke-dasharray="2 2"/>`;
  return svgOpen(w, h) + g + '</svg>';
};
const J0 = () => BS.J;
})();

</script>
<script>/* src/ui/rys_wezly.js */
/* =====================================================================
   BelkaStal – rysunki połączeń w skali: widok z boku (elewacja) i widok
   od czoła / z góry, dla blachy czołowej, blachy żebrowej, kątowników,
   połączenia spawanego oraz styku nakładkowego.  Numeracja śrub, łańcuchy
   wymiarowe, kolor śrub wg wytężenia; elementy klikane (class="jz",
   data-jz: plate, bolts, weld, sup, beam, notch, angle, fcov, wcov).
   ===================================================================== */
(function () {
'use strict';
const BS = window.BS, U = BS.U, Q = BS.Q, D = BS.D;
const { esc, fmt, tx, svgOpen, dimH, dimV } = Q;
const C = { st: '#1b2230', beam: '#c9d4e6', web: '#eef0f3', pl: '#e6a35a', ang: '#b5651d', sup: '#cfd4db', bolt: '#39414f', weld: '#c0262d', dim: '#5d6778', hi: '#1d5bb8' };
const num = (v, d) => U.num(v, d);
const hz = (z, cls, title, body) => `<g class="jz" data-jz="${z}" style="cursor:pointer">${title ? `<title>${esc(title)}</title>` : ''}${body}</g>`;
const rect = (x, y, w, h, fill, o) => `<rect x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" width="${Math.max(0.5, w).toFixed(1)}" height="${Math.max(0.5, h).toFixed(1)}" fill="${fill}" ${o && o.op ? `fill-opacity="${o.op}"` : ''} stroke="${(o && o.s) || C.st}" stroke-width="${(o && o.sw) || 1}" ${o && o.dash ? `stroke-dasharray="${o.dash}"` : ''}/>`;
const boltCol = (u) => (u > 1 ? '#c0262d' : u > 0.85 ? '#a35d00' : u > 0.6 ? '#1d5bb8' : '#39414f');
// śruba w widoku (okrąg z numerem), u – wytężenie śruby
const boltC = (x, y, r, n, u, t) => `<g class="jz" data-jz="bolts" style="cursor:pointer"><title>${esc(t || '')}</title><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#ffffff" stroke="${boltCol(u)}" stroke-width="${u > 0.85 ? 2 : 1.3}"/><line x1="${(x - r * 0.7).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + r * 0.7).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${boltCol(u)}" stroke-width="0.6"/><line x1="${x.toFixed(1)}" y1="${(y - r * 0.7).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y + r * 0.7).toFixed(1)}" stroke="${boltCol(u)}" stroke-width="0.6"/>${n ? tx(x + r + 2, y - r - 1, String(n), { fs: 8.5, c: boltCol(u), a: 'start' }) : ''}</g>`;
// śruba w przekroju (trzpień + łeb + nakrętka)
const boltS = (x1, x2, y, d, k, vert) => {
  const h = d * k / 2, hd = Math.max(3, 0.7 * d * k), nt = Math.max(3, 0.8 * d * k);
  if (vert) return `<g class="jz" data-jz="bolts" style="cursor:pointer"><line x1="${y}" y1="${x1}" x2="${y}" y2="${x2}" stroke="${C.bolt}" stroke-width="${Math.max(1.2, 2 * h)}" stroke-opacity="0.55"/>${rect(y - h * 1.7, x1 - hd, 3.4 * h, hd, C.bolt, { op: 0.8 })}${rect(y - h * 1.7, x2, 3.4 * h, nt, C.bolt, { op: 0.8 })}</g>`;
  return `<g class="jz" data-jz="bolts" style="cursor:pointer"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${C.bolt}" stroke-width="${Math.max(1.2, 2 * h)}" stroke-opacity="0.55"/>${rect(x1 - hd, y - h * 1.7, hd, 3.4 * h, C.bolt, { op: 0.8 })}${rect(x2, y - h * 1.7, nt, 3.4 * h, C.bolt, { op: 0.8 })}</g>`;
};
const weldTri = (x, y, s, dir) => { const d = dir || 1; return `<path d="M ${x} ${y} l ${d * s} 0 l ${-d * s} ${s} z" fill="${C.weld}" fill-opacity="0.8"/>`; };
const chainV = (x, ys, labs, right) => { let g = ''; for (let i = 1; i < ys.length; i++) if (ys[i] - ys[i - 1] > 2) g += dimV(x, ys[i - 1], ys[i], labs[i - 1], { right, fs: 9.5 }); return g; };
const chainH = (y, xs, labs, below) => { let g = ''; for (let i = 1; i < xs.length; i++) if (xs[i] - xs[i - 1] > 2) g += dimH(xs[i - 1], xs[i], y, labs[i - 1], { below, fs: 9.5 }); return g; };
const L = (v) => fmt(v, 0);
function boltInfo(o, B) {
  const m = Math.max(1e-9, ...(o.bolts || []).map(b => b.F));
  return (b) => ({ u: B ? b.F / Math.max(1e-9, B.Fv * (o.typ === 'katowniki' || o.typ === 'nakladkowy' ? 2 : 1)) : b.F / m, t: `Śruba ${b.id || ''}: F_x = ${fmt(b.Fx / 1e3, 1)} kN, F_z = ${fmt(b.Fz / 1e3, 1)} kN, F = ${fmt(b.F / 1e3, 1)} kN` });
}

/* ---------------------------------------------------------- belka w widoku z boku (z podcięciami) */
function beamSide(sec, X, Y, x0, x1, w) {
  const h = sec.h, tg = sec.tg || sec.t || 0, td = sec.td || sec.t || 0, dnt = num(w.dnt), dnb = num(w.dnb), ln = num(w.ln);
  let g = '';
  const xn = x0 + (dnt > 0 || dnb > 0 ? ln : 0);
  // środnik
  const zt = dnt > 0 ? dnt : 0, zb = dnb > 0 ? h - dnb : h;
  g += `<path d="M ${X(x0)} ${Y(zt)} L ${X(xn)} ${Y(zt)} L ${X(xn)} ${Y(0)} L ${X(x1)} ${Y(0)} L ${X(x1)} ${Y(h)} L ${X(xn)} ${Y(h)} L ${X(xn)} ${Y(zb)} L ${X(x0)} ${Y(zb)} Z" fill="${C.web}" stroke="${C.st}" stroke-width="1"/>`;
  // pasy
  if (sec.kind !== 'RHS') {
    g += rect(X(dnt > 0 ? xn : x0), Y(0), X(x1) - X(dnt > 0 ? xn : x0), Y(tg) - Y(0), C.beam);
    g += rect(X(dnb > 0 ? xn : x0), Y(h - td), X(x1) - X(dnb > 0 ? xn : x0), Y(h) - Y(h - td), C.beam);
  } else g += `<line x1="${X(x0)}" y1="${Y(tg)}" x2="${X(x1)}" y2="${Y(tg)}" stroke="${C.dim}" stroke-dasharray="5 3"/><line x1="${X(x0)}" y1="${Y(h - td)}" x2="${X(x1)}" y2="${Y(h - td)}" stroke="${C.dim}" stroke-dasharray="5 3"/>`;
  if (dnt > 0 || dnb > 0) g = hz('notch', '', 'Podcięcie belki – kliknij, aby zmienić', g); else g = hz('beam', '', 'Belka', g);
  g += `<path d="M ${X(x1)} ${Y(-6)} l 6 ${(Y(h) - Y(0)) / 2 + 6} l -6 ${(Y(h) - Y(0)) / 2 + 6}" fill="none" stroke="${C.dim}" stroke-width="0.8"/>`;
  return g;
}
function supportSide(X, Y, h, t, w) {
  const tt = Math.max(8, t);
  return hz('sup', '', `${(BS.W.PODPORA[w.sup] || 'Element podpierający')} – t = ${fmt(num(w.tsup), 0)} mm (kliknij, aby zmienić)`, rect(X(-tt), Y(-40), X(0) - X(-tt), Y(h + 40) - Y(-40), C.sup, { s: '#7a8494' }) + `<line x1="${X(-tt) - 10}" y1="${Y(-40)}" x2="${X(-tt) - 10}" y2="${Y(h + 40)}" stroke="#9aa3b0" stroke-dasharray="8 3 2 3" stroke-width="0.7"/>`);
}
function frame(Wpx, Hpx, ext, pad) {
  const k = Math.min((Wpx - pad.l - pad.r) / (ext.x1 - ext.x0), (Hpx - pad.t - pad.b) / (ext.z1 - ext.z0));
  const X = (x) => +(pad.l + (x - ext.x0) * k).toFixed(1), Y = (z) => +(pad.t + (z - ext.z0) * k).toFixed(1);
  return { k, X, Y, W: Math.ceil(pad.l + (ext.x1 - ext.x0) * k + pad.r), H: Math.ceil(pad.t + (ext.z1 - ext.z0) * k + pad.b) };
}

/* ---------------------------------------------------------- połączenia podporowe */
D.jointViews = function (sec, w, o, opt) {
  opt = opt || {};
  const Wv = opt.W || 520, Hv = opt.H || 400, t = w.typ, h = sec.h, tsup = Math.max(8, num(w.tsup, 12));
  const B = o && o.B, d = B ? B.dd : 16, bi = boltInfo(o || {}, B);
  let el = '', se = '';
  if (t === 'blacha_czolowa') {
    const g = o.geom, hp = g.hp, tp = g.tp, zp = (h - hp) / 2, Lb = Math.max(250, 1.2 * h);
    const F = frame(Wv, Hv, { x0: -tsup - 40, x1: Lb, z0: -30, z1: h + 30 }, { l: 50, r: 20, t: 26, b: 40 }), X = F.X, Y = F.Y, k = F.k;
    el += supportSide(X, Y, h, tsup, w) + beamSide(sec, X, Y, tp, Lb, w);
    el += hz('plate', `Blacha czołowa ${L(hp)}×${L(g.bp)}×${L(tp)} mm`, '', rect(X(0), Y(zp), X(tp) - X(0), Y(zp + hp) - Y(zp), C.pl));
    el += hz('weld', `Spoiny a = ${fmt(g.a, 0)} mm`, '', weldTri(X(tp), Y(zp + 4), Math.max(3, g.a * k * 1.2)) + weldTri(X(tp), Y(zp + hp - 4 - Math.max(3, g.a * k * 1.2)), Math.max(3, g.a * k * 1.2)));
    const zs = []; for (let i = 0; i < g.nr; i++) zs.push(zp + g.e1 + i * g.p1);
    zs.forEach(z => { el += boltS(X(-tsup), X(tp), Y(z), d, k); });
    el += chainV(X(-tsup) - 22, [zp].concat(zs).concat([zp + hp]).map(Y), [L(g.e1)].concat(zs.slice(1).map(() => L(g.p1))).concat([L(hp - g.e1 - (g.nr - 1) * g.p1)]));
    el += dimV(X(Lb) - 14, Y(0), Y(h), `h = ${L(h)}`, { fs: 9.5 }) + tx(X(tp) + 4, Y(zp) - 5, `t_p = ${L(tp)}`.replace('t_p', 't<tspan font-size="7" dy="2">p</tspan><tspan dy="-2"></tspan>'), { a: 'start', fs: 9.5, c: C.ang });
    el = svgOpen(F.W, F.H, 'class="jsvg"') + el + '</svg>';
    // widok od czoła (blacha z otworami, przekrój belki za blachą)
    const F2 = frame(Math.min(Wv, 420), Hv, { x0: -Math.max(g.bp, sec.bg || sec.b || 100) / 2 - 30, x1: Math.max(g.bp, sec.bg || sec.b || 100) / 2 + 40, z0: -30, z1: h + 30 }, { l: 46, r: 70, t: 26, b: 46 }), X2 = F2.X, Y2 = F2.Y, k2 = F2.k;
    const bg = sec.bg || sec.b, bd = sec.bd || sec.b, tg = sec.tg || 0, td = sec.td || 0, tw = sec.tw;
    se += `<g stroke="${C.dim}" stroke-dasharray="4 3" fill="none"><rect x="${X2(-bg / 2)}" y="${Y2(0)}" width="${bg * k2}" height="${tg * k2}"/><rect x="${X2(-bd / 2)}" y="${Y2(h - td)}" width="${bd * k2}" height="${td * k2}"/><rect x="${X2(-tw / 2)}" y="${Y2(tg)}" width="${tw * k2}" height="${(h - tg - td) * k2}"/></g>`;
    se += hz('plate', 'Blacha czołowa', '', rect(X2(-g.bp / 2), Y2(zp), g.bp * k2, hp * k2, C.pl, { op: 0.55 }));
    se += hz('weld', 'Spoiny pachwinowe środnik–blacha', '', rect(X2(-tw / 2 - g.a), Y2(zp + g.a), (tw + 2 * g.a) * k2, (hp - 2 * g.a) * k2, C.weld, { op: 0.35, s: C.weld, sw: 0.6 }));
    let id = 0;
    zs.forEach(z => [-1, 1].forEach(s => { const b = (o.bolts || [])[id++] || { F: 0, Fx: 0, Fz: 0 }; const q = bi(b); se += boltC(X2(s * g.p3 / 2), Y2(z), Math.max(3, B.d0 * k2 / 2), id, q.u, q.t); }));
    se += chainH(Y2(zp + hp) + 18, [-g.bp / 2, -g.p3 / 2, g.p3 / 2, g.bp / 2].map(X2), [L(g.e2), L(g.p3), L(g.e2)], true);
    se += dimV(X2(g.bp / 2) + 22, Y2(zp), Y2(zp + hp), `h_p = ${L(hp)}`.replace('h_p', 'h<tspan font-size="7" dy="2">p</tspan><tspan dy="-2"></tspan>'), { right: true, fs: 9.5 });
    se = svgOpen(F2.W, F2.H, 'class="jsvg"') + se + tx(F2.W / 2, 14, 'Widok od czoła (A–A)', { fs: 10, c: C.dim }) + '</svg>';
    el = el.replace('</svg>', tx(F.W / 2, 14, 'Widok z boku', { fs: 10, c: C.dim }) + '</svg>');
  } else if (t === 'blacha_zebrowa') {
    const g = o.geom, hp = g.hp, zp = (h - hp) / 2, lp = g.z + (g.nc - 1) * g.p2 + g.e2, Lb = Math.max(lp + 120, 1.1 * h);
    const F = frame(Wv, Hv, { x0: -tsup - 30, x1: Lb, z0: -30, z1: h + 34 }, { l: 50, r: 20, t: 26, b: 52 }), X = F.X, Y = F.Y, k = F.k;
    el += supportSide(X, Y, h, tsup, w) + beamSide(sec, X, Y, g.gap, Lb, w);
    el += hz('plate', `Blacha żebrowa ${L(hp)}×${L(lp)}×${L(g.tp)} mm`, '', rect(X(0), Y(zp), X(lp) - X(0), Y(zp + hp) - Y(zp), C.pl, { op: 0.65 }));
    el += hz('weld', `Spoiny a = ${L(g.a)} mm`, '', `<line x1="${X(0) + 1.5}" y1="${Y(zp)}" x2="${X(0) + 1.5}" y2="${Y(zp + hp)}" stroke="${C.weld}" stroke-width="3"/>`);
    (o.bolts || []).forEach(b => { const q = bi(b); el += boltC(X(b.x), Y(zp + b.z), Math.max(3, B.d0 * k / 2), b.id, q.u, q.t); });
    const zs = []; for (let i = 0; i < g.nr; i++) zs.push(zp + g.e1 + i * g.p1);
    el += chainV(X(-tsup) - 20, [zp].concat(zs).concat([zp + hp]).map(Y), [L(g.e1)].concat(zs.slice(1).map(() => L(g.p1))).concat([L(hp - g.e1 - (g.nr - 1) * g.p1)]));
    const xs = [0, g.z]; for (let j = 1; j < g.nc; j++) xs.push(g.z + j * g.p2); xs.push(lp);
    el += chainH(Y(h) + 16, xs.map(X), [L(g.z)].concat(xs.slice(2, -1).map(() => L(g.p2))).concat([L(g.e2)]), true);
    el += dimH(X(0), X(g.gap), Y(h) + 34, `g = ${L(g.gap)}`, { below: true, fs: 9 }) + dimH(X(g.gap), X(g.z), Y(-14), `e₂,b = ${L(g.e2b)}`, { fs: 9 });
    el = svgOpen(F.W, F.H, 'class="jsvg"') + el + tx(F.W / 2, 14, 'Widok z boku', { fs: 10, c: C.dim }) + '</svg>';
    // widok z góry
    const bw2 = sec.bg || sec.b || 150, F2 = frame(Math.min(Wv, 420), Math.min(Hv, 300), { x0: -tsup - 20, x1: Lb, z0: -bw2 / 2 - 20, z1: bw2 / 2 + 30 }, { l: 30, r: 20, t: 26, b: 34 }), X2 = F2.X, Y2 = F2.Y, k2 = F2.k, tw = sec.tw;
    se += hz('sup', '', '', rect(X2(-tsup), Y2(-bw2 / 2 - 15), tsup * k2, (bw2 + 30) * k2, C.sup, { s: '#7a8494' }));
    se += `<rect x="${X2(g.gap)}" y="${Y2(-bw2 / 2)}" width="${(Lb - g.gap) * k2}" height="${bw2 * k2}" fill="none" stroke="${C.dim}" stroke-dasharray="4 3"/>`;
    se += hz('beam', '', 'Środnik belki', rect(X2(g.gap), Y2(0), (Lb - g.gap) * k2, tw * k2, C.web));
    se += hz('plate', '', 'Blacha żebrowa', rect(X2(0), Y2(-g.tp), lp * k2, g.tp * k2, C.pl));
    se += hz('weld', '', 'Spoiny pachwinowe', weldTri(X2(0), Y2(-g.tp) - Math.max(3, g.a * k2), Math.max(3, g.a * k2)) + weldTri(X2(0), Y2(0), Math.max(3, g.a * k2)));
    for (let j = 0; j < g.nc; j++) se += boltS(Y2(-g.tp) , Y2(tw), X2(g.z + j * g.p2), d, k2, true);
    se += tx(X2(lp) + 4, Y2(-g.tp) - 3, `t_p = ${L(g.tp)}`, { a: 'start', fs: 9, c: C.ang });
    se = svgOpen(F2.W, F2.H, 'class="jsvg"') + se + tx(F2.W / 2, 14, 'Widok z góry', { fs: 10, c: C.dim }) + '</svg>';
  } else if (t === 'katowniki') {
    const g = o.geom, hp = g.hp, zp = (h - hp) / 2, Lb = Math.max(g.lb + 140, 1.1 * h);
    const F = frame(Wv, Hv, { x0: -tsup - 40, x1: Lb, z0: -30, z1: h + 34 }, { l: 50, r: 20, t: 26, b: 52 }), X = F.X, Y = F.Y, k = F.k;
    el += supportSide(X, Y, h, tsup, w) + beamSide(sec, X, Y, g.gap, Lb, w);
    el += hz('angle', `Kątowniki 2×L${String(w.L).replace(/x/g, '×')} dł. ${L(hp)} mm`, '', rect(X(0), Y(zp), X(g.lb) - X(0), Y(zp + hp) - Y(zp), C.ang, { op: 0.35 }) + rect(X(0), Y(zp), X(g.ta) - X(0), Y(zp + hp) - Y(zp), C.ang, { op: 0.7 }));
    (o.bolts || []).forEach(b => { const q = bi(b); el += boltC(X(b.x), Y(zp + b.z), Math.max(3, B.d0 * k / 2), b.id, q.u, q.t); });
    const zs = []; for (let i = 0; i < g.nr; i++) zs.push(zp + g.e1 + i * g.p1);
    zs.forEach(z => { el += boltS(X(-tsup), X(g.ta), Y(z) + Math.max(4, d * k * 0.9), d, k); });
    el += chainV(X(-tsup) - 22, [zp].concat(zs).concat([zp + hp]).map(Y), [L(g.e1)].concat(zs.slice(1).map(() => L(g.p1))).concat([L(hp - g.e1 - (g.nr - 1) * g.p1)]));
    el += chainH(Y(h) + 16, [0, g.gb, g.lb].map(X), [L(g.gb), L(g.lb - g.gb)], true) + dimH(X(0), X(g.gap), Y(h) + 34, `c = ${L(g.gap)}`, { below: true, fs: 9 });
    el = svgOpen(F.W, F.H, 'class="jsvg"') + el + tx(F.W / 2, 14, 'Widok z boku', { fs: 10, c: C.dim }) + '</svg>';
    const tw = sec.tw, half = tw / 2 + g.ls + 20, F2 = frame(Math.min(Wv, 420), Math.min(Hv, 320), { x0: -tsup - 20, x1: Math.max(Lb * 0.7, g.lb + 60), z0: -half, z1: half + 10 }, { l: 30, r: 20, t: 26, b: 34 }), X2 = F2.X, Y2 = F2.Y, k2 = F2.k;
    se += hz('sup', '', '', rect(X2(-tsup), Y2(-half + 5), tsup * k2, (2 * half - 10) * k2, C.sup, { s: '#7a8494' }));
    se += hz('beam', '', 'Środnik belki', rect(X2(g.gap), Y2(-tw / 2), (Math.max(Lb * 0.7, g.lb + 60) - g.gap) * k2, tw * k2, C.web));
    [-1, 1].forEach(s => {
      const y0 = s > 0 ? tw / 2 : -tw / 2 - g.ta, ys = s > 0 ? tw / 2 : -tw / 2 - g.ls;
      se += hz('angle', '', 'Kątownik', rect(X2(0), Y2(y0), g.lb * k2, g.ta * k2, C.ang, { op: 0.7 }) + rect(X2(0), Y2(ys), g.ta * k2, g.ls * k2, C.ang, { op: 0.7 }));
      se += boltS(X2(-tsup), X2(g.ta), Y2(s * (tw / 2 + g.gs)), d, k2);
    });
    se += boltS(Y2(-tw / 2 - g.ta), Y2(tw / 2 + g.ta), X2(g.gb), d, k2, true);
    se += dimV(X2(-tsup) - 12, Y2(tw / 2), Y2(tw / 2 + g.gs), `g_s = ${L(g.gs)}`.replace('g_s', 'g<tspan font-size="7" dy="2">s</tspan><tspan dy="-2"></tspan>'), { fs: 9 });
    se = svgOpen(F2.W, F2.H, 'class="jsvg"') + se + tx(F2.W / 2, 14, 'Widok z góry', { fs: 10, c: C.dim }) + '</svg>';
  } else if (t === 'spawane') {
    const Lb = Math.max(250, 1.2 * h), g = (o && o.geom) || {};
    const F = frame(Wv, Hv, { x0: -tsup - 30, x1: Lb, z0: -30, z1: h + 30 }, { l: 40, r: 20, t: 26, b: 30 }), X = F.X, Y = F.Y, k = F.k;
    el += supportSide(X, Y, h, tsup, w) + beamSide(sec, X, Y, 0, Lb, w);
    const aw = num(w.aw, 5) * k * 1.4;
    el += hz('weld', 'Spoiny – kliknij, aby zmienić', '', w.spoiny === 'czolowa' ? `<line x1="${X(0) + 1.5}" y1="${Y(0)}" x2="${X(0) + 1.5}" y2="${Y(h)}" stroke="${C.weld}" stroke-width="3.5"/>` : weldTri(X(0), Y((sec.tg || 0) + 6), Math.max(3, aw)) + `<line x1="${X(0) + 1}" y1="${Y(sec.tg || 0)}" x2="${X(0) + 1}" y2="${Y(h - (sec.td || 0))}" stroke="${C.weld}" stroke-width="2.4"/>` + (w.spoiny === 'obwodowe' ? `<line x1="${X(0) + 1}" y1="${Y(0)}" x2="${X(0) + 1}" y2="${Y(sec.tg || 0)}" stroke="${C.weld}" stroke-width="3"/><line x1="${X(0) + 1}" y1="${Y(h - (sec.td || 0))}" x2="${X(0) + 1}" y2="${Y(h)}" stroke="${C.weld}" stroke-width="3"/>` : ''));
    el = svgOpen(F.W, F.H, 'class="jsvg"') + el + tx(F.W / 2, 14, 'Widok z boku', { fs: 10, c: C.dim }) + '</svg>';
    // przekrój z liniami spoin
    if (o && o.geom && o.geom.lines && sec.rings) {
      const sv = D.section(sec, { size: 240 });
      se = sv.replace('</svg>', `${tx(120, 14, w.spoiny === 'obwodowe' ? 'spoiny obwodowe (środnik + pasy)' : w.spoiny === 'czolowa' ? 'spoina czołowa – pełny przetop' : 'spoiny środnika (dwustronne)', { fs: 10, c: C.weld })}</svg>`);
      se = hz('weld', '', 'Spoiny', se);
    } else se = '';
    void g;
  } else return { elev: '', sect: '' };
  return { elev: el, sect: se };
};

/* ---------------------------------------------------------- styk nakładkowy */
D.spliceViews = function (sec, s, o, opt) {
  opt = opt || {};
  if (!o || !o.geom) return { elev: '', sect: '' };
  const g = o.geom, h = sec.h, tg = sec.tg, td = sec.td, B = o.B, d = B ? B.dd : 20;
  const half = Math.max(g.Lf, g.Lw) / 2 + 60, Wv = opt.W || 620, Hv = opt.H || 400;
  const F = frame(Wv, Hv, { x0: -half, x1: half, z0: -g.tfo - 40, z1: h + g.tfo + 50 }, { l: 46, r: 20, t: 26, b: 46 }), X = F.X, Y = F.Y, k = F.k;
  let el = '';
  [-1, 1].forEach(sd => { const xa = sd * g.gap / 2, xb = sd * half; el += hz('beam', '', 'Belka', `<path d="M ${X(xa)} ${Y(0)} L ${X(xb)} ${Y(0)} L ${X(xb)} ${Y(h)} L ${X(xa)} ${Y(h)} Z" fill="${C.web}" stroke="${C.st}"/>` + rect(Math.min(X(xa), X(xb)), Y(0), Math.abs(X(xb) - X(xa)), tg * k, C.beam) + rect(Math.min(X(xa), X(xb)), Y(h - td), Math.abs(X(xb) - X(xa)), td * k, C.beam)); });
  el += hz('fcov', `Nakładki pasów ${L(g.bfo)}×${L(g.tfo)}${g.tfi > 0 ? ` + 2×${L(g.bfi)}×${L(g.tfi)}` : ''} mm, dł. ${L(g.Lf)} mm`, '', rect(X(-g.Lf / 2), Y(-g.tfo), g.Lf * k, g.tfo * k, C.pl) + rect(X(-g.Lf / 2), Y(h), g.Lf * k, g.tfo * k, C.pl) + (g.tfi > 0 ? rect(X(-g.Lf / 2), Y(tg), g.Lf * k, g.tfi * k, C.pl, { op: 0.6 }) + rect(X(-g.Lf / 2), Y(h - td - g.tfi), g.Lf * k, g.tfi * k, C.pl, { op: 0.6 }) : ''));
  const zw = (h - g.hpw) / 2;
  el += hz('wcov', `Nakładki środnika 2×${L(g.hpw)}×${L(g.tpw)} mm, dł. ${L(g.Lw)} mm`, '', rect(X(-g.Lw / 2), Y(zw), g.Lw * k, g.hpw * k, C.pl, { op: 0.45 }));
  for (let i = 0; i < g.nf; i++) [-1, 1].forEach(sd => { const x = sd * (g.gap / 2 + g.ef + i * g.p1f); el += boltS(Y(-g.tfo), Y(tg + (g.tfi || 0)), X(x), d, k, true) + boltS(Y(h - td - (g.tfi || 0)), Y(h + g.tfo), X(x), d, k, true); });
  const bi = boltInfo(o, B);
  (o.bolts || []).forEach(b => [-1, 1].forEach(sd => { const q = bi(b); el += boltC(X(sd * b.x), Y(zw + b.z), Math.max(3, B.d0 * k / 2), sd > 0 ? b.id : '', q.u, q.t); }));
  const fx = [0]; for (let i = 0; i < g.nf; i++) fx.push(g.gap / 2 + g.ef + i * g.p1f); fx.push(g.Lf / 2);
  el += chainH(Y(-g.tfo) - 14, fx.map(X), [L(g.gap / 2 + g.ef)].concat(fx.slice(2, -1).map(() => L(g.p1f))).concat([L(g.e1f)]));
  const zs = [zw]; for (let i = 0; i < g.nw; i++) zs.push(zw + g.e1w + i * g.p1w); zs.push(zw + g.hpw);
  el += chainV(X(-half) + 10, zs.map(Y), [L(g.e1w)].concat(zs.slice(2, -1).map(() => L(g.p1w))).concat([L(g.e1w)]), true);
  el += dimH(X(-g.gap / 2), X(g.gap / 2), Y(h + g.tfo) + 30, `g = ${L(g.gap)}`, { below: true, fs: 9 });
  el = svgOpen(F.W, F.H, 'class="jsvg"') + el + tx(F.W / 2, 14, 'Widok z boku – styk', { fs: 10, c: C.dim }) + '</svg>';
  // przekrój poprzeczny w styku
  const bf = Math.max(sec.bg, g.bfo), F2 = frame(Math.min(Wv, 380), Hv, { x0: -bf / 2 - 30, x1: bf / 2 + 30, z0: -g.tfo - 30, z1: h + g.tfo + 30 }, { l: 30, r: 20, t: 26, b: 30 }), X2 = F2.X, Y2 = F2.Y, k2 = F2.k;
  let se = hz('beam', '', 'Przekrój belki', rect(X2(-sec.bg / 2), Y2(0), sec.bg * k2, tg * k2, C.beam) + rect(X2(-sec.bd / 2), Y2(h - td), sec.bd * k2, td * k2, C.beam) + rect(X2(-sec.tw / 2), Y2(tg), sec.tw * k2, (h - tg - td) * k2, C.beam));
  se += hz('fcov', '', 'Nakładki pasów', rect(X2(-g.bfo / 2), Y2(-g.tfo), g.bfo * k2, g.tfo * k2, C.pl) + rect(X2(-g.bfo / 2), Y2(h), g.bfo * k2, g.tfo * k2, C.pl) + (g.tfi > 0 ? [-1, 1].map(sd => rect(X2(sd > 0 ? sec.tw / 2 + (sec.r || 0) : -sec.tw / 2 - (sec.r || 0) - g.bfi), Y2(tg), g.bfi * k2, g.tfi * k2, C.pl) + rect(X2(sd > 0 ? sec.tw / 2 + (sec.r || 0) : -sec.tw / 2 - (sec.r || 0) - g.bfi), Y2(h - td - g.tfi), g.bfi * k2, g.tfi * k2, C.pl)).join('') : ''));
  se += hz('wcov', '', 'Nakładki środnika', rect(X2(-sec.tw / 2 - g.tpw), Y2(zw), g.tpw * k2, g.hpw * k2, C.pl) + rect(X2(sec.tw / 2), Y2(zw), g.tpw * k2, g.hpw * k2, C.pl));
  [-1, 1].forEach(sd => { se += boltS(Y2(-g.tfo), Y2(tg + (g.tfi || 0)), X2(sd * g.gf / 2), d, k2, true) + boltS(Y2(h - td - (g.tfi || 0)), Y2(h + g.tfo), X2(sd * g.gf / 2), d, k2, true); });
  for (let i = 0; i < g.nw; i++) se += boltS(X2(-sec.tw / 2 - g.tpw), X2(sec.tw / 2 + g.tpw), Y2(zw + g.e1w + i * g.p1w), d, k2);
  se += dimH(X2(-g.gf / 2), X2(g.gf / 2), Y2(h + g.tfo) + 16, `g_f = ${L(g.gf)}`, { below: true, fs: 9 });
  se = svgOpen(F2.W, F2.H, 'class="jsvg"') + se + tx(F2.W / 2, 14, 'Przekrój w styku', { fs: 10, c: C.dim }) + '</svg>';
  return { elev: el, sect: se };
};

/* ---------------------------------------------------------- piktogramy rodzajów połączeń */
D.jointPict = function (t) {
  const s = (b) => `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="44" viewBox="0 0 64 44">${b}</svg>`;
  const sup = '<rect x="2" y="2" width="7" height="40" fill="#cfd4db" stroke="#7a8494"/>', beam = (x) => `<rect x="${x}" y="8" width="${62 - x}" height="4" fill="#c9d4e6" stroke="#1b2230" stroke-width="0.8"/><rect x="${x}" y="32" width="${62 - x}" height="4" fill="#c9d4e6" stroke="#1b2230" stroke-width="0.8"/><rect x="${x}" y="12" width="${62 - x}" height="20" fill="#eef0f3" stroke="#9aa3b0" stroke-width="0.5"/>`;
  const bolt = (x, y) => `<circle cx="${x}" cy="${y}" r="2" fill="#ffffff" stroke="#39414f"/>`;
  if (t === 'blacha_czolowa') return s(sup + beam(13) + '<rect x="9" y="12" width="4" height="20" fill="#e6a35a" stroke="#1b2230" stroke-width="0.8"/><line x1="4" y1="17" x2="15" y2="17" stroke="#39414f" stroke-width="2"/><line x1="4" y1="27" x2="15" y2="27" stroke="#39414f" stroke-width="2"/>');
  if (t === 'blacha_zebrowa') return s(sup + beam(13) + '<rect x="9" y="13" width="18" height="18" fill="#e6a35a" fill-opacity="0.7" stroke="#1b2230" stroke-width="0.8"/>' + bolt(20, 17) + bolt(20, 27));
  if (t === 'katowniki') return s(sup + beam(13) + '<rect x="9" y="13" width="16" height="18" fill="#b5651d" fill-opacity="0.45" stroke="#1b2230" stroke-width="0.8"/><rect x="9" y="13" width="3" height="18" fill="#b5651d" stroke="#1b2230" stroke-width="0.6"/>' + bolt(19, 17) + bolt(19, 27));
  if (t === 'spawane') return s(sup + beam(9) + '<line x1="10" y1="12" x2="10" y2="32" stroke="#c0262d" stroke-width="2.5"/>');
  if (t === 'oparcie') return s('<rect x="2" y="30" width="60" height="12" fill="#eef0f3" stroke="#9aa3b0"/><rect x="10" y="26" width="26" height="4" fill="#e6a35a" stroke="#1b2230" stroke-width="0.8"/><rect x="6" y="6" width="56" height="3" fill="#c9d4e6" stroke="#1b2230" stroke-width="0.8"/><rect x="6" y="23" width="56" height="3" fill="#c9d4e6" stroke="#1b2230" stroke-width="0.8"/><rect x="6" y="9" width="56" height="14" fill="#eef0f3" stroke="#9aa3b0" stroke-width="0.5"/>');
  if (t === 'brak') return s('<rect x="2" y="30" width="60" height="12" fill="#cfd4db" stroke="#7a8494"/><rect x="6" y="6" width="56" height="3" fill="#c9d4e6" stroke="#1b2230" stroke-width="0.8"/><rect x="6" y="27" width="56" height="3" fill="#c9d4e6" stroke="#1b2230" stroke-width="0.8"/><rect x="6" y="9" width="56" height="18" fill="#eef0f3" stroke="#9aa3b0" stroke-width="0.5"/><line x1="20" y1="9" x2="20" y2="27" stroke="#b5651d" stroke-width="2"/>');
  if (t === 'nakladkowy') return s('<rect x="2" y="12" width="28" height="20" fill="#eef0f3" stroke="#1b2230" stroke-width="0.8"/><rect x="34" y="12" width="28" height="20" fill="#eef0f3" stroke="#1b2230" stroke-width="0.8"/><rect x="12" y="8" width="40" height="4" fill="#e6a35a" stroke="#1b2230" stroke-width="0.8"/><rect x="12" y="32" width="40" height="4" fill="#e6a35a" stroke="#1b2230" stroke-width="0.8"/><rect x="18" y="15" width="28" height="14" fill="#e6a35a" fill-opacity="0.5" stroke="#1b2230" stroke-width="0.6"/>' + bolt(24, 22) + bolt(40, 22));
  if (t === 'spawany') return s('<rect x="2" y="12" width="29" height="20" fill="#eef0f3" stroke="#1b2230" stroke-width="0.8"/><rect x="33" y="12" width="29" height="20" fill="#eef0f3" stroke="#1b2230" stroke-width="0.8"/><path d="M 31 12 L 33 12 L 33 32 L 31 32 Z" fill="#c0262d"/>');
  return s('');
};
})();

  else h += `<p>Sprężysty moment krytyczny M<sub>cr</sub> wyznaczono metodą elementów skończonych (u, u′, φ, φ′) z równania K<sub>E</sub>·x = α<sub>cr</sub>·K<sub>G</sub>·x dla rozkładu M<sub>y</sub>(x) każdej decydującej kombinacji, z wysokością przyłożenia obciążeń względem środka ścinania${Math.abs(sec.betaZ || 0) > 0.5 ? ', członem monosymetrii β<sub>z</sub>' : ''}, warunkami podparcia (widełkowe / pełne) i stężeniami. M<sub>cr,seg</sub> = α<sub>cr</sub>·|M<sub>Ed,max,seg</sub>|.</p>`;
  (R.ltb || []).forEach((L, s) => {
    if (!L) return;
    if (nE > 1) h += `<h3>Etap ${s + 1}: ${esc(md.etapy[s].nazwa)}</h3>`;
    h += line('Mnożniki krytyczne: ' + L.runs.map(r => `${esc(r.combo.opis)}: α<sub>cr</sub> = ${r.err ? esc(r.err) : r.lam === Infinity ? '∞' : f(r.lam, 3)}`).join('; '));
    L.segs.forEach((g, k) => { if (g.brak) return; h += mk(`${s}-LT${k}`, ltbTxt(g, mat, ndp)); });
    const gov = L.runs.filter(r => r.mode).sort((a, b2) => a.lam - b2.lam)[0];
    if (gov && gov.lam <= 100) h += `<div class="fig">${D.mode(gov.mode, md.L, md.systems[s].map(p => p.x), { width: 900, title: `Postać zwichrzenia${nE > 1 ? `, etap ${s + 1}` : ''}: α_cr = ${f(gov.lam, 3)}` })}</div>`;
    L.inter.forEach((it, k) => { h += mk(`${s}-I${k}`, interTxt(it)); });
  });
  // ---------------------------------------------------------- 8. SGU
  h += H2('SGU – ugięcia i drgania');
  const sg = R.sgu;
  h += `<p>Kryteria: w<sub>max</sub> ≤ L/${esc(String(S.sgu.wmax))}, w<sub>3</sub> ≤ L/${esc(String(S.sgu.w3))} (wspornik: L = 2·L<sub>w</sub>); ugięcia względem cięciwy podpór przęsła, kombinacje charakterystyczne z historią etapów. Podniesienie wykonawcze: ${S.sgu.podniesienie === 'brak' ? 'brak' : S.sgu.podniesienie === 'auto' ? `równe ugięciu od G (w<sub>c,max</sub> = ${f(sg.wcMax, 1)} mm)` : `w<sub>c</sub> = ${f(U.num(S.sgu.wc), 1)} mm`}.</p>`;
  sg.seg.forEach((r) => { h += mk(`w-${r.sg.id}`, line(`${esc(r.sg.n)}: w<sub>max</sub> = ${f(Math.max(0, r.wmax), 1)} mm ≤ ${r.sg.wsp ? '2L' : 'L'}/${S.sgu.wmax} = ${f(r.limMax, 1)} mm${okS(r.wmax / r.limMax)}; w<sub>3</sub> = ${f(Math.max(0, r.w3), 1)} mm ≤ ${f(r.lim3, 1)} mm${okS(r.w3 / r.lim3)}`, 'PN-EN 1990 A1.4.3')); });
  (sg.montaz || []).forEach(q => { h += line(`Etap ${q.etap + 1} (${esc(md.etapy[q.etap].nazwa)}): ugięcie charakterystyczne w = ${f(q.w, 1)} mm (x = ${f(q.x / 1000)} m) – informacyjnie`); });
  if (sg.f1) h += mk('f1', eq('f_{1}', 'MES, masa z G + Σψ_{2}·Q', '', f(sg.f1, 2), 'Hz', 'PN-EN 1990 A1.4.4', [sg.f1 >= U.num(S.sgu.fmin, 3) ? 'ok' : 'fail', `${sg.f1 >= U.num(S.sgu.fmin, 3) ? '≥' : '<'} f<sub>min</sub> = ${f(U.num(S.sgu.fmin, 3), 1)} Hz`]));
  // ---------------------------------------------------------- 9. podpory
  h += H2('Podpory, oparcia i połączenia (PN-EN 1993-1-5, PN-EN 1993-1-8)');
  (R.podpory || []).forEach(p => {
    h += `<h3>Podpora ${esc(p.id)}${p.tymcz ? ' (montażowa)' : ''} – x = ${f(p.x / 1000)} m</h3>`;
    if (!p.tymcz && sec.kind !== 'L' && !p.pol) h += `<div class="fig">${D.joint(sec, p.wezel || {}, { W: 360, H: 250 })}</div>`;
    h += line(`R<sub>Ed,max</sub> = <b>${kN(p.Rmax)} kN</b>${p.Mmax > 1e3 ? `; |M<sub>Ed</sub>| = ${kNm(p.Mmax)} kNm` : ''}; reakcje charakterystyczne (etap ${p.eK + 1}): ${p.Rk.map(r => `${esc(r.id)}: ${kN(r.R)} kN`).join(', ')}`);
    p.equ.forEach(e => { h += mk(`${p.id}-EQU`, line(`EQU, etap ${e.etap + 1}: R<sub>min</sub> = ${kN(e.Rmin)} kN ${e.Rmin < 0 ? '<span class="fail">– odrywanie: wymagane zakotwienie</span>' : '– docisk zapewniony'}`, 'PN-EN 1990 tabl. A1.2(A)')); });
    if (p.patch) h += mk(`${p.id}-PL`, patchTxt(p.patch, `Docisk środnika nad podporą ${p.id}`));
    if (p.zebro) { const z = p.zebro; h += mk(`${p.id}-ZB`, line(`Żebra podporowe ${f(z.bs, 0)} × ${f(z.ts, 0)} mm + pasmo środnika 15εt<sub>w</sub>: A<sub>s</sub> = ${f(z.As / 100)} cm², I<sub>s</sub> = ${f(z.Is / 1e4, 1)} cm⁴, i = ${f(z.i, 1)} mm, l = ${f(z.Lcr, 0)} mm, λ̄ = ${f(z.lam, 3)}, krzywa c: χ = ${f(z.chi, 3)}; N<sub>b,Rd</sub> = ${kN(z.NbRd)} kN ≥ R<sub>Ed</sub> = ${kN(z.F)} kN${okS(z.uB)}`, 'PN-EN 1993-1-5 9.4')) + mk(`${p.id}-ZD`, line(`Docisk końców żeber: A<sub>c</sub> = ${z.nS || 2}·(b<sub>s</sub> − c)·t<sub>s</sub> = ${z.nS || 2}·(${f(z.bs, 0)} − ${f(z.c || 0, 0)})·${f(z.ts, 0)} = ${f(z.Acont, 0)} mm² (c – wcięcie narożne 45° przy pasie), F<sub>Rd</sub> = A<sub>c</sub>·f<sub>y</sub>/γ<sub>M0</sub> = ${kN(z.Fbear)} kN${okS(z.uC)}`, '6.2.4')); }
    if (p.plyta) p.plyta.checks.forEach((c, k) => { h += mk(`${p.id}-B${k}`, line(`${esc(c.n)}: ${esc(c.f || '')}; F<sub>Rd</sub> = ${kN(c.Rd)} kN ≥ R<sub>Ed</sub> = ${kN(c.Ed)} kN${okS(c.u)}`, c.ref)); });
    if (p.kotwy) h += `<div class="kotsec"><p><b>Kotwy płyty podporowej i blacha podstawy – podpora ${esc(p.id)}</b></p>${anchorBody(S, R, p.kotwy, p.kotwyF || {}, (S.podpory[R.md.sup.findIndex(z => z.id === p.id)] || {}).wezel || p.wezel || {}, `${p.id}-K`)}</div>`;
    if (p.pol) h += jointBody(S, R, p.pol, p.F, p.wezel, p.id);
  });
  // ---------------------------------------------------------- styki
  if ((R.styki || []).length) {
    h += H2('Styki montażowe belki (PN-EN 1993-1-8)');
    R.styki.forEach((q, j) => { h += `<h3>Styk ${q.id} – x = ${f(q.x / 1000)} m – ${esc(BS.W.STYKI[(S.styki[j] || {}).typ] || '')}</h3>`; if (q.o) h += spliceBody(S, R, q.o, q.F, S.styki[j], q.id); });
  }
  // ---------------------------------------------------------- pożar, zmęczenie, kruche pękanie
  if (R.pozar && R.pozar.hist) {
    const fr = R.pozar;
    h += H2('Nośność w warunkach pożaru (PN-EN 1993-1-2)');
    h += `<p>Wymagana odporność R${fr.Rreq}; pożar standardowy ISO 834 (PN-EN 1991-1-2); nagrzewanie ${S.pozar.ekspozycja === '3' ? 'z 3 stron' : 'z 4 stron'}; ${fr.prot ? `zabezpieczenie ${S.pozar.ochrona === 'plyty' ? 'skrzynkowe' : 'konturowe'}: λ<sub>p</sub> = ${esc(String(S.pozar.lp))} W/mK, d<sub>p</sub> = ${esc(String(S.pozar.dp))} mm, c<sub>p</sub> = ${esc(String(S.pozar.cp))} J/kgK, ρ<sub>p</sub> = ${esc(String(S.pozar.rp))} kg/m³` : 'bez zabezpieczenia'}; kombinacja: ${esc(fr.combo.opis)}.</p>`;
    h += line(`A<sub>m</sub>/V = ${f(fr.sf.AmV, 0)} m⁻¹, [A<sub>m</sub>/V]<sub>b</sub> = ${f(fr.sf.AmVb, 0)} m⁻¹${fr.prot ? `, A<sub>p</sub>/V = ${f(fr.sf.ApV, 0)} m⁻¹` : `, k<sub>sh</sub> = ${f(fr.ksh, 3)}`}`, '4.2.5');
    h += line(`M<sub>fi,Ed</sub> = ${kNm(Math.abs(fr.Efi.M))} kNm, V<sub>fi,Ed</sub> = ${kN(fr.Efi.V)} kN; κ<sub>1</sub> = ${f(fr.kap.k1, 2)}, κ<sub>2</sub> = ${f(fr.kap.k2, 2)}; μ<sub>0</sub> = ${f(fr.mu0, 3)}`, '4.2.3.3');
    h += line(fr.cls4 ? 'Przekrój klasy 4 – θ<sub>crit</sub> = 350 °C (zał. E)' : `θ<sub>a,cr</sub> = <b>${f(fr.thcr, 0)} °C</b> (z warunków nośności przy zginaniu, zwichrzeniu i ścinaniu w temperaturze θ); porównawczo wg (4.22): ${f(fr.thcr424, 0)} °C`, '4.2.3.3, 4.2.4');
    h += `<div class="fig">${D.fire(fr, { width: 640 })}</div>`;
    h += mk('fi-t', line(`czas osiągnięcia θ<sub>a,cr</sub>: t<sub>cr</sub> = ${fr.tcr === null ? `> ${f(fr.hist[fr.hist.length - 1][0], 0)}` : f(fr.tcr, 1)} min ${fr.ok ? '≥' : '<'} ${fr.Rreq} min ${fr.ok ? '<span class="ok">✔ warunek spełniony</span>' : '<span class="fail">✖ warunek NIESPEŁNIONY</span>'}; w ${fr.Rreq}. minucie θ<sub>a</sub> = ${f(fr.thR, 0)} °C`, '4.2.5'));
  }
  if (R.zm && R.zm.det) {
    const z = R.zm;
    h += H2('Zmęczenie (PN-EN 1993-1-9)');
    h += `<p>Przypadki cykliczne: ${z.ids.map(esc).join(', ')}; φ = ${esc(String(S.zmeczenie.phi))}${S.zmeczenie.zmiennyZnak ? ', obciążenie zmiennego znaku' : ''}; n = ${fm(z.n, 0)} cykli; γ<sub>Ff</sub> = ${f(ndp.gFf)}, γ<sub>Mf</sub> = ${f(z.gMf)}.</p>`;
    z.det.forEach(d => { h += mk('fat', line(`${esc(d.cat.n)} (${esc(d.miejsce)}): Δσ = ${f(d.ds, 1)} MPa (x = ${f(d.x / 1000)} m); Δσ<sub>C</sub>/γ<sub>Mf</sub> = ${f(d.dcd, 1)} MPa; N<sub>R</sub> = ${isFinite(d.Nf) ? fm(d.Nf, 0) : '∞'}; D = ${f(d.D, 4)}${okS(d.D)}`, 'rys. 7.1, 8(2)')); });
    h += mk('fatT', line(`Δτ = ${f(z.tau.dt, 1)} MPa; Δτ<sub>C</sub> = ${f(z.tau.dtc, 0)} MPa; D = ${f(z.tau.D, 4)}${okS(z.tau.D)}`, 'rys. 7.2'));
  }
  if (R.kr) {
    const k = R.kr;
    h += H2('Dobór stali ze względu na kruche pękanie (PN-EN 1993-1-10)');
    h += eq('T_{Ed}', 'T_{md} + ΔT_{r} + ΔT_{σ} + ΔT_{R} + ΔT_{ε̇} + ΔT_{εcf}', `${f(U.num(S.kruche.Tmd), 0)} + ${f(U.num(S.kruche.dTr), 0)} + 0 + ${f(U.num(ndp.dTR), 0)} + ${f(U.num(S.kruche.dTeps), 0)} + ${f(U.num(S.kruche.dTcf), 0)}`, f(k.TEd, 0), '°C', '2.2(5)');
    h += mk('kr', k.el.map(e => line(`${esc(e.n)}: t = ${f(e.t, 1)} mm, σ<sub>Ed</sub> = ${e.s === null ? 'przyjęto' : f(e.s, 1) + ' MPa'}, σ<sub>Ed</sub>/f<sub>y</sub>(t) = ${f(e.ratio, 2)} → t<sub>max</sub> = ${e.r.err ? esc(e.r.err) : f(e.r.t, 0) + ' mm'} ${e.r.err ? '<span class="fail">poza tablicą</span>' : e.t <= e.r.t ? '<span class="ok">✔</span>' : '<span class="fail">✖</span>'}`, 'tabl. 2.1')).join(''));
    if (k.z) h += mk('krZ', line(`Klasa Z: Z<sub>Ed</sub> = Z<sub>a</sub> + Z<sub>b</sub> + Z<sub>c</sub> + Z<sub>d</sub> + Z<sub>e</sub> = ${k.z.Za} + ${k.z.Zb} + ${k.z.Zc} + ${k.z.Zd} + ${k.z.Ze} = ${k.z.ZEd} → ${esc(k.z.cls)}`, 'tabl. 3.1, 3.2'));
  }
  // ---------------------------------------------------------- wykonanie
  h += H2('Wymagania wykonawcze (PN-EN 1090-2)');
  h += line(`<b>Klasa wykonania ${R.exc.exc}</b> – ${R.exc.why.map(esc).join('; ')}`, 'PN-EN 1993-1-1 zał. C');
  h += R.exc.req.map(r => line(`${esc(r[0])}: ${esc(r[1])}`)).join('');
  h += line(`Ochrona przed korozją: kategoria ${esc(S.wykonanie.korozja)}, trwałość ${esc(S.wykonanie.trwalosc)} (PN-EN ISO 12944)`);
  if (S.wykonanie.uwagi) h += `<p>${esc(S.wykonanie.uwagi)}</p>`;
  // ---------------------------------------------------------- belka i zestawienie
  h += H2('Belka – widok i zestawienie materiałów');
  h += `<p class="note">Rysunek poglądowy (skala pionowa powiększona).</p><div class="fig">${D.elevation(S, R, { W: 940 })}</div>`;
  const to = RP.takeoff(S, R);
  h += to.rows.map(r => line(`Poz. ${r.poz} – ${esc(r.n)}: ${r.szt} szt., ${esc(r.wym)}, ${esc(r.mat)} → ${f(r.m, 1)} kg`)).join('');
  h += line(`<b>Razem stal ${f(to.total, 1)} kg</b>${Object.keys(to.bolts).length ? `; śruby: ${Object.keys(to.bolts).map(k => `${to.bolts[k]} × ${esc(k)}`).join(', ')}` : ''}${to.weld ? `; spoiny pachwinowe ok. ${f(to.weld / 1000, 2)} m` : ''}`);
  // ---------------------------------------------------------- zestawienie sprawdzeń
  h += H2('Zestawienie sprawdzeń');
  const list = R.checks;
  let grp = '';
  list.forEach(c => {
    if (c.grp !== grp) { grp = c.grp; h += `<h3>${esc(grp)}</h3>`; }
    const cond = c.Rd === null || c.Rd === undefined ? V0(c.Ed, c.unit) : c.unit === '-' && c.Rd === 1 ? `${f(c.Ed, 3)} ≤ 1,0` : `${V0(c.Ed, c.unit)} ${c.inverse ? '≥' : '≤'} ${V0(c.Rd, c.unit)}`;
    h += line(`${esc(c.n)}: ${cond}${c.util !== null && c.util !== undefined && !c.info ? `, η = ${isFinite(c.util) ? f(c.util * 100, 0) + '%' : '∞'}` : ''} – <span class="${c.info ? 'info' : c.status}">${c.info ? 'informacyjnie' : c.status === 'ok' ? 'spełniony' : c.status === 'warn' ? 'uwaga' : 'NIE spełniony'}</span>`, c.ref);
  });
  const fl = list.filter(c => c.status === 'fail').length, mx = Math.max(0, ...list.filter(c => !c.info && c.util !== null && isFinite(c.util)).map(c => c.util));
  h += `<p class="verdict"><span class="${fl || R.errors.length ? 'fail' : 'ok'}">${fl ? `✖ Spośród przedstawionych sprawdzeń niespełnione: ${fl}.` : `✔ Przedstawione warunki normowe są spełnione. Maksymalne wykorzystanie η = ${f(mx * 100, 0)}%.`}</span></p>`;
  if (R.warnings.length) h += R.warnings.map(w => `<p class="warn">${esc(w)}</p>`).join('');
  if (R.info.length) h += R.info.map(w => `<p class="note">${esc(w)}</p>`).join('');
  // ---------------------------------------------------------- odtwarzalność
  h += H2('Założenia modelu i odtwarzalność');
  h += `<p class="note">Belka pryzmatyczna; analiza sprężysta I rzędu (MES), imperfekcje ujęte krzywymi wyboczeniowymi i zwichrzeniowymi; obciążenia bez mimośrodu względem środka ścinania (skręcanie od mimośrodu nie jest analizowane); stężenia sztywne – ich nośność należy sprawdzić odrębnie; połączenia przegubowe na reakcję pionową.</p>`;
  h += line(`Program ${BS.APP} ${BS.VERSION}; silnik ${esc(BS.ENGINE)}; format danych ${esc(BS.FORMAT)}; suma kontrolna SHA-256 danych: <span class="mono">${R.hash}</span>`);
  if (opt.data !== false) h += `<p class="note">Plik HTML raportu zawiera pełne dane projektu – można go otworzyć w programie (Otwórz), aby odtworzyć obliczenia.</p>`;
  return h;
};

/* ---------------------------------------------------------- część statyczna (raport pełny i „Statyka”) */
function staticPart(S, R, H2, full) {
  const md = R.md, an = R.an, ndp = R.ndp, nE = md.nE;
  let h = H2('Schemat statyczny i obciążenia');
  for (let s = 0; s < nE; s++) h += `<div class="fig">${D.scheme(S, R, { W: 900, etap: s, dims: true })}</div>${nE > 1 ? `<p class="note">Etap ${s + 1}: ${esc(md.etapy[s].nazwa)} – podpory: ${md.systems[s].map(p => p.id).join(', ')}${md.stez.filter(z => z.od <= s).length ? `; stężenia: ${md.stez.filter(z => z.od <= s).map(z => `x = ${f(z.x / 1000)} m`).join(', ')}` : ''}${md.ciagle.pasG && U.num(md.ciagle.odEtapu) <= s ? '; pas górny stężony ciągle' : ''}</p>` : ''}`;
  h += '<h3>Oddziaływania (wartości charakterystyczne)</h3>';
  if (S.ciezarWlasny.auto !== false) h += line(`G₀ – ciężar własny belki: g<sub>k</sub> = ${f(R.sec.gk, 3)} kN/m × (1 + ${f(U.num(S.ciezarWlasny.dodatek), 0)}% na połączenia) = ${f(R.sec.gk * (1 + U.num(S.ciezarWlasny.dodatek) / 100), 3)} kN/m (stałe)`);
  md.cases.filter(c => c.id !== 'G0').forEach(c => {
    const ps = S0.RODZAJE[c.rodzaj].stale || c.rodzaj === 'A' ? '' : `; ψ<sub>0</sub>/ψ<sub>1</sub>/ψ<sub>2</sub> = ${K.psi(c).map(v => f(v, 1)).join(' / ')}`;
    h += line(`<b>${esc(c.id)}</b> – ${esc(c.nazwa)} (${esc(S0.RODZAJE[c.rodzaj].n)}${c.rodzaj === 'Q' ? ', ' + esc((N.PSI[c.kat] || {}).n || c.kat) : ''}${nE > 1 ? `, etap ${c.etap + 1}` : ''}${!S0.RODZAJE[c.rodzaj].stale && c.uklad === 'szachownica' ? ', niekorzystnie w przęsłach' : ''}${c.wyklucz ? `, grupa „${esc(c.wyklucz)}”` : ''}${ps}): ` + c.parts.map(p => p.typ === 'q' ? `q = ${f(p.q0)}${p.q1 !== p.q0 ? '…' + f(p.q1) : ''} kN/m na x = ${f(p.x0 / 1000)}–${f(p.x1 / 1000)} m, ${p.kier === 'y' ? 'poziomo' : WYS[p.wys]}` : p.typ === 'P' ? `P = ${f(p.P / 1000)} kN w x = ${f(p.x / 1000)} m, ${p.kier === 'y' ? 'poziomo' : WYS[p.wys]}${p.ss ? `, s<sub>s</sub> = ${f(p.ss, 0)} mm` : ''}` : `M = ${f(p.M / 1e6)} kNm w x = ${f(p.x / 1000)} m`).join('; ') + (c.Nn ? `; N = ${f(c.Nn / 1000)} kN` : ''));
  });
  const off = (S.obciazenia || []).filter(o => o.aktywne === false);
  if (off.length) h += `<p class="note">Pominięte w obliczeniach (wyłączone): ${off.map(o => esc(o.id)).join(', ')}.</p>`;
  h += '<h3>Kombinacje oddziaływań (PN-EN 1990)</h3>';
  const gS = ndp.gG_sup * ndp.KFI;
  h += ndp.komb === '6.10' ? line(`E<sub>d</sub> = Σ γ<sub>G,j</sub>·G<sub>k,j</sub> + γ<sub>Q,1</sub>·Q<sub>k,1</sub> + Σ γ<sub>Q,i</sub>·ψ<sub>0,i</sub>·Q<sub>k,i</sub>; γ<sub>G,sup</sub> = ${f(gS)}, γ<sub>G,inf</sub> = ${f(ndp.gG_inf)}, γ<sub>Q</sub> = ${f(ndp.gQ * ndp.KFI)}`, '6.10')

}

/* ---------------------------------------------------------- wyniki: siły, rysunki, sprawdzenia */
function forcesHTML(c) {
  const F = c.F, w = c.w;
  if (c.kind === 'styk') return F ? `M<sub>Ed</sub> = <b>${fmt(F.M / 1e6, 2)} kNm</b>, V<sub>Ed</sub> = <b>${fmt(F.V / 1e3, 1)} kN</b>${F.N ? `, N<sub>Ed</sub> = ${fmt(F.N / 1e3, 1)} kN` : ''} – ${F.recz ? 'zadane ręcznie' : 'obwiednia w miejscu styku (wszystkie etapy, wartości bezwzględne – bezpiecznie)'}` : '';

}
function viewsHTML(c, Wv) {

  const t = c.w.typ;
  if (t === 'oparcie' || t === 'brak') { const ko = c.rp && c.rp.kotwy, v = ko ? D.anchorViews(sec, c.w, ko, { W: Math.min(Wv || 420, 460) }) : null; return `<div class="jview">${D.joint(sec, c.w, { W: 380, H: 280 })}</div>${v ? `<div class="jview">${v.plan}</div><div class="jview">${v.sect}</div>` : ''}`; }
  if (!c.o) return '<p class="hint">Brak wyniku – sprawdź komunikaty (np. rodzaj przekroju).</p>';

function checksHTML(c) {
  const cs = checksOf(c);

    const st = q.status || stOf(q.u);
    h += `<tr data-jc="${k}" class="xclick" title="Kliknij – tok obliczeń"><td>${esc(q.n)}<br><small class="hint" style="margin:0">${esc(q.ref || '')}</small></td><td class="val" style="white-space:nowrap">${q.unit === '-' ? fmt(q.Ed, 3) + ' ≤ 1,0' : `${A.unitFmt(q.Ed, q.unit)} ≤ ${A.unitFmt(q.Rd, q.unit)}`}</td><td class="bar" style="white-space:nowrap">${A.utilBar({ util: q.u, status: st })}</td></tr><tr class="jf" data-jf="${k}" style="display:none"><td colspan="3">${esc(q.f || '—')}</td></tr>`;
  });

}
function detailHTML(c) {
  const o = c.o; if (!o || !o.detal || !o.detal.length) return '';
  const rows = o.detal.map(d => `<tr class="${d.ok ? '' : d.typ === 'zal' ? 'warnrow' : 'failrow'}"><td>${d.ok ? '<span class="st ok">✔</span>' : d.typ === 'zal' ? '<span class="st warn">!</span>' : '<span class="st fail">✖</span>'}</td><td>${esc(d.el)}: ${esc(d.n)}</td><td class="n" style="white-space:nowrap">${fmt(d.v, 1)} ${d.rel} ${fmt(d.lim, 1)}</td></tr>`).join('');

}
function summaryHTML(c) {
  const cs = checksOf(c), um = Math.max(0, ...cs.map(q => (isFinite(q.u) ? q.u || 0 : 9.99))), dF = c.o && c.o.detalFail ? c.o.detalFail.length : 0, zF = c.o && c.o.zalFail ? c.o.zalFail.length : 0;

function tabsHTML(c) {

/* ---------------------------------------------------------- okno */
A.jointDesigner = function (sel) {
  if (sel) cur = sel.styk !== undefined ? { styk: sel.styk } : { sup: sel.sup || 0 };
  const r = R(); if (!r || !r.md || !r.sec) { Q.toast('Najpierw usuń błędy danych.'); return; }

  const live = () => {

    const setRo = (id, v) => { const e = $('#' + id, m); if (e) e.querySelector('b').textContent = fmt(v, 0); };
    setRo('jdHp', U.num(c.kind === 'styk' ? c.w.hpw : c.w.hp)); setRo('jdBp', U.num(c.w.bp)); setRo('jdLp', U.num(c.w.z) + (U.num(c.w.nc, 1) - 1) * U.num(c.w.p2) + U.num(c.w.e2));

    $('#jdC', m).innerHTML = checksHTML(c) + detailHTML(c);
    $$('#jdC tr[data-jc]', m).forEach(tr => tr.addEventListener('click', () => { const f2 = $(`#jdC tr[data-jf="${tr.dataset.jc}"]`, m); if (f2) f2.style.display = f2.style.display === 'none' ? '' : 'none'; }));
  };
  const focusSec = (z) => {
    const map = { plate: 'plate', bolts: 'bolts', weld: 'weld', sup: 'sup', notch: 'notch', beam: 'notch', angle: 'angle', fcov: 'fcov', wcov: 'wcov' };
    const s = $(`#jdForm [data-js="${map[z] || z}"]`, m) || $(`#jdForm [data-js="layout"]`, m); if (!s) return;
    s.scrollIntoView({ block: 'start', behavior: 'smooth' });
    const els = []; let n = s.nextElementSibling; while (n && !n.classList.contains('lsub') && els.length < 6) { const f = n.querySelector && n.querySelector('input, select'); if (f) els.push(f); n = n.nextElementSibling; }
    Q.hlg(els.length ? els : [s]);
  };
  const bindTabs = () => {
    $$('[data-jsup]', m).forEach(b => b.onclick = () => { cur = { sup: +b.dataset.jsup }; draw(); });
    $$('[data-jsty]', m).forEach(b => b.onclick = () => { cur = { styk: +b.dataset.jsty }; draw(); });
    $$('[data-jadd]', m).forEach(b => b.onclick = () => { const st = S(), md = R().md, sg = md.seg.find(z => !z.wsp) || md.seg[0]; st.styki = st.styki || []; st.styki.push(W.spliceDefaults(R().sec, +((sg.x0 + sg.x1) / 2000).toFixed(2))); cur = { styk: st.styki.length - 1 }; A.changed(true); A.recalcNow(); draw(); });
  };
  const draw = () => {
    const c = ctxCur(); if (!c) { A.setPopRedraw(null); Q.closeModal(); return; }
    syncLayout(c);
    const keep = $('#jdForm', m) ? $('#jdForm', m).scrollTop : 0;
    m.innerHTML = `<div class="dlg jdes" role="document"><div class="jhead"><h3 style="margin:0">Projektowanie połączeń</h3><span class="hint" style="margin:0">PN-EN 1993-1-8 · ${esc(c.title)}</span><span class="sp"></span><button class="btn sm pri" id="jdAuto" type="button" title="Najtańszy wariant tego rodzaju połączenia spełniający wszystkie warunki (wytężenie ≤ η z paska doboru)">⚙ Dobierz ten węzeł</button>${c.kind === 'sup' ? '<button class="btn sm" id="jdCopy" type="button" title="Skopiuj połączenie na pozostałe podpory belki">Kopiuj na inne podpory</button>' : '<button class="btn sm dng" id="jdDel" type="button">Usuń styk</button>'}<button class="btn sm" id="jdRep" type="button">Tok obliczeń…</button><button class="btn sm" id="nClose" type="button">Zamknij</button></div>
      <div class="beamtabs jtabs" id="jdTabs"></div>
      <div class="jbody"><div class="jcol fields" id="jdForm">${formHTML(c)}</div><div class="jcol"><div id="jdS"></div><div class="jviews" id="jdV"></div><p class="hint">Kliknij element rysunku (blachę, śruby, spoinę, podporę, podcięcie) – przejście do jego parametrów. Kolor śrub wg wytężenia (czerwony – przekroczenie); najedź na śrubę – siły.</p></div><div class="jcol" id="jdC"></div></div></div>`;
    m.style.display = 'flex';

    A.bindFields($('#jdForm', m), (re) => { const c2 = ctxCur(); if (c2) syncLayout(c2); if (re) { A.recalcNow(); draw(); } });
    A.bindAnchorFields($('#jdForm', m), draw);
    $$('[data-jt]', m).forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.jt, st = S();
      if (c.kind === 'styk') { st.styki[cur.styk].typ = t; }
      else { const p0 = st.podpory[c.i], old = p0.wezel || {}; p0.wezel = Object.assign({ typ: t }, W.defaults(t, R().sec), ['sup', 'tsup', 'supGat', 'd', 'kl'].reduce((o2, k) => { if (old[k] !== undefined && t !== 'oparcie' && t !== 'brak') o2[k] = old[k]; return o2; }, {})); }

    }));
    $('#nClose', m).onclick = () => { A.setPopRedraw(null); Q.closeModal(); };
    $('#jdAuto', m).onclick = () => autoCur();
    const cp = $('#jdCopy', m); if (cp) cp.onclick = () => { const st = S(); let n = 0; st.podpory.forEach((p2, k) => { if (k !== c.i) { p2.wezel = U.clone(c.w); n++; } }); A.changed(true); Q.toast(`Skopiowano połączenie na ${n} podpor${n === 1 ? 'ę' : 'y'}.`); };
    const dl = $('#jdDel', m); if (dl) dl.onclick = async () => { if (!(await Q.ask(`Usunąć styk S${cur.styk + 1}?`, 'Usuń', true))) return; S().styki.splice(cur.styk, 1); cur = { sup: 0 }; A.changed(true); A.recalcNow(); draw(); };
    $('#jdRep', m).onclick = () => repPopup();
    live();
  };
  const autoCur = () => {
    const c = ctxCur(), r2 = R(), eta = ((S().design && S().design.eta) || 100) / 100, ctx = J.jointCtx(r2.sec, r2.mat, r2.ndp, r2.base);
    let d;
    if (c.kind === 'styk') { if (!c.F) return; d = W.autoSplice(ctx, Object.assign(W.spliceDefaults(r2.sec, c.w.x), c.w), c.F, eta); if (d.ok) Object.assign(c.w, d.w); }
    else if (['oparcie', 'brak'].includes(c.w.typ)) { const dd = J.dobierzWezly(S(), r2, eta); S().podpory[c.i].wezel = dd.st.podpory[c.i].wezel; d = { ok: true }; Q.toast(dd.log.filter(t => t.indexOf(`Podpora ${c.id}`) === 0).join(' ') || 'Oparcie spełnia warunki.', 6000); }
    else { const rp = c.rp; d = W.auto(ctx, Object.assign({}, W.defaults(c.w.typ, r2.sec), c.w), J.jointForces(c.w, { Rmax: rp.Rmax, Mmax: rp.Mmax, Rk: rp.Rk, typ: S().podpory[c.i].typ }), eta); if (d.ok) Object.assign(c.w, d.w); }

    n.style.display = 'flex'; $('#jrClose', n).onclick = () => { n.style.display = 'none'; };
  };

};
})();

<script>/* src/ui/widok3d.js */
/* =====================================================================
   BelkaStal – widok 3D belki z połączeniami (zakładka „Belka i połączenia”).
   Własny renderer (bez bibliotek – aplikacja działa offline): bryły
   z wielokątów, perspektywa, cieniowanie płaskie, algorytm malarza
   z podziałem długich ścian, krawędzie charakterystyczne, wybór
   elementu myszą.  Elementy: belka (wyciągnięty przekrój), żebra
   środnika i podporowe, blachy czołowe / żebrowe, kątowniki, śruby,
   spoiny, elementy podpierające (słup, podciąg, płyta, mur / beton),
   styki nakładkowe, stężenia, podpory montażowe, płyta stropowa.
   Obsługa: przeciąganie – obrót, prawy przycisk / Shift – przesuw,
   kółko – przybliżenie, dwuklik – widok ogólny, kliknięcie – edycja.
   ===================================================================== */
(function () {
'use strict';
const BS = window.BS, U = BS.U, Q = BS.Q, A = BS.A, M = BS.M, P = BS.P;
const V3 = BS.V3 = {};
const { esc, fmt } = Q;
const COL = { washer: [150, 156, 168], grout: [196, 188, 172], beam: [150, 170, 200], plate: [230, 163, 90], angle: [196, 128, 64], bolt: [70, 76, 90], weld: [200, 50, 50], col: [176, 184, 196], conc: [205, 199, 186], mur: [190, 120, 92], stiff: [214, 150, 80], brace: [120, 90, 190], tmp: [235, 160, 40], slab: [190, 190, 185], cover: [235, 175, 100] };
let cam = null;                       // stan kamery – zachowany między przeliczeniami
let opts = (() => { try { return Object.assign({ slab: false, sup: true, xray: false }, JSON.parse(localStorage.getItem('bs.v3') || '{}')); } catch (e) { return { slab: false, sup: true, xray: false }; } })();

/* ---------------------------------------------------------- wektory */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

/* ---------------------------------------------------------- scena */
function Scene() { this.f = []; this.obj = []; }
Scene.prototype.o = function (name, act, extra) { this.obj.push(Object.assign({ name, act }, extra || {})); return this.obj.length - 1; };
// ściana płaska: pts – wierzchołki, n – normalna zewnętrzna, e – krawędzie charakterystyczne (tablica bool), hole – otwór
Scene.prototype.face = function (pts, n, col, ob, e, alpha, hole) { this.f.push({ p: pts, n, col, ob, e: e || pts.map(() => true), a: alpha || 1, hole }); };
// prostopadłościan (osie X, Y, Z); nx – podział wzdłuż X (długie elementy)
Scene.prototype.box = function (x0, x1, y0, y1, z0, z1, col, ob, alpha, nx) {
  if (x0 > x1) [x0, x1] = [x1, x0]; if (y0 > y1) [y0, y1] = [y1, y0]; if (z0 > z1) [z0, z1] = [z1, z0];
  if (x1 - x0 < 1e-6 || y1 - y0 < 1e-6 || z1 - z0 < 1e-6) return;
  const n = Math.max(1, nx || 1), X = (k) => x0 + (x1 - x0) * k / n;
  for (let k = 0; k < n; k++) {
    const a = X(k), b = X(k + 1), first = k === 0, last = k === n - 1;
    this.face([[a, y0, z0], [b, y0, z0], [b, y0, z1], [a, y0, z1]], [0, -1, 0], col, ob, [true, last, true, first], alpha);
    this.face([[a, y1, z0], [b, y1, z0], [b, y1, z1], [a, y1, z1]], [0, 1, 0], col, ob, [true, last, true, first], alpha);
    this.face([[a, y0, z0], [b, y0, z0], [b, y1, z0], [a, y1, z0]], [0, 0, -1], col, ob, [true, last, true, first], alpha);
    this.face([[a, y0, z1], [b, y0, z1], [b, y1, z1], [a, y1, z1]], [0, 0, 1], col, ob, [true, last, true, first], alpha);
  }
  this.face([[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], [-1, 0, 0], col, ob, null, alpha);
  this.face([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], [1, 0, 0], col, ob, null, alpha);
};
// graniastosłup o osi od p0 do p1, przekrój – wielokąt foremny (k boków, promień r); sharp – krawędzie boczne widoczne
Scene.prototype.prism = function (p0, p1, r, k, col, ob, sharp, rot) {
  const d = norm(sub(p1, p0)), t = Math.abs(d[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0], u = norm(cross(d, t)), v = cross(d, u);
  const ring = []; for (let i = 0; i < k; i++) { const a = (rot || 0) + 2 * Math.PI * i / k; ring.push(add(mul(u, r * Math.cos(a)), mul(v, r * Math.sin(a)))); }
