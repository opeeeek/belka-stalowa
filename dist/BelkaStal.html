  o.dmin('blacha czołowa', 'h_p ≥ 0,6·h_b (stężenie skrętne końca belki)', hp, 0.6 * sec.h, 'zal');
  o.dmax('blacha czołowa', w.pelna ? 'h_p ≤ h (blacha w obrysie belki)' : 'h_p ≤ h − 2(t_f + r) (blacha w obrysie środnika)', hp, w.pelna ? sec.h : sec.h - (sec.tg || 0) - (sec.td || 0) - 2 * (sec.r || 0));
  o.dmin('blacha czołowa', 'odstęp śruby od spoiny (p₃ − t_w)/2 − a√2 ≥ 0,5·s (klucz)', (p3 - sec.tw) / 2 - a * Math.SQRT2, 0.5 * B.s, 'zal');
  o.dmax('blacha czołowa', 'b_p ≤ szerokość pasa belki + 10 mm', bp, Math.min(sec.bg || sec.b || 1e9, sec.bd || sec.b || 1e9) + 10, 'zal');
  o.mass = 7.85e-6 * hp * bp * tp; o.nb = n; o.weldL = 2 * hp; o.geom = { hp, bp, tp, nr, e1, p1, e2, p3, a, e1d, pelna: !!w.pelna };
  return fin(o);
};

/* ---------------------------------------------------------- poślizg (kat. B, C) */
function slip(o, B, V, Vser, n, planes, lab) {
  planes = planes || 1; lab = lab ? ` – ${lab}` : '';
  if (!B.pre || B.kat === 'A') return;
  if (B.kat === 'C') o.add('Śruby', `Nośność na poślizg w SGN (kat. C)${lab}`, 'PN-EN 1993-1-8 3.9.1 (3.6)', V, n * planes * B.Fs, 'F', `F_s,Rd = k_s·n·μ·F_p,C/γM3 = ${f(B.ks, 2)}·${planes}·${f(B.mu, 2)}·0,7·${B.fub}·${f(B.As, 0)}/γM3 = ${kN(B.Fs * planes)} kN na śrubę`);
  else { const Vs = Vser > 0 ? Vser : V / 1.4; o.add('Śruby', `Nośność na poślizg w SGU (kat. B)${lab}`, 'PN-EN 1993-1-8 3.9.1 (3.6)', Vs, n * planes * B.FsSer, 'F', `V_Ed,ser = ${kN(Vs)} kN${Vser > 0 ? ' (reakcja charakterystyczna)' : ' (≈ V_Ed/1,4)'}; F_s,Rd,ser = ${kN(B.FsSer * planes)} kN na śrubę`); }
}
// sprawdzenie najbardziej obciążonej śruby grupy mimośrodowej: ścinanie i docisk w 2 kierunkach (interakcja)
function boltGroupChecks(o, grpName, B, bolts, planes, bL, plates, ndp, label) {
  const g2 = ndp.gM2, Fv = B.Fv * planes * bL;
  let wv = bolts[0]; bolts.forEach(b => { if (b.F > wv.F) wv = b; });
  o.add(grpName, `${label}: ścinanie najbardziej obciążonej śruby`, 'PN-EN 1993-1-8 tabl. 3.4; 3.8', wv.F, Fv, 'F', `F = √(F_x² + F_z²) = √(${kN(wv.Fx)}² + ${kN(wv.Fz)}²) = ${kN(wv.F)} kN; F_v,Rd = ${planes > 1 ? `${planes}·` : ''}α_v·f_ub·A/γM2${bL < 1 ? '·β_Lf' : ''} = ${kN(Fv)} kN`);
  plates.forEach(pl => {
    let worst = null;
    bolts.forEach(b => {
      const gz = pl.geomZ(b), gx = pl.geomX(b);
      const fz = W.Fb(B, pl.t, pl.fu, g2, gz), fx = W.Fb(B, pl.t, pl.fu, g2, gx);
      const u = Math.sqrt((b.Fz / Math.max(1e-9, fz.Fb)) ** 2 + (b.Fx / Math.max(1e-9, fx.Fb)) ** 2);
      if (!worst || u > worst.u) worst = { u, b, fz, fx };
    });
    const q = worst;
    o.ratio(grpName, `Docisk – ${pl.n} (interakcja pion / poziom)`, 'PN-EN 1993-1-8 tabl. 3.4', q.u, `(F_z/F_b,z)² + (F_x/F_b,x)² ≤ 1: śruba ${q.b.id || ''}: F_z = ${kN(q.b.Fz)} kN, F_b,z = ${kN(q.fz.Fb)} kN (k₁ = ${f(q.fz.k1, 2)}, α_b = ${f(q.fz.ab, 3)}); F_x = ${kN(q.b.Fx)} kN, F_b,x = ${kN(q.fx.Fb)} kN (k₁ = ${f(q.fx.k1, 2)}, α_b = ${f(q.fx.ab, 3)}); t = ${f(pl.t)} mm, f_u = ${pl.fu} MPa`);
  });
  return wv;
}

/* =========================================================== BLACHA ŻEBROWA */
// w: hp, tp, nr|n, nc, e1, p1, e2, p2, z, e2b, a, śruby…, gatP, sup, tsup, dnt, dnb, ln, e1b, Nt
W.finPlate = function (ctx, w, F) {
  const { sec, mat, ndp } = ctx, g0 = ndp.gM0, g1 = ndp.gM1, g2 = ndp.gM2;
  const o = rec(); o.typ = 'blacha_zebrowa';
  const B = W.bolt(w, ndp), nr = Math.max(1, Math.round(U.num(w.nr, U.num(w.n, 3)))), nc = U.clamp(Math.round(U.num(w.nc, 1)), 1, 2), n = nr * nc;
  const hp = U.num(w.hp), tp = U.num(w.tp), e1 = U.num(w.e1), p1 = U.num(w.p1), e2 = U.num(w.e2), p2 = nc > 1 ? U.num(w.p2, 3 * B.dd) : 0, z = U.num(w.z), e2b = U.num(w.e2b), a = U.num(w.a);
  const pl = steel(w.gatP || mat.gatunek, tp, ndp), V = Math.abs(F.V), Nt = Math.max(0, U.num(F.Nt));
  const zc = z + (nc - 1) * p2 / 2, gap = Math.max(0, z - e2b), wk = weaker(pl, { fu: mat.fu, bw: bwOf(mat.gatunek) }), bw = wk.bw, fuW = wk.fu;
  o.B = B; o.pl = pl; o.n = n;
  // x – od lica podpory, z – od górnej krawędzi blachy w dół
  const pts = []; let id = 0;
  for (let i = 0; i < nr; i++) for (let j = 0; j < nc; j++) pts.push({ id: ++id, x: z + j * p2, z: e1 + i * p1, r: i, c: j });
  const bolts = W.group(pts, V, 0, V * zc); o.bolts = bolts;
  const bL = W.betaLf((nr - 1) * p1, B.dd);
  // geometria docisku: blacha – siła z w dół (koniec: dolny rząd, e₁), siła x – krawędź swobodna blachy (e₂ za ostatnią kolumną)
  const plateG = { n: 'blacha żebrowa', t: tp, fu: pl.fu,
    geomZ: (b) => ({ end: b.r === nr - 1, e1, p1, edge: b.c === nc - 1 || b.c === 0, e2: b.c === nc - 1 ? e2 : Infinity, p2: nc > 1 ? p2 : Infinity }),
    geomX: (b) => ({ end: b.c === nc - 1, e1: e2, p1: p2 || 3 * B.d0, edge: b.r === 0 || b.r === nr - 1, e2: e1, p2: nr > 1 ? p1 : Infinity }) };
  const notT = U.num(w.dnt) > 0, e1b = U.num(w.e1b, 60);
  const webG = { n: 'środnik belki', t: sec.tw, fu: mat.fu,
    geomZ: (b) => ({ end: notT && b.r === 0, e1: e1b, p1: nr > 1 ? p1 : 3 * B.d0, edge: false, p2: nc > 1 ? p2 : Infinity }),
    geomX: (b) => ({ end: b.c === 0, e1: e2b, p1: p2 || 3 * B.d0, edge: false, p2: nr > 1 ? p1 : Infinity }) };
  boltGroupChecks(o, 'Śruby', B, bolts, 1, bL, [plateG, webG], ndp, 'Śruby w środniku (mimośród z_c = ' + f(zc, 0) + ' mm)');
  slip(o, B, V, F.Vser, n);
  // --- blacha
  o.add('Blacha żebrowa', 'Ścinanie przekroju brutto', 'PN-EN 1993-1-1 6.2.6; SCI P358 (1,27)', V, hp * tp * pl.fy / (1.27 * s3 * g0), 'F', `h_p·t_p·f_y/(1,27·√3·γM0) = ${f(hp, 0)}·${f(tp)}·${pl.fy}/(1,27·√3·${f(g0, 2)})`);
  o.add('Blacha żebrowa', 'Ścinanie przekroju netto', 'PN-EN 1993-1-8 3.10', V, (hp - nr * B.d0) * tp * pl.fu / (s3 * g2), 'F', `(h_p − n_r·d₀)·t_p·f_u/(√3·γM2) = (${f(hp, 0)} − ${nr}·${B.d0})·${f(tp)}·${pl.fu}/(√3·${f(g2, 2)})`);
  const Ant = (e2 + (nc - 1) * p2 - (nc - 0.5) * B.d0) * tp, Anv = (hp - e1 - (nr - 0.5) * B.d0) * tp;
  o.add('Blacha żebrowa', 'Rozerwanie blokowe', 'PN-EN 1993-1-8 3.10.2 (3.10)', V, 0.5 * pl.fu * Ant / g2 + pl.fy * Anv / (s3 * g0), 'F', `0,5·f_u·A_nt/γM2 + f_y·A_nv/(√3·γM0); A_nt = ${f(Ant, 0)} mm², A_nv = ${f(Anv, 0)} mm²`);
  const Wel = tp * hp * hp / 6;
  if (hp < 2.73 * zc) o.add('Blacha żebrowa', 'Zginanie blachy (V·z_c)', 'PN-EN 1993-1-1 6.2.5; SCI P358', V * zc, Wel * pl.fy / g0, 'M', `h_p = ${f(hp, 0)} < 2,73·z_c = ${f(2.73 * zc, 0)} mm → M = V·z_c = ${kN(V)}·${f(zc, 0)}; W_el = t_p·h_p²/6 = ${f(Wel / 1e3, 1)} cm³`);
  else o.uwagi.push(`Blacha żebrowa: h_p ≥ 2,73·z_c – zginanie blachy nie jest decydujące (SCI P358).`);
  if (zc > tp / 0.15) {
    const lam = 2.8 * Math.sqrt(zc * hp / (1.5 * tp * tp)) / (93.9 * Math.sqrt(235 / pl.fy)), chi = chiD(lam);
    o.add('Blacha żebrowa', 'Zwichrzenie długiej blachy żebrowej', 'PN-EN 1993-1-1 6.3.2 (krzywa d); SCI P358', V * zc, chi * Wel * pl.fy / g1, 'M', `z_c = ${f(zc, 0)} > t_p/0,15 = ${f(tp / 0.15, 0)} mm; λ̄_LT = 2,8·√(z_c·h_p/(1,5·t_p²))/(93,9ε) = ${f(lam, 3)}; χ_LT = ${f(chi, 3)}`);
  }
  // --- belka
  beamWeb(o, ctx, B, V, { nr, nc, p1, dnt: w.dnt, dnb: w.dnb, ln: w.ln, gap, e1b, e2bt: e2b + (nc - 1) * p2 + (B.d0 / 2) * 0 });
  // --- spoiny blachy do podpory (V i moment V·z_c)
  const Lw = Math.max(1, hp - 2 * a), tl = V / (2 * a * Lw), sw = 6 * V * zc / (2 * a * Lw * Lw), wf = W.fillet(fuW, bw, g2, sw / Math.SQRT2, sw / Math.SQRT2, tl);
  o.add('Spoiny', 'Spoiny blachy do podpory (V + V·z_c)', 'PN-EN 1993-1-8 4.5.3.2 (4.1)', wf.s, wf.R1, 'MPa', `τ∥ = V/(2a·l_w) = ${f(tl)} MPa; σ_w = 6·V·z_c/(2a·l_w²) = ${f(sw)} MPa → σ⊥ = τ⊥ = ${f(sw / Math.SQRT2)} MPa; √(σ⊥² + 3(τ⊥² + τ∥²)) = ${f(wf.s)} ≤ ${f(wf.R1)} MPa`, { u: wf.u });
  const aF = W.aFull(tp, pl.fy, fuW, bw, g0, g2);
  o.dmin('spoiny', `a ≥ a_pełnonośna blachy = ${f(aF)} mm (SCI – spoina silniejsza od blachy)`, a, aF, 'zal');
  o.dmin('spoiny', 'a ≥ 3 mm', a, 3);
  // --- podpora
  const t = U.num(w.tsup, 0);
  if (t > 0) {
    const sp = w.supGat && M.STAL[w.supGat] ? steel(w.supGat, t, ndp) : { fy: U.num(w.fysup, 235), fu: U.num(w.fusup, 360), gat: '' };
    o.add('Podpora', 'Ścianka podpory – ścinanie lokalne przy spoinach', 'PN-EN 1993-1-1 6.2.6; SCI P358', V, 2 * hp * t * sp.fy / (s3 * g0), 'F', `2·h_p·t·f_y/(√3·γM0) = 2·${f(hp, 0)}·${f(t)}·${sp.fy}/(√3·${f(g0, 2)})`);
    o.dmax('podpora', `t_p ≤ t·f_u,s/(f_y,p·γM2) = ${f(t * sp.fu / (pl.fy * g2))} mm (przebicie ścianki podpory)`, tp, t * sp.fu / (pl.fy * g2), 'zal');
  }
  // --- wiązanie
  if (Nt > 0) {
    const tieB = W.group(pts, 0, Nt, 0);
    boltGroupChecks(o, 'Wiązanie (N_t)', B, tieB.map(b => Object.assign(b, { Fz: 0, F: Math.abs(b.Fx) })), 1, 1, [plateG, webG], ndp, 'Wiązanie');
    o.add('Wiązanie (N_t)', 'Blacha – rozciąganie przekroju netto', 'PN-EN 1993-1-1 6.2.3', Nt, 0.9 * (hp - nr * B.d0) * tp * pl.fu / g2, 'F', `0,9·A_net·f_u/γM2, A_net = (h_p − n_r·d₀)·t_p`);
    o.add('Wiązanie (N_t)', 'Środnik belki – rozciąganie netto', 'PN-EN 1993-1-1 6.2.3', Nt, 0.9 * (hp - nr * B.d0) * sec.tw * mat.fu / g2, 'F', `0,9·(h_p − n_r·d₀)·t_w·f_u/γM2`);
    const swt = Nt / (2 * a * Lw), wt = W.fillet(fuW, bw, g2, swt / Math.SQRT2, swt / Math.SQRT2, 0);
    o.add('Wiązanie (N_t)', 'Spoiny – rozciąganie', 'PN-EN 1993-1-8 4.5.3.2', wt.s, wt.R1, 'MPa', `σ_w = N_t/(2a·l_w) = ${f(swt)} MPa`, { u: wt.u });
  }
  // --- konstrukcja
  spacing(o, 'blacha żebrowa', B, tp, { e1, e2, p1: nr > 1 ? p1 : undefined, p2: nc > 1 ? p2 : undefined, exp: w.exp });

      else bN.push(o.add(grpN, 'Rozłupanie betonu (beton niezarysowany)', `${ref4} 7.2.1.7`, N, T.sp.NRdsp, 'F', `c_cr,sp = ${f(T.sp.ccrSp, 0)} mm (orientacyjnie – ETA); N⁰_Rk,sp = ${kN(T.sp.N0sp)} kN; ψ_h,sp = ${f(T.sp.psiH, 3)}; N_Rk,sp = ${kN(T.sp.NRksp)} kN`));
    } else o.uwagi.push('Rozłupanie betonu (7.2.1.7(2)c) – nie sprawdza się: nośności wyznaczono dla betonu zarysowanego, a zbrojenie elementu ma przenosić siły rozłupujące i ograniczać rysy do w_k ≤ 0,3 mm.');
  }
  // nośność grupy na rozciąganie (do króćca teowego i ostrzeżeń)
  o.NRd = Math.min(n * T.NRds, T.NRdc, T.NRdp || Infinity, T.NRdp1 ? n * T.NRdp1 : Infinity, T.sp && !T.sp.notReq ? T.sp.NRdsp : Infinity);

  // --- ścinanie
  const bV = [];
  let VRds = 0;
  if (V > 0) {
    if (k.otw === 'powiekszone') o.add(grpV, 'Przeniesienie ścinania przez kotwy w otworach powiększonych', `${ref4} 6.2.2.2, tabl. 6.1`, V, 0, 'F', `luz otworu d_f = ${f(g.df, 0)} mm > wartości z tabl. 6.1 – kotwy nie przenoszą ścinania; zastosuj podkładki przyspawane do blachy (otwór d + 2 mm) lub otwory normalne`);
    const tg = Math.max(0, U.num(k.tg, 0)), lever = tg > d / 2;
    const k6 = kl.fuk <= 500 ? 0.6 : 0.5;
    if (!lever) {
      const VRks = k6 * g.As * kl.fuk; VRds = VRks / gMsV;
      o.add(grpV, 'Zniszczenie stali kotwy bez ramienia (najbardziej obciążona)', `${ref4} 7.2.2.3.1`, V1, VRds, 'F', `V_Ed^h = V_Ed/n = ${kN(V)}/${n} = ${kN(V1)} kN; V_Rk,s = k₆·A_s·f_uk = ${f(k6, 1)}·${f(g.As, 1)}·${f(kl.fuk, 0)} = ${kN(VRks)} kN (podlewka t_g = ${f(tg, 0)} ≤ d/2); γ_Ms = ${f(gMsV, 2)}`);
      o.Vs = { lever: false, k6, VRks };
    } else {
      const ds = Math.sqrt(4 * g.As / Math.PI), Wel = Math.PI * ds ** 3 / 32, M0 = 1.2 * Wel * kl.fuk;
      const MRks = M0 * Math.max(0, 1 - N1 / T.NRds), aM = k.utw ? 2 : 1, la = 0.5 * d + tg + g.tp / 2;
      const VRksM = aM * MRks / la; VRds = VRksM / gMsV;
      o.add(grpV, 'Zniszczenie stali kotwy z ramieniem (podlewka > d/2)', `${ref4} 6.2.2.3, 7.2.2.3.2`, V1, VRds, 'F', `l_a = 0,5d + t_g + t_p/2 = ${f(la, 1)} mm; M⁰_Rk,s = 1,2·W_el·f_uk = ${f(M0 / 1e6, 3)} kNm; M_Rk,s = M⁰_Rk,s·(1 − N_Ed^h/N_Rd,s) = ${f(MRks / 1e6, 3)} kNm; α_M = ${aM} (${aM === 2 ? 'płyta utwierdzona na kotwie' : 'bez utwierdzenia – bezpiecznie'}); V_Rk,s,M = α_M·M_Rk,s/l_a = ${kN(VRksM)} kN`);
      o.Vs = { lever: true, la, M0, MRks, aM, VRksM };
    }
    // podważenie (pry-out)
    const k8 = hef >= 60 ? 2 : 1, NRkcp = k.typ === 'wklejane' ? Math.min(T.NRkc, T.NRkp || Infinity) : T.NRkc, VRkcp = k8 * NRkcp;
    bV.push(o.add(grpV, 'Podważenie betonu (pry-out) – grupa', `${ref4} 7.2.2.4`, V, VRkcp / gMc, 'F', `V_Rk,cp = k₈·${k.typ === 'wklejane' ? 'min(N_Rk,c; N_Rk,p)' : 'N_Rk,c'} = ${k8}·${kN(NRkcp)} = ${kN(VRkcp)} kN (k₈ – ETA, orientacyjnie ${k8}); γ_Mc = ${f(gMc, 2)}`));
    // krawędź betonu – wzdłuż belki (V_x ku bliższemu licu podpory)
    const edge = (lab, Vd, c1f, c2a, c2b, s2, sBack, nRows) => {
      const fr = edgeRes(c1f, c2a, c2b, s2, g.hc, d, hef, fck, cr, k.zbrKr); if (!fr) return;
      bV.push(o.add(grpV, `Krawędź betonu – ${lab}, rząd przedni (c₁ = ${f(fr.c1, 0)} mm)`, `${ref4} 7.2.2.5`, Vd / nRows, fr.VRk / gMc, 'F', `V⁰_Rk,c = k₉·d^α·l_f^β·√f_ck·c₁^1,5 = ${f(fr.k9, 1)}·${f(d, 0)}^${f(fr.al, 3)}·${f(fr.lf, 0)}^${f(fr.be, 3)}·√${f(fck, 0)}·${f(fr.c1, 0)}^1,5 = ${kN(fr.V0)} kN; A_c,V/A⁰_c,V = ${f(fr.AcV / 100, 0)}/${f(fr.A0cV / 100, 0)} cm²; ψ_s,V = ${f(fr.psiS, 3)}; ψ_h,V = ${f(fr.psiH, 3)}; ψ_re,V = ${f(fr.psiRe, 1)}; V_Rk,c = ${kN(fr.VRk)} kN; udział rzędu 1/${nRows}`));
      if (nRows > 1) { const bk = edgeRes(c1f + sBack, c2a, c2b, s2, g.hc, d, hef, fck, cr, k.zbrKr); if (bk) bV.push(o.add(grpV, `Krawędź betonu – ${lab}, rząd tylny (c₁ = ${f(bk.c1, 0)} mm, całe V)`, `${ref4} 7.2.2.5`, Vd, bk.VRk / gMc, 'F', `V⁰_Rk,c = ${kN(bk.V0)} kN; A_c,V/A⁰_c,V = ${f(bk.AcV / 100, 0)}/${f(bk.A0cV / 100, 0)} cm²; ψ_s,V = ${f(bk.psiS, 3)}; ψ_h,V = ${f(bk.psiH, 3)}; V_Rk,c = ${kN(bk.VRk)} kN`)); }
    };
    if (Vx > 0 && g.bc > 0) edge('V_x ku licu podpory', Vx, Math.min(g.cxP, g.cxZ), g.cy, g.cy, g.sB, g.sL * (g.nL - 1), g.nL);
    if (Vy > 0 && g.lc > 0) edge('V_y w poprzek', Vy, g.cy, g.cxP, g.cxZ, g.sL * (g.nL - 1), g.sB, 2);
    if (g.bc <= 0) o.uwagi.push('Nie podano wymiarów podpory betonowej – krawędzie betonu przyjęto jako odległe (bez sprawdzenia krawędzi przy ścinaniu i bez redukcji stożka).');
  }
  // --- interakcja N–V (7.2.3)
  if (N > 0 && V > 0) {
    const bNs = N1 / T.NRds, bVs = VRds > 0 ? V1 / VRds : Infinity;
    o.ratio(grpI, 'Stal: β_N² + β_V² ≤ 1', `${ref4} 7.2.3.1 (7.54)`, bNs * bNs + bVs * bVs, `β_N = ${f(bNs, 3)}, β_V = ${f(bVs, 3)}`);
    const bNc = Math.max(0, ...bN), bVc = Math.max(0, ...bV);
    if (bNc > 0 && bVc > 0) o.ratio(grpI, 'Beton: β_N^1,5 + β_V^1,5 ≤ 1', `${ref4} 7.2.3.1 (7.55)`, Math.pow(bNc, 1.5) + Math.pow(bVc, 1.5), `β_N = ${f(bNc, 3)} (max. z trybów betonu przy rozciąganiu), β_V = ${f(bVc, 3)} (max. z trybów betonu przy ścinaniu)`);
  }

  // --- blacha podstawy przy odrywaniu: króciec teowy (PN-EN 1993-1-8 6.2.4, 6.2.6.11–12)
  const bf = sec.bd || sec.b || 100, aw = Math.max(0, U.num(w.aw, 0));
  const pl = M.fy(mat.gatunek, g.tp || 10, ndp.fySrc);
  const m = g.sB / 2 - bf / 2 - 0.8 * Math.SQRT2 * aw;
  o.dmin('kotwy', 'kotwy poza pasem belki: m = s_B/2 − b_f/2 − 0,8·√2·a_w > 0', m, 1e-3, 'min', 'geometria; PN-EN 1993-1-8 6.2.6.11');
  if (N > 0 && m > 0) {
    const ee = g.e2, nn = Math.min(ee, 1.25 * m);
    const leff = Math.min(g.lp, g.nL * Math.min(2 * Math.PI * m, 4 * m + 1.25 * ee));
    const Mpl = 0.25 * leff * g.tp * g.tp * pl.fy / ndp.gM0;
    const Lb = 8 * d + Math.max(0, U.num(k.tg, 0)) + g.tp + g.H.tw + 0.5 * g.H.m;
    const Lbs = 8.8 * m ** 3 * g.As * g.nL / (leff * g.tp ** 3);
    const pry = Lb <= Lbs, SFt = o.NRd;
    const FT1 = pry ? 4 * Mpl / m : 2 * Mpl / m, FT2 = pry ? (2 * Mpl + nn * SFt) / (m + nn) : Infinity, FT3 = SFt;
    const FT = Math.min(FT1, FT2);                 // tryby z udziałem blachy; tryb 3 (same kotwy) – sprawdzenia kotew
    o.tstub = { m, nn, leff, Mpl, Lb, Lbs, pry, FT1, FT2, FT3, FT, fy: pl.fy };
    o.add('Blacha podstawy', 'Zginanie blachy przy odrywaniu (króciec teowy)', 'PN-EN 1993-1-8 6.2.4, 6.2.6.11, tabl. 6.2', N, FT, 'F', `m = ${f(m, 1)} mm, n = ${f(nn, 1)} mm, l_eff = ${f(leff, 0)} mm, M_pl,Rd = 0,25·l_eff·t_p²·f_y/γM0 = ${f(Mpl / 1e6, 3)} kNm; L_b = ${f(Lb, 0)} mm ${pry ? '≤' : '>'} L_b* = ${f(Lbs, 0)} mm → ${pry ? 'efekt dźwigni: F_T,1 = 4M_pl/m = ' + kN(FT1) + ' kN, F_T,2 = (2M_pl + n·ΣF_t,Rd)/(m + n) = ' + kN(FT2) + ' kN' : 'bez efektu dźwigni: F_T,1-2 = 2M_pl/m = ' + kN(FT1) + ' kN'}; (tryb 3 – zerwanie kotew: ΣF_t,Rd = ${kN(FT3)} kN – sprawdzenia kotew)`);
  }
  // --- spoiny belka–blacha (pas dolny, dwie spoiny pachwinowe wzdłuż krawędzi pasa)
  if (N > 0 || V > 0) {
    const lb = Math.min(U.num(w.lb, g.lp) || g.lp, g.lp), lw = Math.max(0, lb - 2 * aw);
    const bw = (M.STAL[mat.gatunek] || {}).bw || 0.9, fvw = pl.fu / (Math.sqrt(3) * bw * ndp.gM2);
    if (aw <= 0) o.add('Spoiny belka–blacha', 'Brak spoin belki z blachą – siły odrywania / poziome nieprzeniesione', 'PN-EN 1993-1-8 4.5.3.3', Math.hypot(N, V), 0, 'F', 'podaj grubość spoiny a_w');
    else {
      const fN = N / (2 * lw), fVx = Vx / (2 * lw), fVy = Vy / (2 * lw), FwEd = Math.hypot(fN, fVx, fVy), FwRd = aw * fvw;
      o.add('Spoiny belka–blacha', 'Spoiny pachwinowe pasa z blachą (metoda uproszczona)', 'PN-EN 1993-1-8 4.5.3.3', FwEd, FwRd, 'q', `2 spoiny a_w = ${f(aw, 0)} mm, l_w = l_b − 2a_w = ${f(lw, 0)} mm; F_w,Ed = √(N² + V_x² + V_y²)/(2l_w) = ${f(FwEd, 1)} N/mm; F_w,Rd = a·f_u/(√3·β_w·γM2) = ${f(FwRd, 1)} N/mm`);
    }
  }

  // --- wymagania konstrukcyjne
  const el = 'kotwy', hm = g.H;
  o.dmin('blacha podstawy', 'otwory w obrysie blachy: e₂ = (b_p − s_B)/2 ≥ 1,2·d_f', g.e2, 1.2 * g.df, 'min', 'PN-EN 1993-1-8 tabl. 3.3');
  o.dmin('blacha podstawy', 'otwory w obrysie blachy: e₁ = (l_p − (n_L − 1)·s_L)/2 ≥ 1,2·d_f', g.e1, 1.2 * g.df, 'min', 'PN-EN 1993-1-8 tabl. 3.3');
  o.dmin(el, 'luz montażowy przy pasie: (s_B − b_f)/2 ≥ d_w/2 + √2·a_w + 5 mm', (g.sB - bf) / 2, hm.dw / 2 + Math.SQRT2 * aw + 5, 'zal', 'montaż (klucz, podkładka, spoina)');
  const smin = Math.max(5 * d, 50), cminR = Math.max(5 * d, 50);
  o.dmin(el, `rozstaw s_B ≥ s_min ≈ ${f(smin, 0)} mm (ETA)`, g.sB, smin, 'zal', 'ETA wyrobu (orientacyjnie 5d)');
  if (g.nL > 1) o.dmin(el, `rozstaw s_L ≥ s_min ≈ ${f(smin, 0)} mm (ETA)`, g.sL, smin, 'zal', 'ETA wyrobu (orientacyjnie 5d)');
  if (g.bc > 0 || g.lc > 0) {
    const cm = Math.min(g.cxP, g.cxZ, g.cy);
    o.dmin(el, 'kotwy w obrysie podpory betonowej: c > d/2', cm, d / 2, 'min', 'geometria');
    o.dmin(el, `odległość od krawędzi c ≥ c_min ≈ ${f(cminR, 0)} mm (ETA)`, cm, cminR, 'zal', 'ETA wyrobu (orientacyjnie 5d)');
    o.dmin('blacha podstawy', 'blacha w obrysie podpory (od strony przęsła)', g.pxP, 0, 'zal', 'oparcie');
    o.dmin('blacha podstawy', 'blacha w obrysie podpory (od czoła)', g.pxZ, 0, 'zal', 'oparcie');
  }
  if (g.hc < BIG / 2) o.dmin(el, `grubość elementu betonowego h ≥ h_min ≈ ${f(T.hmin, 0)} mm (ETA)`, g.hc, T.hmin, 'zal', 'ETA wyrobu');
  if (g.hc < BIG / 2) o.dmin(el, 'kotwa w obrysie elementu: h_c ≥ h_ef (+ płytka i nakrętka) + 30 mm otuliny', g.hc, hef + (k.typ === 'wbetonowane' ? (o.len.tAP || 10) + g.H.m : 0) + 30, 'min', 'geometria');
  if (k.typ === 'wklejane') { o.dmin(el, 'h_ef ≥ max(60; 4d) (ETA – typowo)', hef, Math.max(60, 4 * d), 'zal', 'ETA wyrobu'); o.dmax(el, 'h_ef ≤ 20d (ETA – typowo)', hef, 20 * d, 'zal'); }
  else o.dmin(el, 'h_ef ≥ 40 mm', hef, 40, 'min', 'PN-EN 1992-4 1.1');
  if (k.typ === 'wbetonowane') o.dmin(el, 'płytka kotwiąca: d_h ≥ 2d', T.dh, 2 * d, 'zal', 'PN-EN 1992-4 7.2.1.5');
  if (k.typ !== 'wklejane' && k.typ !== 'wbetonowane' && !(U.num(k.NRkp, 0) > 0)) o.uwagi.push('Uzupełnij parametry kotwy rozporowej z ETA (N_Rk,p, s_min, c_min, h_min, k₈).');
  if (k.typ === 'wklejane') o.uwagi.push(`Kotwy wklejane: τ_Rk = ${f(T.tauR, 1)} MPa (${cr ? 'beton zarysowany' : 'niezarysowany'}) – przyjmij z ETA zaprawy dla ${w.beton || 'C25/30'}, temperatury i warunków montażu; otwór Ø${f(o.len.dDrill, 0)} głęb. ${f(o.len.h0, 0)} mm.`);
  if (k.otw === 'podkladki') o.uwagi.push(`Otwory w blasze Ø${f(g.df, 0)} (powiększone) – na każdą kotwę podkładka przyspawana do blachy z otworem Ø${f(d + 2, 0)} mm (przeniesienie ścinania, PN-EN 1992-4 6.2.2.2).`);
  // podsumowanie
  const res = W.fin(o);
  res.opis = KT.txt(w);
  return res;
};

KT.txt = function (w) {
  const k = Object.assign({}, KT.defaults(null), w.kotwy || {});
  const nL = U.clamp(Math.round(U.num(k.nL, 1)), 1, 3);
  return `${2 * nL} × ${k.d} kl. ${k.kl}, ${KT.KROTKO[k.typ] || k.typ}, h_ef = ${U.fmt(U.num(k.hef), 0)} mm, rozstaw ${U.fmt(U.num(k.sB), 0)}${nL > 1 ? ` × ${U.fmt(U.num(k.sL), 0)}` : ''} mm`;
};

/* ---------------------------------------------------------- dobór automatyczny: kotwy, rozstaw i płyta podstawy
   Zmienne: średnica (od M16), liczba rzędów n_L, h_ef (kotwy wklejane / wbetonowane; rozporowe – h_ef z ETA bez zmian),
   rozstaw s_B (minimalny przy pasie), s_L, płyta b_p × l_p × t_p (l_p ≤ b_c, b_p ≤ l_c), l_b = l_p.
   Warunki: docisk płyty do betonu, wszystkie sprawdzenia kotew, blachy i spoin, wymagania konstrukcyjne.
   Kryterium: najmniejszy koszt umowny [kg] = masa płyty + 4·masa kotew + 0,4·n + 2·10⁻⁵·n·h_ef·d (wiercenie, zaprawa).
   Wynik zależy tylko od danych wejściowych (nie od wymiarów dobranych poprzednio) – obliczenia odtwarzalne. */
KT.bearArgs = (w) => ({ podloze: w.podloze, bp: U.num(w.bp), lp: U.num(w.lp), tp: U.num(w.tp), beton: w.beton, alfa: w.alfa, fd: w.fd, beta: w.beta, lb: U.num(w.lb, U.num(w.lp)), bc: U.num(w.bc, 0), lc: U.num(w.lc, 0), hc: U.num(w.hc, 0), ec: U.num(w.ec, 0) });
const CACHE = new Map();
KT.autoBase = function (ctx, w, F, REd, eta) {
  eta = eta || 1;
  const { sec, mat, ndp } = ctx, C = BS.C;
  const key = JSON.stringify([sec.nazwa, sec.h, sec.bd || sec.b, mat.gatunek, ndp.gcK, ndp.gM0, ndp.gM2, ndp.betaJ, ndp.gc, w.beton, w.alfa, w.bc, w.lc, w.hc, w.ec, w.aw, w.podloze, w.kotwy, Math.round(F.N), Math.round(F.Vx), Math.round(F.Vy), Math.round(REd || 0), eta]);
  if (CACHE.has(key)) return CACHE.get(key);
  const bf = sec.bd || sec.b || 100, aw = U.num(w.aw, 4) > 0 ? U.num(w.aw, 4) : 4;
  const k0 = Object.assign(KT.defaults(sec, (w.kotwy || {}).typ), w.kotwy || {});
  const bc = U.num(w.bc, 0), lc = U.num(w.lc, 0), lpMax = bc > 0 ? bc - 2 * Math.abs(U.num(w.ec, 0)) : 500, bpMax = lc > 0 ? lc : 900;
  const okA = (o) => o.checks.every(c => c.u <= eta + 1e-9) && o.detalFail.length === 0;
  const okB = (ww) => { if (!(REd > 0) || w.podloze === 'stal') return true; const o = C.bearingPlate(sec, mat, ndp, KT.bearArgs(ww), REd); return o.checks.every(c => c.u <= eta + 1e-9); };
  const kg = 7.85e-6;
  // warianty kotew uporządkowane wg dolnego oszacowania kosztu
  const vars = [];
  KT.SIZES.filter(D => dOf(D) >= 16).forEach(D => {
    const d = dOf(D), df = KT.hw(d).df, sB = KT.sBmin(bf, d, aw), bp = Math.max(KT.bpMin(sB, d), Math.ceil((bf + 40) / 10) * 10);
    if (bp > bpMax) return;
    [1, 2, 3].forEach(nL => {
      const sL = nL > 1 ? Math.ceil(Math.max(5 * d, 3 * df) / 10) * 10 : U.num(k0.sL, 100);
      const lpMin = Math.max(100, Math.ceil(((nL - 1) * sL + 2.4 * df) / 10) * 10);
      if (lpMin > lpMax) return;
      const hefs = k0.typ === 'wbetonowane' ? [150, 200, 250, 300, 350, 400, 500] : k0.typ === 'rozporowe' ? [U.num(k0.hef, KT.hefDef('rozporowe', d))] : [8, 10, 12, 15, 20].map(m => Math.ceil(m * d / 10) * 10).filter(h => h >= 60);
      hefs.forEach(hef => {
        const kk = Object.assign({}, k0, { d: D, nL, hef, sB, sL });
        const n = 2 * nL, L = KT.length(KT.geom(sec, Object.assign({}, w, { bp, lp: lpMin, tp: 10, kotwy: kk }))).Lr;
        const cA = 4 * n * kg * Math.PI / 4 * d * d * L + 0.4 * n + 2e-5 * n * hef * d;
        vars.push({ kk, bp, lpMin, n, cA, lb: cA + kg * bp * lpMin * 10 });
      });
    });
  });
  vars.sort((a, b) => a.lb - b.lb);
  const lps = (m) => Array.from(new Set([m, 120, 150, 180, 200, 250, 300, 350, 400, 450, 500].filter(v => v >= m && v <= lpMax)));
  let best = null, tries = 0;
  for (const v of vars) {
    if (best && v.lb >= best.cost) break;
    // wstępnie: same kotwy przy najcieńszej płycie (najkrótsze ramię przy ścinaniu) – jeśli nie spełniają, wariant odpada
    const pre = KT.design(ctx, Object.assign({}, w, { bp: v.bp, lp: v.lpMin, tp: 10, lb: v.lpMin, aw, kotwy: v.kk }), F); tries++;
    if (pre.checks.some(c => /^Kotwy/.test(c.grp) && !(c.u <= eta + 1e-9))) continue;
    for (const lp of lps(v.lpMin)) {
      if (best && v.cA + kg * v.bp * lp * 10 >= best.cost) break;
      let hit = null;
      for (const tp of [10, 12, 15, 20, 25, 30]) {
        if (best && v.cA + kg * v.bp * lp * tp >= best.cost) break;
        const ww = Object.assign({}, w, { bp: v.bp, lp, tp, lb: lp, aw, kotwy: v.kk });
        if (!okB(ww)) continue;
        tries++; const o = KT.design(ctx, ww, F);
        if (okA(o)) { hit = { w: ww, o, cost: v.cA + kg * v.bp * lp * tp }; break; }
      }
      if (hit) { if (!best || hit.cost < best.cost) best = hit; break; }
    }
  }

  o.normy.ndp1 = Object.assign({}, dp.ndp1, ((st || {}).normy || {}).ndp1 || {});
  o.kruche.z = Object.assign({}, d.kruche.z, ((st || {}).kruche || {}).z || {});
  const nS = (o.geom.przesla || []).length + 1;
  o.podpory = (o.podpory || []).slice(0, nS);
  while (o.podpory.length < nS) o.podpory.push({ typ: 'przegub', ltb: 'widelkowe', ss: 100, c: 0, wezel: { typ: 'brak' } });
  ['obciazenia', 'etapy', 'stezenia', 'podporyTymczasowe', 'styki', 'zebraSrodnika'].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });

};

  const env = md.etapy.map(() => ({ Mmax: new Float64Array(ns).fill(-Infinity), Mmin: new Float64Array(ns).fill(Infinity), Vmax: new Float64Array(ns).fill(-Infinity), Vmin: new Float64Array(ns).fill(Infinity), Mzmax: new Float64Array(ns).fill(-Infinity), Mzmin: new Float64Array(ns).fill(Infinity), wmax: new Float64Array(ns).fill(-Infinity), wmin: new Float64Array(ns).fill(Infinity), Nmax: -Infinity, Nmin: Infinity, R: {}, uSec: new Float64Array(ns), nSGN: 0, nChar: 0 }));

    const cl = Object.values(ltbCand[s]).sort((a, b) => b.v - a.v);
    const uniq = []; cl.forEach(c => { if (!uniq.includes(c.ci)) uniq.push(c.ci); });
    const cand = uniq.slice(0, opt.fast ? 3 : 6).map(ci => ({ combo: combos[ci], E: K.evaluate(an, combos[ci]) }));
    if (!cand.length) { out.ltb.push(null); continue; }
    const r = T.stage(md, an, sec, base, ndp, s, cand, st.analiza);
    out.ltb.push(r);
    r.runs.forEach(rn => { if (rn.err) err(`Zwichrzenie (etap ${s + 1}): ${rn.err}`); });
    r.segs.forEach((sg, k) => {
      if (sg.brak) return;
      const nm = `Zwichrzenie – segment ${U.fmt(sg.sg.x0 / 1000, 2)}–${U.fmt(sg.sg.x1 / 1000, 2)} m`;
      out.checks.push(BS.check({ id: `${s}-LT${k}`, grp: `SGN – stateczność${stName(s)}`, etap: s, n: nm, ref: sg.ltb.met === '6.3.2.3' ? '6.3.2.1, 6.3.2.3' : '6.3.2.1, 6.3.2.2', Ed: sg.sh.mabs, Rd: sg.Mb, unit: 'M', util: sg.u, x: sg.sh.xmax, combo: fmtCombo(sg.combo), d: sg }));
    });
    r.inter.forEach((it, k) => {
      out.checks.push(BS.check({ id: `${s}-I${k}`, grp: `SGN – stateczność${stName(s)}`, etap: s, n: `Interakcja N–My–Mz – segment ${U.fmt(it.sg.x0 / 1000, 2)}–${U.fmt(it.sg.x1 / 1000, 2)} m`, ref: '6.3.3 (6.61), (6.62), zał. B', Ed: it.u, Rd: 1, unit: '-', util: it.u, x: (it.sg.x0 + it.sg.x1) / 2, combo: fmtCombo(it.combo), d: it }));
    });
  }
  // --- SGU: ugięcia (etap końcowy) i drgania
  out.sgu = J.sgu(st, md, an, combos, sec, base, ndp);
  out.sgu.checks.forEach(c => out.checks.push(c));
  // --- podpory, połączenia, EQU
  out.podpory = J.supports(st, md, an, combos, sec, base, mat, ndp, env, out);
  try { out.styki = J.spliceRun(st, sec, mat, ndp, base, md, env, an, out); } catch (e) { err('Styki: ' + e.message); }
  // --- pożar
  if (st.pozar.aktywny) {
    try { out.pozar = J.fire(st, md, an, combos, sec, base, ndp); out.pozar.checks.forEach(c => out.checks.push(c)); } catch (e) { err('Pożar: ' + e.message); }
  }
  // --- zmęczenie
  if (st.zmeczenie.aktywny) {
    try { out.zm = J.fatigue(st, md, an, sec, base, ndp); out.zm.checks.forEach(c => out.checks.push(c)); } catch (e) { err('Zmęczenie: ' + e.message); }
  }
  // --- kruche pękanie
  try { out.kr = J.brittle(st, md, an, combos, sec, base, mat, ndp, out); out.kr.checks.forEach(c => out.checks.push(c)); } catch (e) { err('Kruche pękanie: ' + e.message); }
  // --- klasa wykonania
  out.exc = X.exc(st.wykonanie, {
    zmeczenie: !!st.zmeczenie.aktywny, spawana: sec.typ === 'spaw' || sec.kind === 'RHS' && sec.wyk === 'zimn', fy: mat.fy, gatunek: gat, podgatunek: pod,
    pozar: st.pozar.aktywny && out.pozar ? (out.pozar.prot ? `${st.pozar.ochrona === 'plyty' ? 'obudowa płytowa' : 'powłoka/natrysk'}: λp = ${st.pozar.lp} W/(m·K), dp = ${st.pozar.dp} mm (produkt z oceną właściwości użytkowych dla Ap/V = ${U.fmt(out.pozar.sf.ApV, 0)} m⁻¹, θcr = ${U.fmt(out.pozar.thcr, 0)} °C, R${st.pozar.R})` : `bez zabezpieczenia: θcr = ${U.fmt(out.pozar.thcr, 0)} °C`) : null,
    podniesienie: out.sgu && out.sgu.wcMax > 0.5 ? `strzałka podniesienia wykonawczego wc = ${U.fmt(out.sgu.wcMax, 0)} mm (kształt wg ugięcia od G)` : null,
    etapy: md.nE > 1 ? md.etapy.map((e, i) => `etap ${i + 1}: ${e.nazwa}`).join('; ') + (md.tmp.length ? `; podpory montażowe: ${md.tmp.map(t => `${t.id} (x = ${U.fmt(t.x / 1000, 2)} m, usunąć po etapie ${t.do + 1})`).join(', ')}` : '') + (md.stez.length ? `; stężenia: ${md.stez.map(z => `x = ${U.fmt(z.x / 1000, 2)} m od etapu ${z.od + 1}`).join(', ')}` : '') : null
  });
  // --- podsumowanie
  const chk = out.checks.filter(c => !c.info);
  out.nFail = chk.filter(c => c.status === 'fail').length;
  out.nWarn = chk.filter(c => c.status === 'warn').length;
  out.uMax = chk.reduce((m, c) => (c.util !== null && isFinite(c.util) && c.util > m ? c.util : m), 0);
  out.gov = chk.reduce((g, c) => (!g || (c.util || 0) > (g.util || 0) ? c : g), null);
  out.time = Date.now() - t0;
  return out;
};

/* ---------------------------------------------------------- SGU */
J.sgu = function (st, md, an, combos, sec, base, ndp) {
  const o = st.sgu, out = { checks: [], seg: [], wc: null, wcMax: 0 };
  const s = md.nE - 1, xs = an.xs, ns = an.ns;
  const R = an.res[s];
  // ugięcie od G (charakterystyczne, z historią etapów)
  const wG = new Float64Array(ns);
  Object.keys(R).forEach(k => { if (S.RODZAJE[R[k].c.rodzaj].stale) for (let i = 0; i < ns; i++) wG[i] += R[k].tot.w[i]; });
  out.wG = wG;
  let wc = new Float64Array(ns);
  if (o.podniesienie === 'auto') wc = Float64Array.from(wG);
  else if (o.podniesienie === 'wartosc' && U.num(o.wc) > 0) { const m = Math.max(...wG); if (m > 0) for (let i = 0; i < ns; i++) wc[i] = wG[i] / m * U.num(o.wc); }
  out.wc = wc; out.wcMax = Math.max(0, ...wc);
  const chars = combos.filter(c => c.typ === 'char' && c.etap === s);
  const lim = { wmax: U.num(o.wmax, 250), w3: U.num(o.w3, 350) };
  const rel = (arr, sg) => {
    const a = S.at(xs, arr, sg.x0), b = S.at(xs, arr, sg.x1); let mx = -Infinity, mn = Infinity, xm = sg.x0;
    for (let i = 0; i < ns; i++) { const x = xs[i]; if (x < sg.x0 - 1e-6 || x > sg.x1 + 1e-6) continue; let r; if (sg.wsp) r = arr[i] - (sg.x0 === 0 ? b : a); else r = arr[i] - (a + (b - a) * (x - sg.x0) / (sg.x1 - sg.x0)); if (r > mx) { mx = r; xm = x; } if (r < mn) mn = r; }
    return { mx, mn, xm };
  };
  out.envTot = new Float64Array(ns).fill(-Infinity); out.envVar = new Float64Array(ns).fill(-Infinity);
  md.seg.forEach(sg => {
    const Lref = sg.wsp ? 2 * (sg.x1 - sg.x0) : sg.x1 - sg.x0;
    let best = { v: -Infinity }, best3 = { v: -Infinity }, up = { v: Infinity };
    chars.forEach(c => {
      const E = K.evaluate(an, c);
      const wn = new Float64Array(ns); for (let i = 0; i < ns; i++) wn[i] = E.w[i] - wc[i];
      const cv = Object.assign({}, c, { terms: c.terms.filter(t => !S.RODZAJE[R[t.id].c.rodzaj].stale) });
      const Ev = K.evaluate(an, cv);
      for (let i = 0; i < ns; i++) { if (wn[i] > out.envTot[i]) out.envTot[i] = wn[i]; if (Ev.w[i] > out.envVar[i]) out.envVar[i] = Ev.w[i]; }
      const r1 = rel(wn, sg), r3 = rel(Ev.w, sg);
      if (r1.mx > best.v) best = { v: r1.mx, x: r1.xm, c };
      if (r1.mn < up.v) up = { v: r1.mn, c };
      if (r3.mx > best3.v) best3 = { v: r3.mx, x: r3.xm, c };
    });
    if (!chars.length) return;
    const rec = { sg, Lref, wmax: best.v, xw: best.x, w3: best3.v, x3: best3.x, wup: up.v, limMax: Lref / lim.wmax, lim3: Lref / lim.w3, cmax: best.c, c3: best3.c };
    out.seg.push(rec);
    out.checks.push(BS.check({ id: 'w-' + sg.id, grp: 'SGU – ugięcia (eksploatacja)', etap: s, n: `Ugięcie wmax – ${sg.n}${o.podniesienie !== 'brak' ? ' (po odjęciu podniesienia wc)' : ''}`, ref: 'PN-EN 1990 A1.4.3; PN-EN 1993-1-1 7.2.1', Ed: Math.max(0, rec.wmax), Rd: rec.limMax, unit: 'mm', util: Math.max(0, rec.wmax) / rec.limMax, x: rec.xw, combo: best.c ? best.c.opis : '', d: rec, lim: `${sg.wsp ? '2·' : ''}L/${lim.wmax}` }));
    out.checks.push(BS.check({ id: 'w3-' + sg.id, grp: 'SGU – ugięcia (eksploatacja)', etap: s, n: `Ugięcie od obciążeń zmiennych w3 – ${sg.n}`, ref: 'PN-EN 1990 A1.4.3', Ed: Math.max(0, rec.w3), Rd: rec.lim3, unit: 'mm', util: Math.max(0, rec.w3) / rec.lim3, x: rec.x3, combo: best3.c ? best3.c.opis : '', d: rec, lim: `${sg.wsp ? '2·' : ''}L/${lim.w3}` }));
  });
  // ugięcia w etapach montażu (informacyjnie)
  out.montaz = [];
  for (let e = 0; e < md.nE - 1; e++) {
    let mx = 0, xm = 0;
    combos.filter(c => c.typ === 'char' && c.etap === e).forEach(c => { const E = K.evaluate(an, c); for (let i = 0; i < ns; i++) if (E.w[i] > mx) { mx = E.w[i]; xm = xs[i]; } });
    out.montaz.push({ etap: e, w: mx, x: xm });
    out.checks.push(BS.check({ id: 'wm' + e, grp: 'SGU – ugięcia (eksploatacja)', etap: e, n: `Ugięcie w etapie ${e + 1} (${md.etapy[e].nazwa}) – informacyjnie`, ref: 'PN-EN 1991-1-6', Ed: mx, Rd: null, unit: 'mm', util: null, info: true, x: xm, combo: '' }));
  }
  // przemieszczenia poziome (gdy są obciążenia poziome)
  const hasY = md.cases.some(c => c.parts.some(p => p.kier === 'y'));
  if (hasY) {
    let umax = 0, xu = 0, cu = null;
    chars.forEach(c => { const E = K.evaluate(an, c); for (let i = 0; i < ns; i++) if (Math.abs(E.u[i]) > umax) { umax = Math.abs(E.u[i]); xu = xs[i]; cu = c; } });
    const Lm = Math.max(...md.seg.map(g => g.x1 - g.x0));
    out.checks.push(BS.check({ id: 'u', grp: 'SGU – ugięcia (eksploatacja)', n: 'Przemieszczenie poziome u', ref: 'PN-EN 1990 A1.4.3', Ed: umax, Rd: Lm / U.num(o.uLim, 200), unit: 'mm', util: umax / (Lm / U.num(o.uLim, 200)), x: xu, combo: cu ? cu.opis : '', lim: `L/${o.uLim}` }));
  }
  // drgania – masa: G + ψ2·Q (etap końcowy)
  if (o.drgania !== false) {
    const mass = [], pm = [];
    Object.keys(R).forEach(k => {
      const c = R[k].c; let f = 0;
      if (S.RODZAJE[c.rodzaj].stale) f = 1; else if (c.rodzaj !== 'A' && c.etap === s) f = K.psi(c)[2];
      if (f <= 0) return;
      c.parts.forEach(p => {
        if (p.kier !== 'z') return;
        if (p.typ === 'q') {
          // podział na odcinki stałej intensywności (średnia na elemencie siatki)
          const n = 8; for (let j = 0; j < n; j++) { const a = p.x0 + (p.x1 - p.x0) * j / n, b = p.x0 + (p.x1 - p.x0) * (j + 1) / n, q = p.q0 + (p.q1 - p.q0) * (j + 0.5) / n; mass.push({ x0: a, x1: b, m: Math.max(0, f * q) / 9810 }); }
        } else if (p.typ === 'P') pm.push({ x: p.x, m: Math.max(0, f * p.P) / 9810 });
      });
    });
    try {
      const fr = F.freq({ xs: md.xs, EI: U.E * sec.Iy, mass, pm, supports: md.systems[s].map(p => ({ x: p.x, kv: p.kv, kr: p.kr })) });
      out.f1 = fr.f; out.mode = fr.shape;
      out.checks.push(BS.check({ id: 'f1', grp: 'SGU – drgania', n: 'Częstotliwość drgań własnych f1 (masa G + ψ2·Q)', ref: 'PN-EN 1990 A1.4.4; PN-EN 1993-1-1 7.2.3', Ed: fr.f, Rd: U.num(o.fmin, 3), unit: 'Hz', util: U.num(o.fmin, 3) / fr.f, combo: 'G + Σψ2·Q', d: fr, inverse: true }));
    } catch (e) { out.checks.push(BS.check({ id: 'f1', grp: 'SGU – drgania', n: 'Częstotliwość drgań własnych', ref: 'A1.4.4', util: null, info: true, Ed: null, Rd: null, unit: 'Hz', combo: e.message })); }
  }
  return out;
};

/* ---------------------------------------------------------- podpory i połączenia */
J.supports = function (st, md, an, combos, sec, base, mat, ndp, env, out) {
  const res = [];
  const equ = K.equ(md, an, ndp); out.equ = equ;
  const s = md.nE - 1;
  const allSup = md.sup.map(p => ({ p, etapy: md.etapy.map((e, i) => i) })).concat(md.tmp.map(t => ({ p: t, etapy: md.etapy.map((e, i) => i).filter(i => i <= t.do) })));
  allSup.forEach(({ p, etapy }) => {
    const r = { id: p.id, x: p.x, typ: p.typ, tymcz: p.tymcz, wezel: p.wezel, etapy: [], checks: [] };
    let Rmax = 0, Mmax = 0, cMax = null, eMax = 0;
    etapy.forEach(e => { const q = env[e].R[p.id]; if (q) { r.etapy.push({ e, max: q.max, min: q.min, M: q.Mmax, Ry: q.Rymax }); if (Math.abs(q.max) > Rmax) { Rmax = Math.abs(q.max); cMax = q.cmax; eMax = e; } if (q.Mmax > Mmax) Mmax = q.Mmax; } });
    r.Rmax = Rmax; r.Mmax = Mmax; r.etapMax = eMax;
    // reakcje charakterystyczne od przypadków (etap końcowy lub ostatni etap istnienia)
    const eK = Math.max(...etapy);
    r.Rk = Object.keys(an.res[eK]).map(k => ({ id: k, nazwa: an.res[eK][k].c.nazwa, rodzaj: an.res[eK][k].c.rodzaj, R: an.res[eK][k].tot.R[p.id] ? an.res[eK][k].tot.R[p.id].R : 0, M: an.res[eK][k].tot.R[p.id] ? an.res[eK][k].tot.R[p.id].M : 0 }));
    r.eK = eK;
    const q = equ.filter(z => z.id === p.id);
    r.equ = q;
    const grp = `Podpory i połączenia – podpora ${p.id}`;
    const Rmin = Math.min(...q.map(z => z.Rmin));
    if (Rmin < 0) {
      const anch = p.wezel && ['blacha_czolowa', 'blacha_zebrowa', 'katowniki', 'spawane'].includes(p.wezel.typ);
      const kotw = J.hasAnchors(p.wezel);
      r.checks.push(BS.check({ id: `${p.id}-EQU`, grp, n: 'Odrywanie podpory (EQU) – wymagane zakotwienie', ref: 'PN-EN 1990 6.4.3.1, tabl. A1.2(A)', Ed: -Rmin, Rd: null, unit: 'F', util: null, forceStatus: kotw ? 'ok' : anch ? 'warn' : 'fail', info: false, x: p.x, combo: 'EQU: 1,10/0,90·G + 1,5·Q', note: kotw ? 'Siłę odrywającą przenoszą kotwy płyty podporowej – sprawdzenia kotew (PN-EN 1992-4) i blachy podstawy poniżej.' : anch ? 'Siłę odrywającą musi przenieść połączenie (sprawdź śruby na rozciąganie).' : 'Oparcie bez zakotwienia – zaprojektuj kotwienie na siłę odrywającą (Płyta podporowa → Kotwy).' }));
    }
    const isEnd = !p.tymcz && ((p.idx === 0 && md.wL === 0) || (p.idx === md.sup.length - 1 && md.wP === 0));
    const w = p.wezel || { typ: 'brak' };
    let conn = ['blacha_czolowa', 'blacha_zebrowa', 'katowniki', 'spawane'].includes(w.typ);
    if (conn && w.typ !== 'spawane' && !(sec.kind === 'I' || sec.kind === 'U')) { out.errors.push(`Podpora ${p.id}: połączenie śrubowe przez środnik (blacha czołowa / żebrowa / kątowniki) jest obsługiwane dla dwuteowników i ceowników – dla ${sec.kind === 'RHS' ? 'rur' : 'kątowników'} wybierz połączenie spawane lub oparcie.`); conn = false; }
    // docisk środnika / żebro
    if (!conn && Rmax > 0 && sec.kind !== 'L') {
      const zSup = (out.zebra || []).find(z => Math.abs(z.x - p.x) <= 30);
      if ((w.zebro || zSup) && (sec.kind === 'I' || sec.kind === 'U')) {
        const sr = R.stiffener(sec, base, ndp, { F: Rmax, bs: w.zebro ? U.num(w.bs, 80) : zSup.bs, ts: w.zebro ? U.num(w.ts, 10) : zSup.ts, ch: w.zebro ? J.snipeSup(st, sec, w).c : zSup.c, koniec: isEnd, e: U.num(p.src && p.src.c, 0) + U.num(p.ss) / 2, jedno: !w.zebro && zSup.strona === 'jedna' });
        if (zSup) zSup.podpora = p.id;
        r.zebro = sr;
        r.checks.push(BS.check({ id: `${p.id}-ZB`, grp, n: 'Żebro podporowe – wyboczenie (przekrój krzyżowy z 15εtw)', ref: 'PN-EN 1993-1-5 9.4; PN-EN 1993-1-1 6.3.1', Ed: Rmax, Rd: sr.NbRd, unit: 'F', util: sr.uB, x: p.x, combo: cMax !== null ? combos[cMax].opis : '', d: sr }));
        r.checks.push(BS.check({ id: `${p.id}-ZD`, grp, n: 'Żebro podporowe – docisk końców żeber', ref: 'PN-EN 1993-1-1 6.2.4', Ed: Rmax, Rd: sr.Fbear, unit: 'F', util: sr.uC, x: p.x, combo: '', d: sr }));
        if (sr.ctS > sr.ctLim) r.checks.push(BS.check({ id: `${p.id}-ZC`, grp, n: 'Żebro – smukłość ścianki bs/ts', ref: 'PN-EN 1993-1-5 9.2.1(8)', Ed: sr.ctS, Rd: sr.ctLim, unit: '-', util: sr.ctS / sr.ctLim, d: sr }));
      } else {
        const pnl = (out.panels || []).find(q => p.x >= q.x0 - 1e-6 && p.x <= q.x1 + 1e-6);
        const pr = R.patch(sec, base, ndp, { F: Rmax, ss: U.num(p.ss, 0), typ: isEnd ? 'c' : 'a', c: U.num(p.src && p.src.c, 0), pas: 'd', a: pnl && isFinite(pnl.a) ? pnl.a : 0 });
        r.patch = pr;
        r.checks.push(BS.check({ id: `${p.id}-PL`, grp, n: `Docisk środnika nad podporą (typ ${isEnd ? 'c' : 'a'})`, ref: 'PN-EN 1993-1-5 6.2–6.5', Ed: Rmax, Rd: pr.FRd, unit: 'F', util: pr.u, x: p.x, combo: cMax !== null ? combos[cMax].opis : '', d: pr }));
        if (!isEnd && Mmax > 0) {
          const e1 = Mmax / (Math.min(sec.Wel_t, sec.Wel_b) * base.fy / ndp.gM0);
          r.checks.push(BS.check({ id: `${p.id}-PI`, grp, n: 'Interakcja F–M nad podporą', ref: 'PN-EN 1993-1-5 7.2', Ed: pr.u + 0.8 * e1, Rd: 1.4, unit: '-', util: (pr.u + 0.8 * e1) / 1.4, x: p.x, combo: '', d: { eta1: e1, eta2: pr.u } }));
        }
      }
    }
    if (w.typ === 'oparcie' && p.typ === 'utwierdzenie' && Mmax > 1e3) out.warnings.push(`Podpora ${p.id}: utwierdzenie na płycie podporowej – moment M_Ed = ${U.fmt(Mmax / 1e6, 1)} kNm nie jest przenoszony w modelu płyty i kotew (sprawdzono jak oparcie przegubowe); zaprojektuj węzeł momentowy lub zmień typ podpory.`);
    // dobór automatyczny kotew, rozstawu i płyty podstawy – wymiary efektywne węzła (UI przepisuje je do danych)
    let wE = w, F2 = null;
    if (J.hasAnchors(w) && sec.kind !== 'L') {
      F2 = J.anchorForces(w, p, etapy, env, q, md, sec);
      if (w.kotwy.auto === true) {
        const a = KT.autoBase({ sec, mat, ndp }, w, F2, Rmax, 1);
        if (a.ok) { wE = Object.assign({}, w, { bp: a.w.bp, lp: a.w.lp, tp: a.w.tp, lb: a.w.lb, aw: a.w.aw, kotwy: Object.assign({}, w.kotwy, { d: a.w.kotwy.d, nL: a.w.kotwy.nL, hef: a.w.kotwy.hef, sB: a.w.kotwy.sB, sL: a.w.kotwy.sL }) }); r.auto = { ok: true, txt: KT.autoTxt(wE) }; }
        else {
          // podpowiedź: inny rodzaj kotew lub wyższa klasa stali
          let alt = null, altK = null;
          for (const [t, kl] of [['wbetonowane', w.kotwy.kl], ['wklejane', w.kotwy.kl], [w.kotwy.typ, '8.8'], ['wbetonowane', '8.8']]) {
            if (t === w.kotwy.typ && kl === w.kotwy.kl) continue;
            const a2 = KT.autoBase({ sec, mat, ndp }, Object.assign({}, w, { kotwy: Object.assign({}, w.kotwy, { typ: t, kl, hef: KT.hefDef(t, 20) }) }), F2, Rmax, 1);
            if (a2.ok) { alt = `${KT.TYPY[t]}, kl. ${kl}: ${KT.autoTxt(a2.w)}`; altK = { typ: t, kl }; break; }

J.jointRun = function (st, sec, mat, ndp, base, p, w, info, grp, combo, out) {

  try { o = W.design(J.jointCtx(sec, mat, ndp, base), w, F); } catch (e) { out.errors.push(`Połączenie ${p.id}: ${e.message}`); return null; }
  if (!o) return null;

};
J.spliceForces = function (s, md, env, an) {
  if (s.silyRecz) return { M: Math.abs(U.num(s.MEd)) * 1e6, V: Math.abs(U.num(s.VEd)) * 1e3, N: U.num(s.NEd) * 1e3, recz: true };
  const x = U.clamp(U.num(s.x) * 1000, 0, md.L), xs = an.xs; let k = 0; for (let i = 0; i < xs.length; i++) if (Math.abs(xs[i] - x) < Math.abs(xs[k] - x)) k = i;
  let Mx = 0, Vx = 0, Nx = 0;
  env.forEach(e => { Mx = Math.max(Mx, Math.abs(e.Mmax[k]), Math.abs(e.Mmin[k])); Vx = Math.max(Vx, Math.abs(e.Vmax[k]), Math.abs(e.Vmin[k])); if (isFinite(e.Nmax)) Nx = Math.max(Nx, Math.abs(e.Nmax), Math.abs(e.Nmin)); });

    o.uwagi.forEach(u => out.warnings.push(`Styk ${id}: ${u}`));

/* ---------------------------------------------------------- pożar */
J.fire = function (st, md, an, combos, sec, base, ndp) {
  const s = md.nE - 1, xs = an.xs;
  const fc = combos.filter(c => c.typ === 'poz' && c.etap === s);
  let gov = null;
  const intSup = md.sup.filter(p => !((p.idx === 0 && md.wL === 0) || (p.idx === md.sup.length - 1 && md.wP === 0)));
  fc.forEach(c => {
    const E = K.evaluate(an, c);
    for (let i = 0; i < xs.length; i++) {
      const atSup = intSup.some(p => Math.abs(p.x - xs[i]) < 1);
      const sc = Math.abs(E.M[i]) / (atSup ? 0.85 : 1);
      if (!gov || sc > gov.sc) gov = { sc, M: E.M[i], V: Math.max(...Array.from(E.V).map(Math.abs)), x: xs[i], c, E, atSup };
    }
  });
  if (!gov) return { checks: [] };
  let Mcr = Infinity;
  try { const r = T.mcrRun(md, an, sec, U.E, U.G, gov.c, gov.E.M); let mm = 0; for (let i = 0; i < xs.length; i++) mm = Math.max(mm, Math.abs(gov.E.M[i])); Mcr = r.lam * mm; } catch (e) { /* bez zwichrzenia */ }
  let Mlt = 0; for (let i = 0; i < xs.length; i++) Mlt = Math.max(Mlt, Math.abs(gov.E.M[i]));
  const Efi = { M: gov.M, V: gov.V, Mpos: gov.M >= 0, przyPodporze: gov.atSup, Mcr, Mlt };
  const r = X.fire(sec, base, ndp, st.pozar, Efi);
  r.Efi = Efi; r.combo = gov.c;
  r.checks = [
    BS.check({ id: 'fi-t', grp: 'Pożar – PN-EN 1993-1-2', n: `Odporność ogniowa R${r.Rreq}: czas osiągnięcia θa,cr`, ref: '4.2.3, 4.2.5', Ed: r.Rreq, Rd: r.tcr === null ? Infinity : r.tcr, unit: 'min', util: r.tcr === null ? 0 : r.Rreq / r.tcr, combo: gov.c.opis, d: r }),
    BS.check({ id: 'fi-u', grp: 'Pożar – PN-EN 1993-1-2', n: `Wytężenie w ${r.Rreq}. minucie (θa = ${U.fmt(r.thR, 0)} °C)`, ref: '4.2.3.3, 4.2.3.4', Ed: r.uR, Rd: 1, unit: '-', util: r.uR, x: gov.x, combo: gov.c.opis, d: r })
  ];
  return r;
};

/* ---------------------------------------------------------- zmęczenie */
J.fatigue = function (st, md, an, sec, base, ndp) {
  const o = st.zmeczenie, s = md.nE - 1, xs = an.xs, ns = an.ns;
  const ids = (o.przypadki || []).filter(k => an.res[s][k]);
  const out = { checks: [], ids };
  if (!ids.length) { out.checks.push(BS.check({ id: 'fat0', grp: 'Zmęczenie – PN-EN 1993-1-9', n: 'Nie wskazano przypadków obciążenia cyklicznego', ref: '', util: null, info: true, unit: '-' })); return out; }
  const dM = new Float64Array(ns), dV = new Float64Array(ns);
  const k = U.num(o.phi, 1) * (o.zmiennyZnak ? 2 : 1);
  ids.forEach(id => { const r = an.res[s][id].tot; for (let i = 0; i < ns; i++) { dM[i] += k * r.M[i]; dV[i] += k * r.V[i]; } });
  const gMf = X.gMf(o.ocena, o.skutki), gFf = ndp.gFf, n = U.num(o.n, 2e6);
  out.gMf = gMf; out.n = n;
  const zw = (m) => { // odległość włókna od osi obojętnej
    switch (m) { case 'pas_g': return sec.h - sec.zc; case 'spoina_g': return sec.h - sec.tg - sec.zc; case 'spoina_d': return sec.zc - sec.td; default: return sec.zc; }
  };
  out.det = (o.detale || []).map((d, j) => {
    const cat = X.DETALE.find(q => q.k === d.k) || X.DETALE[0];
    const dc = d.k === 'user' ? U.num(d.dc, 71) : cat.dc;
    let ds = 0, xm = 0;
    for (let i = 0; i < ns; i++) { const v = Math.abs(dM[i]) * zw(d.miejsce) / sec.Iy; if (v > ds) { ds = v; xm = xs[i]; } }
    const dsd = gFf * ds, dcd = dc / gMf;
    const Nf = X.Nsigma(dsd, dcd), D = n / Nf;
    const dsE2 = dsd * Math.pow(Math.max(D, 0) * Nf / 2e6, 1 / 3) || 0;
    const r = { cat, dc, ds, x: xm, dsd, dcd, Nf, D, miejsce: d.miejsce };
    out.checks.push(BS.check({ id: 'fat' + j, grp: 'Zmęczenie – PN-EN 1993-1-9', n: `Δσ – ${cat.n.split(' – ')[1] || cat.n} (${d.miejsce})`, ref: '8(2), 7.1, rys. 7.1; Palmgren–Miner', Ed: D, Rd: 1, unit: '-', util: D, x: xm, combo: `Δσ = ${U.fmt(ds, 1)} MPa, n = ${U.fmt(n, 0)}`, d: r }));
    out.checks.push(BS.check({ id: 'fatL' + j, grp: 'Zmęczenie – PN-EN 1993-1-9', n: 'Ograniczenie zakresu naprężeń Δσ ≤ 1,5·fy', ref: '8(1)', Ed: ds, Rd: 1.5 * base.fy, unit: 'MPa', util: ds / (1.5 * base.fy), x: xm }));
    return r;
  });
  let dt = 0, xt = 0;
  for (let i = 0; i < ns; i++) { const v = Math.abs(dV[i]) / (sec.hw * sec.tw); if (v > dt) { dt = v; xt = xs[i]; } }
  const dtc = U.num(o.dtc, 100), Nt = X.Ntau(gFf * dt, dtc / gMf), Dt = n / Nt;
  out.tau = { dt, x: xt, dtc, Nt, D: Dt };
  out.checks.push(BS.check({ id: 'fatT', grp: 'Zmęczenie – PN-EN 1993-1-9', n: 'Δτ – środnik (materiał rodzimy)', ref: '8(2), rys. 7.2', Ed: Dt, Rd: 1, unit: '-', util: Dt, x: xt, combo: `Δτ = ${U.fmt(dt, 1)} MPa`, d: out.tau }));
  return out;
};

/* ---------------------------------------------------------- kruche pękanie */
J.brittle = function (st, md, an, combos, sec, base, mat, ndp, outAll) {
  const o = st.kruche, s = md.nE - 1, xs = an.xs;
  const TEd = U.num(o.Tmd, -30) + U.num(o.dTr) + U.num(ndp.dTR) + U.num(o.dTeps) + U.num(o.dTcf);
  const out = { TEd, checks: [], el: [] };
  let sT = 0, sB = 0, sW = 0;
  combos.filter(c => c.typ === 'kruche' && c.etap === s).forEach(c => {
    const E = K.evaluate(an, c);
    const nT = Math.max(0, E.N) / sec.A;
    for (let i = 0; i < xs.length; i++) {
      const m = E.M[i];
      if (m < 0) sT = Math.max(sT, -m / sec.Wel_t + nT); else sB = Math.max(sB, m / sec.Wel_b + nT);
      sW = Math.max(sW, Math.abs(m) * Math.max(sec.h - sec.tg - sec.zc, sec.zc - sec.td) / sec.Iy + nT);
    }
  });
  const els = sec.kind === 'I' ? [{ n: 'pas górny', t: sec.tg, s: sT }, { n: 'pas dolny', t: sec.td, s: sB }, { n: 'środnik', t: sec.tw, s: sW }]
    : sec.kind === 'U' ? [{ n: 'półki', t: sec.tf, s: Math.max(sT, sB) }, { n: 'środnik', t: sec.tw, s: sW }]
      : [{ n: sec.kind === 'RHS' ? 'ścianki rury' : 'ramiona kątownika', t: sec.tMax, s: Math.max(sT, sB, sW) }];
  (outAll.podpory || []).forEach(p => {
    const w = p.wezel || {};
    if (['blacha_czolowa', 'blacha_zebrowa'].includes(w.typ) && U.num(w.tp) > 0) els.push({ n: `blacha połączenia ${p.id}`, t: U.num(w.tp), s: null });
    if (w.zebro && U.num(w.ts) > 0) els.push({ n: `żebro podporowe ${p.id}`, t: U.num(w.ts), s: null });
    if (w.typ === 'oparcie' && U.num(w.tp) > 0 && w.podloze !== 'stal') els.push({ n: `płyta podporowa ${p.id}`, t: U.num(w.tp), s: null });
  });
  els.forEach((e, j) => {
    const fyt = M.fy(mat.gatunek, e.t, ndp.fySrc).fy - 0.25 * e.t;
    const ratio = e.s === null ? U.num(o.plyty, 0.75) : e.s / fyt;
    const r = X.tmax(mat.gatunek, mat.podgatunek, TEd, ratio);
    Object.assign(e, { fyt, ratio, r });
    out.el.push(e);
    if (r.err) { out.checks.push(BS.check({ id: 'kr' + j, grp: 'Kruche pękanie – PN-EN 1993-1-10', n: `Grubość – ${e.n}`, ref: '2.3, tabl. 2.1', util: null, forceStatus: 'fail', Ed: e.t, Rd: null, unit: 'mm', combo: r.err })); return; }
    out.checks.push(BS.check({ id: 'kr' + j, grp: 'Kruche pękanie – PN-EN 1993-1-10', n: `Grubość ${e.n} t = ${U.fmt(e.t, 1)} mm (${mat.gatunek}${mat.podgatunek}, TEd = ${U.fmt(TEd, 0)} °C, σEd = ${U.fmt(ratio, 2)}·fy(t))`, ref: '2.2, 2.3, tabl. 2.1', Ed: e.t, Rd: r.t, unit: 'mm', util: e.t / r.t, combo: e.s === null ? `σEd przyjęto ${U.fmt(ratio, 2)}·fy(t)` : 'G + ψ1·Q1 + Σψ2·Qi', d: e, forceStatus: r.over ? 'warn' : undefined }));
  });
  if (o.z && o.z.aktywny) {
    const z = { Za: X.Za(U.num(o.z.a)), Zb: U.num(o.z.Zb), Zc: X.Zc(U.num(o.z.s)), Zd: U.num(o.z.Zd), Ze: U.num(o.z.Ze) };
    const zc = X.zClass(z);
    out.z = Object.assign(z, zc);
    out.checks.push(BS.check({ id: 'krZ', grp: 'Kruche pękanie – PN-EN 1993-1-10', n: `Właściwości w kierunku grubości: ZEd = ${zc.ZEd} → ${zc.cls}`, ref: 'rozdz. 3, tabl. 3.1, 3.2', util: null, info: true, Ed: zc.ZEd, Rd: null, unit: '-', combo: `Za = ${z.Za}, Zb = ${z.Zb}, Zc = ${z.Zc}, Zd = ${z.Zd}, Ze = ${z.Ze}` }));
  }
  return out;
};


/* ---------------------------------------------------------- schematy typowe */
J.SCHEMATY = [
  { id: 'swob', n: 'Belka swobodnie podparta', d: 'przegub – przegub (np. belka stropowa, nadproże)', przesla: 1, sup: ['przegub', 'przegub'] },
  { id: 'wspornik', n: 'Wspornik', d: 'utwierdzenie – koniec swobodny (balkon, daszek)', przesla: 0, wspP: true, sup: ['utwierdzenie'] },
  { id: 'utwprz', n: 'Utwierdzona – przegubowa', d: 'jeden koniec sztywny (węzeł momentowy), drugi przegubowy', przesla: 1, sup: ['utwierdzenie', 'przegub'] },
  { id: 'utwutw', n: 'Obustronnie utwierdzona', d: 'oba końce sztywne', przesla: 1, sup: ['utwierdzenie', 'utwierdzenie'] },
  { id: 'wspP', n: 'Jednoprzęsłowa ze wspornikiem', d: 'przęsło + wspornik prawy', przesla: 1, wspP: true, sup: ['przegub', 'przegub'] },
  { id: 'wsp2', n: 'Jednoprzęsłowa z dwoma wspornikami', d: 'wsporniki z obu stron przęsła', przesla: 1, wspL: true, wspP: true, sup: ['przegub', 'przegub'] },
  { id: 'ciagla', n: 'Belka ciągła', d: 'liczba przęseł – pole „Liczba przęseł” (np. płatew, podciąg)', przesla: 3, ciagla: true, sup: ['przegub', 'przegub', 'przegub', 'przegub'] },
  { id: 'montaz', n: 'Belka z podporą montażową', d: 'etap 1 – podpora tymczasowa w środku, etap 2 – po jej usunięciu', przesla: 1, sup: ['przegub', 'przegub'], tmp: true },
  { id: 'stropowa', n: 'Belka stropowa z etapem montażu', d: 'montaż bez stężenia pasa górnego, eksploatacja – pas górny stężony płytą', przesla: 1, sup: ['przegub', 'przegub'], stages: true }
];
J.applyScheme = function (st, id) {
  const sc = J.SCHEMATY.find(q => q.id === id); if (!sc) return st;
  const g = st.geom || (st.geom = {});
  const L0 = U.num((g.przesla || [])[0], 6) || 6;
  const nP = sc.ciagla ? Math.max(2, (g.przesla || []).length) : sc.przesla;
  g.przesla = Array.from({ length: nP }, (_, i) => U.num((g.przesla || [])[i], L0) || L0);
  g.wspL = sc.wspL ? (U.num(g.wspL) || Math.max(1, Math.round(L0 / 4 * 2) / 2)) : 0;
  g.wspP = sc.wspP ? (U.num(g.wspP) || (sc.przesla ? Math.max(1, Math.round(L0 / 4 * 2) / 2) : L0 / 2)) : 0;
  if (!sc.przesla && sc.wspP) g.wspP = U.num(g.wspP) || 2;
  const old = st.podpory || [];
  const sup = sc.ciagla ? Array.from({ length: nP + 1 }, () => 'przegub') : sc.sup;
  st.podpory = sup.map((t, i) => Object.assign({ ss: 100, c: 0, wezel: { typ: 'brak' } }, old[i] || {}, { typ: t, ltb: t === 'utwierdzenie' ? 'pelne' : 'widelkowe' }));
  st.schemat = id;
  if (sc.tmp) {
    if (!st.etapy || st.etapy.length < 2) st.etapy = [{ id: 'E1', nazwa: 'Montaż – na podporze tymczasowej', typ: 'montaz', opis: '' }, { id: 'E2', nazwa: 'Eksploatacja', typ: 'eksploatacja', opis: '' }];
    st.podporyTymczasowe = [{ x: (g.wspL || 0) + g.przesla[0] / 2, usunietaPo: 0, ss: 100 }];
  } else st.podporyTymczasowe = [];
  if (sc.stages) {
    st.etapy = [{ id: 'E1', nazwa: 'Montaż – układanie płyt stropowych', typ: 'montaz', opis: 'Belka bez stężenia pasa górnego.' }, { id: 'E2', nazwa: 'Eksploatacja', typ: 'eksploatacja', opis: 'Pas górny stężony ciągle przez płyty.' }];
    st.stezenieCiagle = Object.assign({}, st.stezenieCiagle, { pasG: true, odEtapu: 1 });
  }
  if (!sc.tmp && !sc.stages && st.etapy && st.etapy.length > 1 && id !== st._keepStages) { /* etapy pozostają – zmienia je użytkownik */ }
  return st;
};

/* ---------------------------------------------------------- dobór */
// grupy sprawdzeń pomijane w doborze przekroju (połączenia/oparcia dobiera „Dobierz węzły”; pożar – zabezpieczenie; kruche pękanie – gatunek)
const MEMBER = (c) => !/^Podpory|^Styki|^Pożar|^Kruche|^Zmęczenie/.test(c.grp);
J.passesFor = function (r, eta, filt) {
  if (r.errors.length) return false;
  return r.checks.filter(c => !c.info && (!filt || filt(c))).every(c => c.status !== 'fail' && (c.util === null || !isFinite(c.util) ? c.status !== 'fail' : c.util <= eta + 1e-9));
};
J.memberFilter = MEMBER;
// kandydaci przekroju tego samego rodzaju, rosnąco wg masy
J.doborKandydaci = function (st) {
  const d = st.przekroj || {};
  if (d.typ === 'spaw') {
    const out = [], h = U.num(d.h, 600), b = U.num(d.bg, 250), aw = U.num(d.aw, 4);
    [6, 8, 10, 12, 14, 16, 20].forEach(tw => [8, 10, 12, 14, 15, 16, 18, 20, 22, 25, 28, 30, 35, 40].forEach(tf => {
      const q = { typ: 'spaw', h, bg: b, tg: tf, bd: d.sym === false ? U.num(d.bd, b) : b, td: tf, tw, aw: Math.max(aw, Math.min(tw, 0.5 * tw)) };
      out.push({ d: q, masa: (2 * b * tf + (h - 2 * tf) * tw) * 1e-6 * U.RHO, nazwa: `I ${h}×${b}×${tw}×${tf}` });
    }));
    return out.sort((a, c) => a.masa - c.masa);
  }
  const typ = d.typ || 'walc';
  if (typ === 'walc') return P.katalog('walc', [d.seria || 'IPE']);
  if (typ === 'rura') { const L = P.katalog('rura', Object.assign([d.seria === 'wlasna' ? 'RHS' : (d.seria || 'SHS')], { wyk: d.wyk })); L.forEach(c => { c.d.wyk = d.wyk; }); return L; }
  if (typ === 'kat') { const L = P.katalog('kat', [d.seria || 'L']); L.forEach(c => { c.d.poz = d.poz; }); return L; }
  return P.katalog(typ, [d.seria]);

/* dobór węzłów i oparć przy znanych reakcjach (wynik obliczeń r) */
J.dobierzWezly = function (st0, r, eta) {
  const st = U.clone(st0), log = [];
  eta = eta || 1;
  if (!r || !r.podpory) return { st, log: ['Brak wyników – najpierw usuń błędy danych.'], ok: false };
  const sec = r.sec, mat = r.mat, ndp = r.ndp, base = r.base;
  let allOk = true;
  r.podpory.forEach((p, k) => {
    if (p.tymcz) return;
    const sp = st.podpory[p.idx === undefined ? k : p.idx] || st.podpory[k]; if (!sp) return;
    const w = sp.wezel || (sp.wezel = { typ: 'brak' });
    const R0 = p.Rmax; if (!(R0 > 0)) return;
    const okU = (o) => o.checks.every(c => c.u <= eta + 1e-9) && (!o.detal || o.detal.every(d => d.ok));
    if (['blacha_czolowa', 'blacha_zebrowa', 'katowniki', 'spawane'].includes(w.typ) && (w.typ === 'spawane' || sec.kind === 'I' || sec.kind === 'U')) {
      const F = J.jointForces(w, { Rmax: R0, Mmax: p.Mmax, Rk: p.Rk, typ: sp.typ });
      const d = W.auto(J.jointCtx(sec, mat, ndp, base), Object.assign({}, W.defaults(w.typ, sec), w), F, eta);
      if (d.ok) { Object.keys(d.w).forEach(k => { w[k] = d.w[k]; }); log.push(`Podpora ${p.id}: ${J.jointTxt(w, sec)} – wytężenie ${Math.round(d.o.u * 100)}%.`); }
      else { allOk = false; log.push(`Podpora ${p.id}: nie znaleziono wariantu „${W.TYPY[w.typ]}” spełniającego warunki – zmień rodzaj połączenia lub klasę śrub.`); }
    } else if (sec.kind !== 'L') {
      // oparcie – płyta podporowa i ewentualne żebra
      if (w.typ === 'oparcie' && w.podloze !== 'stal' && J.hasAnchors(w) && w.kotwy.auto === true) {
        if (p.auto && p.auto.ok) log.push(`Podpora ${p.id}: dobór automatyczny – ${p.auto.txt}.`); else { allOk = false; log.push(`Podpora ${p.id}: dobór automatyczny płyty i kotew nie znalazł wariantu – zwiększ podporę betonową lub zmień rodzaj kotew.`); }
      } else if (w.typ === 'oparcie' && w.podloze !== 'stal') {

<script>/* src/ui/rysunki.js */
/* =====================================================================

   reakcje, widok podłużny belki z połączeniami, szkice węzłów,

(function () {

const RODZ = () => BS.S.RODZAJE;

/* ------------------------------------------------------------ podpory (symbole) */
function supportSym(p, x, y, o) {
  o = o || {};
  const c = '#1b2230', dash = p.tymcz ? ' stroke-dasharray="3 2"' : '';

    const left = !o.right;
    s += `<line x1="${x}" y1="${y - 16}" x2="${x}" y2="${y + 16}" stroke="${c}" stroke-width="2.4"/>`;
    for (let k = -14; k <= 14; k += 6) s += `<line x1="${x}" y1="${y + k}" x2="${x + (left ? -7 : 7)}" y2="${y + k + 6}" stroke="${c}" stroke-width="0.9"/>`;
  } else {
    s += `<path d="M ${x} ${y + 2} L ${x - 9} ${y + 16} L ${x + 9} ${y + 16} Z" fill="#ffffff" stroke="${c}" stroke-width="1.3"${dash}/>`;

    else if (p.przesuwna) s += `<circle cx="${x - 5}" cy="${y + 19}" r="2.4" fill="none" stroke="${c}"/><circle cx="${x + 5}" cy="${y + 19}" r="2.4" fill="none" stroke="${c}"/><line x1="${x - 12}" y1="${y + 22.5}" x2="${x + 12}" y2="${y + 22.5}" stroke="${c}"/>`;
    else { s += `<line x1="${x - 12}" y1="${y + 17}" x2="${x + 12}" y2="${y + 17}" stroke="${c}"${dash}/>`; for (let k = 0; k < 4; k++) s += `<line x1="${x - 10 + k * 6}" y1="${y + 17}" x2="${x - 14 + k * 6}" y2="${y + 22}" stroke="${c}" stroke-width="0.8"/>`; }

/* ------------------------------------------------------------ klikany schemat statyczny */
// o: { W, etap, edit, sel:Set, diag, dims, legend:[], out:{} }
D.scheme = function (S, R, o) {

  const bands = [], pts = [];
  const swOn = (S.ciezarWlasny || {}).auto !== false;

    const inStage = st.stale ? et <= s : et === s;
    (c.sklad || []).forEach((k, ci) => {
      const col = KC[c.rodzaj] || '#6a3fb5', off = c.aktywne === false;
      if (k.typ === 'q') {
        const x0 = U.clamp(U.num(k.x0) * 1000, 0, L), x1 = (k.x1 === '' || k.x1 === null || k.x1 === undefined) ? L : U.clamp(U.num(k.x1) * 1000, 0, L);
        const q0 = U.num(k.q0), q1 = (k.q1 === '' || k.q1 === undefined || k.q1 === null) ? q0 : U.num(k.q1);
        bands.push({ li, ci, col, x0, x1, q0, q1, y: k.kier === 'y', lab: `${c.id} ${c.nazwa ? c.nazwa.slice(0, 26) : ''}: q = ${fmt(q0, 2)}${q1 !== q0 ? '…' + fmt(q1, 2) : ''} kN/m${k.kier === 'y' ? ' [Y]' : ''}`, off, inStage });
      } else pts.push({ li, ci, col, k, off, inStage, id: c.id });

  });

  const qMax = Math.max(1e-9, ...bands.map(b => Math.max(Math.abs(b.q0), Math.abs(b.q1 === null || b.q1 === undefined ? b.q0 : b.q1))));
  let yAcc = top; bands.forEach(b => { const q = Math.max(Math.abs(b.q0), Math.abs(b.q1 === null || b.q1 === undefined ? b.q0 : b.q1)); b.h = Math.round(Math.max(bh0 * 0.75, Math.min(bh0 * 1.9, bh0 * 1.9 * q / qMax))); b.yy = yAcc; yAcc += b.h + gap; });

  const hasP = pts.some(p => p.k.typ === 'P');

  let g = '';
  bands.forEach((b) => {
    const y0 = b.yy, bh = b.h, x0 = X(b.x0), x1 = X(b.x1), q1v = b.q1 === null || b.q1 === undefined ? b.q0 : b.q1, neg = b.q0 < 0 && q1v <= 0;
    const qm = Math.max(Math.abs(b.q0), Math.abs(q1v)) || 1, h0 = bh * Math.abs(b.q0) / qm, h1 = bh * Math.abs(q1v) / qm, yb = y0 + bh;
    const op = b.off ? 0.3 : b.inStage ? 1 : 0.4, dash = neg || b.y ? ' stroke-dasharray="3 2"' : '';
    let a = Math.abs(b.q0 - q1v) < 1e-9 ? `<rect x="${x0.toFixed(1)}" y="${y0}" width="${Math.max(1, x1 - x0).toFixed(1)}" height="${bh}" fill="${b.col}" fill-opacity="${neg || b.y ? 0.08 : 0.16}" stroke="${b.col}" stroke-width="0.8"${dash}/>`
      : `<polygon points="${x0.toFixed(1)},${yb} ${x0.toFixed(1)},${(yb - h0).toFixed(1)} ${x1.toFixed(1)},${(yb - h1).toFixed(1)} ${x1.toFixed(1)},${yb}" fill="${b.col}" fill-opacity="${neg || b.y ? 0.08 : 0.16}" stroke="${b.col}" stroke-width="0.8"${dash}/>`;
    const n = Math.max(2, Math.min(40, Math.round((x1 - x0) / 22)));
    for (let k = 0; k <= n; k++) {
      const x = x0 + (x1 - x0) * k / n, hh = h0 + (h1 - h0) * k / n; if (hh < 3) continue;
      if (b.y) { if (k % 2 === 0) a += `<circle cx="${x.toFixed(1)}" cy="${(yb - hh / 2).toFixed(1)}" r="2" fill="none" stroke="${b.col}" stroke-width="0.6"/>`; continue; }
      a += `<line x1="${x.toFixed(1)}" y1="${(yb - hh + 2).toFixed(1)}" x2="${x.toFixed(1)}" y2="${yb - 1}" stroke="${b.col}" stroke-width="0.6" stroke-opacity="0.7"/>`;
      a += neg ? `<path d="M${x.toFixed(1)},${(yb - hh + 1).toFixed(1)} l-2.2,3.6 h4.4 z" fill="${b.col}" fill-opacity="0.8"/>` : `<path d="M${x.toFixed(1)},${yb} l-2.2,-3.6 h4.4 z" fill="${b.col}" fill-opacity="0.8"/>`;
    }
    const cw = 9.5 * 0.53, lx = Math.max(2, Math.min(Math.max(x0 + 3, ml), W - mr - b.lab.length * cw)), maxC = Math.floor((W - 4 - lx) / cw), lab = b.lab.length > maxC ? b.lab.slice(0, Math.max(8, maxC - 1)) + '…' : b.lab;

    g += `<g class="${o.edit ? 'ld' : ''}" data-li="${b.li}" data-ci="${b.ci === undefined ? '' : b.ci}" opacity="${op}"><title>${esc(b.lab)}${o.edit ? ' – kliknij, aby zmienić' : ''}</title><rect x="${x0}" y="${y0}" width="${Math.max(4, x1 - x0)}" height="${bh}" fill="#ffffff" fill-opacity="0"/>${a}</g>`;

  pts.forEach(p => {
    const x = X(U.clamp(U.num(p.k.x) * 1000, 0, L)), op = p.off ? 0.25 : p.inStage ? 1 : 0.4;

      g += `<g class="${o.edit ? 'ld' : ''}" data-li="${p.li}" data-ci="${p.ci}" opacity="${op}"><rect x="${x - 8}" y="${yBeam - 38}" width="16" height="34" fill="#ffffff" fill-opacity="0"/>${up ? arrowD(x, yBeam - 3, yBeam - 34, p.col, 6, 1.7) : arrowD(x, yBeam - 36, yBeam - 3, p.col, 6, 1.7)}${tx(x + 5, yBeam - 27, `${esc(p.id)}: ${fmt(Math.abs(P), 1)} kN${p.k.kier === 'y' ? ' [Y]' : ''}`, { a: 'start', fs: 9.5, c: p.col, w: 600 })}</g>`;

  });

  });

  (R.zebra || []).forEach(z => { const x = X(z.x); g += `<g class="${o.edit ? 'stf' : ''}" data-stf="${z.src}"${o.edit ? ' style="cursor:pointer"' : ''}><title>Żebro środnika x = ${fmt(z.x / 1000, 2)} m (${z.strona === 'jedna' ? 'jednostronne' : 'obustronne'} ${fmt(z.bs, 0)}×${fmt(z.ts, 0)} mm${z.c > 0 ? `, wcięcia 45° c = ${fmt(z.c, 0)} mm` : ''})</title><rect x="${x - 4}" y="${yBeam - 10}" width="8" height="20" fill="#ffffff" fill-opacity="0"/><line x1="${x}" y1="${yBeam - 7}" x2="${x}" y2="${yBeam + 7}" stroke="#b5651d" stroke-width="2"/></g>`; });

/* wykres pod schematem: M, V, ugięcie, N, R */
D.diagBand = function (kind, S, R, s, X, y0, W) {

  if (kind === 'R') {
    md.systems[s].forEach(p => { const r = ev.R[p.id] || {}; const x = X(p.x); const v = r.max || 0; g += arrowD(x, y0 + 50, y0 + 14, '#c0262d', 6, 1.8) + tx(x, y0 + 64, `${p.id}: ${fmt(v / 1000, 1)} kN`, { fs: 10, c: '#c0262d', w: 600 }) + (r.min < -1 ? tx(x, y0 + 8, `min ${fmt(r.min / 1000, 1)}`, { fs: 9, c: '#a35d00' }) : ''); });

/* ------------------------------------------------------------ szczegół żebra: przekrój z żebrami + szczegół A wcięcia narożnego 45° */
// o: { bs, ts, c, strona ('obie' | 'jedna'), a (spoina pas–środnik – blachownice), tytul, stack (szczegół pod przekrojem – wąskie okna) }
let stfSeq = 0;

  const sb = (t) => `<tspan font-size="8" dy="2">${t}</tspan><tspan dy="-2"></tspan>`;
  const notes = (c > 0
    ? [[`wcięcie 45° c × c = ${fmt(c, 0)} × ${fmt(c, 0)} mm (oba naroża przy pasach)`], ['odpływ cynku i odpowietrzenie przy cynkowaniu', 1], ['zanurzeniowym (PN-EN ISO 14713-2)', 1], [rr > 0 ? `omija promień wyokrąglenia r = ${fmt(rr, 0)} mm` : zl > 0 ? `omija spoinę pas–środnik (√2·a = ${fmt(zl, 1)} mm)` : ''], [`spoina żebro–środnik l = h${sb('w')} − 2c = ${fmt(z1 - z0 - 2 * c, 0)} mm`], [`docisk do pasa na szerokości b${sb('s')} − c = ${fmt(bs - c, 0)} mm`]]
