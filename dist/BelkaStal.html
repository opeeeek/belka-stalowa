<script>/* src/engine/statecznosc.js */
/* =====================================================================
   BelkaStal – stateczność elementu (PN-EN 1993-1-1, 6.3)
   • Mcr – sprężysty moment krytyczny z analizy MES całej belki w danym
     etapie (rzeczywisty rozkład My, wysokość przyłożenia obciążeń,
     monosymetria βz, podpory widełkowe/utwierdzenia, stężenia dyskretne
     i ciągłe na wysokości pasa).  αcr dotyczy całej belki – w każdym
     segmencie Mcr,seg = αcr·|MEd,max,seg| (podejście bezpieczne).
   • χLT – 6.3.2.2 (ogólna) lub 6.3.2.3 (walcowane i spawane równoważne)
     z modyfikacją f (kc wg tabl. 6.6 dla rozkładu liniowego, w pozostałych
     przypadkach kc = 1/√C1, C1 z MES segmentu na podporach widełkowych).
   • 6.3.1 – wyboczenie giętne/skrętne, 6.3.3 – interakcja (zał. B).
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U, F = BS.FE, S = BS.S;
const T = BS.T = {};
const ALPHA = { a0: 0.13, a: 0.21, b: 0.34, c: 0.49, d: 0.76 };
T.ALPHA = ALPHA;

T.chi = (lam, al) => { if (lam <= 0.2) return 1; const ph = 0.5 * (1 + al * (lam - 0.2) + lam * lam); return Math.min(1, 1 / (ph + Math.sqrt(ph * ph - lam * lam))); };

// krzywe wyboczenia giętnego – tabl. 6.2
T.curveFlex = function (sec, fy) {
  const hb = sec.h / Math.max(sec.bg, sec.bd), tf = Math.max(sec.tg, sec.td);
  if (sec.typ === 'walc') {
    if (fy >= 460) { if (hb > 1.2) return tf <= 40 ? { y: 'a0', z: 'a0' } : { y: 'a', z: 'a' }; return tf <= 100 ? { y: 'a', z: 'a' } : { y: 'c', z: 'c' }; }
    if (hb > 1.2) return tf <= 40 ? { y: 'a', z: 'b' } : { y: 'b', z: 'c' };
    return tf <= 100 ? { y: 'b', z: 'c' } : { y: 'd', z: 'd' };
  }
  return tf <= 40 ? { y: 'b', z: 'c' } : { y: 'c', z: 'd' };
};
// krzywe zwichrzenia – tabl. 6.4 (ogólna) i 6.5 (6.3.2.3)
T.curveLT = function (sec, met) {
  const hb = sec.h / Math.min(sec.bg, sec.bd);
  if (met === '6.3.2.3') return sec.typ === 'walc' ? (hb <= 2 ? 'b' : 'c') : (hb <= 2 ? 'c' : 'd');
  return sec.typ === 'walc' ? (hb <= 2 ? 'a' : 'b') : (hb <= 2 ? 'c' : 'd');
};

T.chiLT = function (lam, MEd, Mcr, sec, ndp, kc, met) {
  const curve = T.curveLT(sec, met), al = ALPHA[curve];
  const o = { met, curve, alLT: al, lam, kc };
  if (met === '6.3.2.3') {
    const l0 = +ndp.lamLT0, be = +ndp.betaLT;
    o.lam0 = l0; o.beta = be;
    if (lam <= l0 || Math.abs(MEd) / Mcr <= l0 * l0) { o.skip = true; o.chi = 1; o.f = 1; o.chimod = 1; return o; }
    const ph = 0.5 * (1 + al * (lam - l0) + be * lam * lam);
    o.phi = ph;
    o.chi = Math.min(1, 1 / lam / lam, 1 / (ph + Math.sqrt(ph * ph - be * lam * lam)));
    o.f = Math.min(1, 1 - 0.5 * (1 - kc) * (1 - 2 * Math.pow(lam - 0.8, 2)));
    o.chimod = Math.min(1, 1 / lam / lam, o.chi / o.f);
  } else {
    o.lam0 = 0.2; o.beta = 1;
    if (lam <= 0.2 || Math.abs(MEd) / Mcr <= 0.04) { o.skip = true; o.chi = 1; o.f = 1; o.chimod = 1; return o; }
    const ph = 0.5 * (1 + al * (lam - 0.2) + lam * lam);
    o.phi = ph; o.chi = Math.min(1, 1 / (ph + Math.sqrt(ph * ph - lam * lam))); o.f = 1; o.chimod = o.chi;
  }
  return o;
};

/* opis obciążeń kombinacji dla zwichrzenia: rozłożone (na elementach siatki) i skupione z wysokością względem ŚŚ */
T.heightOf = (sec, wys) => (wys === 'pas_g' ? sec.h - sec.zs : wys === 'pas_d' ? -sec.zs : 0);
T.restrZ = (sec, wys) => (wys === 'pas_g' ? sec.h - sec.tg / 2 - sec.zs : wys === 'pas_d' ? sec.td / 2 - sec.zs : 0);

T.loadsForCombo = function (md, an, sec, combo) {
  const dist = [], pts = [];
  const R = an.res[combo.etap];
  combo.terms.forEach(t => {
    const r = R[t.id]; if (!r) return;
    r.c.parts.forEach(p => {
      if (p.kier !== 'z') return;
      const e = T.heightOf(sec, p.wys);
      const segs = t.seg ? t.seg.map(i => md.seg[i]) : [{ x0: 0, x1: md.L }];
      segs.forEach(sg => {
        if (p.typ === 'q') {
          const a = Math.max(p.x0, sg.x0), b = Math.min(p.x1, sg.x1); if (b - a < 1e-6) return;
          const qa = p.q0 + (p.q1 - p.q0) * (a - p.x0) / (p.x1 - p.x0), qb = p.q0 + (p.q1 - p.q0) * (b - p.x0) / (p.x1 - p.x0);
          dist.push({ x0: a, x1: b, w0: t.f * qa, w1: t.f * qb, e });
        } else if (p.typ === 'P') {
          if (t.seg && md.segOf(p.x) !== md.seg.indexOf(sg)) return;
          pts.push({ x: p.x, P: t.f * p.P, e });
        }
      });
    });
  });
  return { dist, pts };
};

T.bcStage = function (md, sec, s, xs) {
  const bc = [], springs = [];
  md.systems[s].forEach(p => bc.push({ x: p.x, u: true, phi: true, du: p.ltb === 'pelne', dphi: p.ltb === 'pelne' }));
  md.stez.filter(z => z.od <= s).forEach(z => {
    if (z.typ === 'pelne') bc.push({ x: z.x, u: true, phi: true });
    else if (z.typ === 'skretne') springs.push({ x: z.x, kt: 'rigid' });
    else springs.push({ x: z.x, k: 'rigid', zr: T.restrZ(sec, z.wys) });
  });
  const c = md.ciagle || {};
  if (c.pasG && U.num(c.odEtapu, 0) <= s) xs.forEach(x => springs.push({ x, k: 'rigid', zr: T.restrZ(sec, 'pas_g') }));
  if (c.pasD && U.num(c.odEtapuD, 0) <= s) xs.forEach(x => springs.push({ x, k: 'rigid', zr: T.restrZ(sec, 'pas_d') }));
  return { bc, springs };
};

// segmenty zwichrzeniowe: między podporami i stężeniami dyskretnymi aktywnymi w etapie s
T.segments = function (md, s) {
  const pts = new Set([0, md.L]);
  md.systems[s].forEach(p => pts.add(p.x));
  md.stez.filter(z => z.od <= s).forEach(z => pts.add(z.x));
  const xs = Array.from(pts).sort((a, b) => a - b);
  const out = [];
  for (let i = 1; i < xs.length; i++) if (xs[i] - xs[i - 1] > 1) out.push({ x0: xs[i - 1], x1: xs[i] });
  // wolny koniec wspornika
  out.forEach(sg => { sg.free = (sg.x0 === 0 && md.wL > 0) || (sg.x1 === md.L && md.wP > 0); });
  return out;
};

T.mcrRun = function (md, an, sec, E, G, combo, Marr) {
  const xs = md.xl, ne = xs.length - 1;
  const ld = T.loadsForCombo(md, an, sec, combo);
  const Mfun = (e) => [S.at(an.xs, Marr, xs[e]), S.at(an.xs, Marr, (xs[e] + xs[e + 1]) / 2), S.at(an.xs, Marr, xs[e + 1])];
  const qcache = [];
  for (let e = 0; e < ne; e++) {
    const xa = xs[e], xb = xs[e + 1], xm = (xa + xb) / 2, arr = [];
    ld.dist.forEach(d => { if (xm > d.x0 && xm < d.x1) { const L = d.x1 - d.x0; arr.push({ w0: d.w0 + (d.w1 - d.w0) * (xa - d.x0) / L, w1: d.w0 + (d.w1 - d.w0) * (xb - d.x0) / L, e: d.e }); } });
    qcache.push(arr);
  }
  const { bc, springs } = T.bcStage(md, sec, combo.etap, xs);
  return F.ltb({ xs, EIz: E * sec.Iz, EIw: E * sec.Iw, GIt: G * sec.It, betaZ: sec.betaZ, Mfun, qe: (e) => qcache[e], pts: ld.pts, bc, springs });
};

// C1 segmentu (podpory widełkowe, obciążenie w środku ścinania)
T.C1seg = function (sec, E, G, sg, Marr, xsS) {
  const Ls = sg.x1 - sg.x0, xs = F.mesh([sg.x0, sg.x1], sg.x1, Ls / 24).filter(x => x >= sg.x0 - 1e-6);
  const Mfun = (e) => [S.at(xsS, Marr, xs[e]), S.at(xsS, Marr, (xs[e] + xs[e + 1]) / 2), S.at(xsS, Marr, xs[e + 1])];
  const bc = [{ x: sg.x0, u: true, phi: true }, { x: sg.x1, u: true, phi: true }];
  const r = F.ltb({ xs, EIz: E * sec.Iz, EIw: E * sec.Iw, GIt: G * sec.It, betaZ: 0, Mfun, bc });
  let Mm = 0; xs.forEach(x => { Mm = Math.max(Mm, Math.abs(S.at(xsS, Marr, x))); });
  const Mcr0 = Math.PI / Ls * Math.sqrt(E * sec.Iz * G * sec.It * (1 + Math.PI * Math.PI * E * sec.Iw / (Ls * Ls * G * sec.It)));
  return Math.max(1, r.lam * Mm / Mcr0);
};

// analiza rozkładu w segmencie: liniowy? ψ, Mh, Ms
T.shape = function (xsS, Marr, sg) {
  const ma = S.at(xsS, Marr, sg.x0 + 1e-6), mb = S.at(xsS, Marr, sg.x1 - 1e-6);
  let dev = 0, mmax = 0, xmax = sg.x0, mabs = 0;
  for (let i = 0; i < xsS.length; i++) {
    const x = xsS[i]; if (x < sg.x0 - 1e-6 || x > sg.x1 + 1e-6) continue;
    const lin = ma + (mb - ma) * (x - sg.x0) / (sg.x1 - sg.x0);
    dev = Math.max(dev, Math.abs(Marr[i] - lin));
    if (Math.abs(Marr[i]) > mabs) { mabs = Math.abs(Marr[i]); mmax = Marr[i]; xmax = x; }
  }
  const linear = dev <= 0.01 * Math.max(mabs, 1);
  const Mh = Math.abs(ma) >= Math.abs(mb) ? ma : mb, Mo = Math.abs(ma) >= Math.abs(mb) ? mb : ma;
  const psi = Math.abs(Mh) > 1e-9 ? Mo / Mh : 1;
  // moment w przęśle (ekstremum wewnętrzne)
  let Ms = (ma + mb) / 2;
  if (!linear) { Ms = mmax; }
  return { ma, mb, linear, psi, Mh, Ms, Mmax: mmax, xmax, mabs };
};

// Cm wg tabl. B.3 (obciążenie równomierne/skupione – wariant „równomierne”, bezpieczny dla typowych belek)
T.Cm = function (sh, conc) {
  const psi = sh.psi;
  if (sh.linear) return Math.max(0.4, 0.6 + 0.4 * psi);
  const Mh = sh.Mh, Ms = sh.Ms;
  if (Math.abs(Ms) < Math.abs(Mh)) {
    const as = Ms / Mh;
    if (as >= 0) return Math.max(0.4, 0.2 + 0.8 * as);
    if (psi >= 0) return Math.max(0.4, conc ? -0.8 * as : 0.1 - 0.8 * as);
    return Math.max(0.4, conc ? 0.2 * (-psi) - 0.8 * as : 0.1 * (1 - psi) - 0.8 * as);
  }
  const ah = Math.abs(Ms) > 1e-9 ? Mh / Ms : 0;
  if (ah >= 0 || psi >= 0) return conc ? 0.90 + 0.10 * ah : 0.95 + 0.05 * ah;
  return conc ? 0.90 + 0.10 * ah * (1 + 2 * psi) : 0.95 + 0.05 * ah * (1 + 2 * psi);
};

/* ---------------------------------------------------------- etap: zwichrzenie + interakcja */
// cand: [{ combo, E: wynik kombinacji }]
T.stage = function (md, an, sec, base, ndp, s, cand, opt) {
  const E = U.E, G = U.G, fy = base.fy;
  const met = sec.sym ? (ndp.ltbMet || '6.3.2.3') : '6.3.2.2';
  const segs = T.segments(md, s);
  const runs = [];
  cand.forEach(cd => {
    let r;
    try { r = T.mcrRun(md, an, sec, E, G, cd.combo, cd.E.M); } catch (e) { r = { lam: NaN, err: String(e.message || e) }; }
    runs.push({ combo: cd.combo, E: cd.E, lam: r.lam, mode: r.mode, err: r.err });
  });
  const segOut = segs.map(sg => {
    let best = null;
    runs.forEach(rn => {
      if (rn.err || !isFinite(rn.lam) && rn.lam !== Infinity) return;
      const sh = T.shape(an.xs, rn.E.M, sg);
      if (sh.mabs < 1) return;
      const Mpos = sh.Mmax >= 0;
      const Wy = Mpos ? base.Wy_pos : base.Wy_neg, cls = (Mpos ? base.kPos : base.kNeg).cls;
      const Mcr = rn.lam === Infinity ? Infinity : rn.lam * sh.mabs;
      const lam = Mcr === Infinity ? 0 : Math.sqrt(Wy * fy / Mcr);
      const o = T.chiLT(lam, sh.mabs, Mcr, sec, ndp, 1, met);
      const Mb = o.chimod * Wy * fy / ndp.gM1;
      const u = sh.mabs / Mb;
      const c = { sg, combo: rn.combo, E: rn.E, alphaCr: rn.lam, Mcr, lam, Wy, cls, Mpos, sh, ltb: o, Mb, u };
      if (!best || u > best.u) best = c;
    });
    if (!best) return { sg, brak: true };
    // kc – dla segmentu rozstrzygającego
    if (met === '6.3.2.3' && !best.ltb.skip) {
      let kc = 1, kcSrc = 'kc = 1 (wspornik – bezpiecznie)', C1 = null;
      if (!sg.free) {
        if (ndp.kcMet === '1') { kc = 1; kcSrc = 'kc = 1 (przyjęto bezpiecznie, f = 1)'; }
        else if (best.sh.linear) { kc = Math.min(1, 1 / (1.33 - 0.33 * best.sh.psi)); kcSrc = `tabl. 6.6: kc = 1/(1,33 − 0,33ψ), ψ = ${U.fmt(best.sh.psi, 3)}`; }
        else { try { C1 = T.C1seg(sec, E, G, sg, best.E.M, an.xs); kc = U.clamp(1 / Math.sqrt(C1), 0.6, 1); kcSrc = `kc = 1/√C1 ≥ 0,6 (zakres tabl. 6.6), C1 = ${U.fmt(C1, 3)} (MES segmentu)`; } catch (e) { kc = 1; kcSrc = 'kc = 1 (C1 nie wyznaczono)'; } }
      }
      const o = T.chiLT(best.lam, best.sh.mabs, best.Mcr, sec, ndp, kc, met);
      best.ltb = o; best.ltb.kcSrc = kcSrc; best.ltb.C1 = C1;
      best.Mb = o.chimod * best.Wy * fy / ndp.gM1; best.u = best.sh.mabs / best.Mb;
    }
    return best;
  });
  // ---- interakcja N + My (+ Mz) – 6.3.1, 6.3.3
  const inter = [];
  const fl = T.curveFlex(sec, fy);
  segOut.forEach(sb => {
    if (sb.brak) return;
    runs.forEach(rn => {
      if (rn.err) return;
      const Nc = -(rn.E.N || 0); // ściskanie +
      let Mz = 0; for (let i = 0; i < an.xs.length; i++) if (an.xs[i] >= sb.sg.x0 - 1e-6 && an.xs[i] <= sb.sg.x1 + 1e-6) Mz = Math.max(Mz, Math.abs(rn.E.Mz[i]));
      if (Nc <= 1e-3 * base.Npl && Mz < 1e3) return;
      const sh = T.shape(an.xs, rn.E.M, sb.sg);
      const Mpos = sh.Mmax >= 0, Wy = Mpos ? base.Wy_pos : base.Wy_neg, cls = (Mpos ? base.kPos : base.kNeg).cls;
      const Mcr = rn.lam === Infinity ? Infinity : rn.lam * Math.max(sh.mabs, 1);
      const lamLT = Mcr === Infinity ? 0 : Math.sqrt(Wy * fy / Mcr);
      const ltb = sh.mabs > 1 ? T.chiLT(lamLT, sh.mabs, Mcr, sec, ndp, sb.ltb.kc || 1, met) : { chimod: 1, skip: true };
      const NRk = base.Aeff * fy;
      // długości wyboczeniowe: y – przęsło (między podporami głównymi) × μy; z – segment × μz
      const sp = md.seg.find(g => sb.sg.x0 >= g.x0 - 1 && sb.sg.x1 <= g.x1 + 1) || { x0: sb.sg.x0, x1: sb.sg.x1 };
      const Lcy = (U.num(opt.muY, 1) || 1) * (sp.x1 - sp.x0) * (sp.wsp ? 2 : 1), Lcz = (U.num(opt.muZ, 1) || 1) * (sb.sg.x1 - sb.sg.x0);
      const lam1 = 93.9 * base.eps;
      const ly = Lcy / sec.iy / lam1 * Math.sqrt(base.Aeff / sec.A), lz = Lcz / sec.iz / lam1 * Math.sqrt(base.Aeff / sec.A);
      const chiy = T.chi(ly, ALPHA[fl.y]), chiz = T.chi(lz, ALPHA[fl.z]);
      // skrętne
      const i0s = sec.iy * sec.iy + sec.iz * sec.iz + sec.z0 * sec.z0;
      const NcrT = (G * sec.It + Math.PI * Math.PI * E * sec.Iw / (Lcz * Lcz)) / i0s;
      const lT = Math.sqrt(NRk / NcrT), chiT = T.chi(lT, ALPHA[fl.z]);
      const MyRk = Wy * fy, MzRk = base.Wz * fy;
      const My = sh.mabs;
      const Cmy = T.Cm(T.shape(an.xs, rn.E.M, sp)), CmLT = Math.max(0.4, T.Cm(sh));
      const shz = T.shape(an.xs, rn.E.Mz, sb.sg), Cmz = shz.mabs > 1 ? T.Cm(shz) : 1;
      const g1 = ndp.gM1;
      const ny = Math.max(0, Nc) / (chiy * NRk / g1), nz = Math.max(0, Nc) / (Math.min(chiz, chiT) * NRk / g1);
      let kyy, kyz, kzy, kzz;
      if (cls <= 2) {
        kyy = Math.min(Cmy * (1 + (ly - 0.2) * ny), Cmy * (1 + 0.8 * ny));
        kzz = Math.min(Cmz * (1 + (2 * lz - 0.6) * nz), Cmz * (1 + 1.4 * nz));
        kyz = 0.6 * kzz;
        kzy = lz < 0.4 ? Math.min(0.6 + lz, 1 - 0.1 * lz * nz / (CmLT - 0.25)) : Math.max(1 - 0.1 * lz * nz / (CmLT - 0.25), 1 - 0.1 * nz / (CmLT - 0.25));
      } else {
        kyy = Math.min(Cmy * (1 + 0.6 * ly * ny), Cmy * (1 + 0.6 * ny));
        kzz = Math.min(Cmz * (1 + 0.6 * lz * nz), Cmz * (1 + 0.6 * nz));
        kyz = kzz;
        kzy = Math.max(1 - 0.05 * lz * nz / (CmLT - 0.25), 1 - 0.05 * nz / (CmLT - 0.25));
      }
      const dMy = Math.abs(Nc * (base.effN ? base.effN.eN : 0));
      const t1 = Math.max(0, Nc) / (chiy * NRk / g1), t2 = (My + dMy) / (ltb.chimod * MyRk / g1), t3 = Mz / (MzRk / g1);
      const u61 = t1 + kyy * t2 + kyz * t3;
      const u62 = Math.max(0, Nc) / (Math.min(chiz, chiT) * NRk / g1) + kzy * t2 + kzz * t3;
      const r = { sg: sb.sg, combo: rn.combo, Nc, My, Mz, Lcy, Lcz, ly, lz, lT, chiy, chiz, chiT, NcrT, curves: fl, Cmy, Cmz, CmLT, kyy, kyz, kzy, kzz, ny, nz, chiLT: ltb.chimod, MyRk, MzRk, NRk, u61, u62, u: Math.max(u61, u62), cls, lamLT };
      const prev = inter.find(q => q.sg === sb.sg);
      if (!prev) inter.push(r); else if (r.u > prev.u) inter[inter.indexOf(prev)] = r;
    });
  });
  return { met, segs: segOut, runs, inter };
};

})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* src/engine/polaczenia.js */
/* =====================================================================
   BelkaStal – podpory i połączenia przegubowe
   • oparcie belki: docisk środnika (PN-EN 1993-1-5, 6), żebro podporowe
     (9.4), płyta podporowa na betonie (PN-EN 1993-1-8, 6.2.5;
     PN-EN 1992-1-1, 6.7) lub na murze (PN-EN 1996-1-1, 6.1.3 – fd i β
     podaje projektant);
   • krótka blacha czołowa (połączenie przegubowe) i blacha żebrowa
     (nakładka jednostronna) – PN-EN 1993-1-8: tabl. 3.3, 3.4, 3.10.2, 4.5.3.3.
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U, M = BS.M;
const C = BS.C = {};
const s3 = Math.sqrt(3);

/* ---------------------------------------------------------- śruby (tabl. 3.4) */
C.boltShear = function (d, cls, gM2, gwintWPl) {
  const b = M.SRUBY[d], k = M.SRUBY_KL[cls];
  const A = gwintWPl === false ? b.A : b.As;
  const av = gwintWPl === false ? 0.6 : k.av;
  return { Fv: av * k.fub * A / gM2, av, A, fub: k.fub, d0: b.d0, d: b.d };
};
// docisk: e1, p1 – w kierunku obciążenia; e2, p2 – prostopadle (Infinity – brak krawędzi/rzędu)
C.bearing = function (d, cls, t, fu, gM2, g) {
  const b = M.SRUBY[d], k = M.SRUBY_KL[cls], d0 = b.d0;
  const end = g.koniec !== false;
  const ad = end ? g.e1 / (3 * d0) : g.p1 / (3 * d0) - 0.25;
  const ab = Math.min(ad, k.fub / fu, 1);
  const edge = g.e2 !== Infinity && g.e2 !== undefined;
  const k1 = edge ? Math.min(2.8 * g.e2 / d0 - 1.7, (g.p2 && g.p2 !== Infinity ? 1.4 * g.p2 / d0 - 1.7 : 2.5), 2.5) : Math.min(g.p2 && g.p2 !== Infinity ? 1.4 * g.p2 / d0 - 1.7 : 2.5, 2.5);

  md.cases.forEach(c => c.parts.forEach(p => { if (p.typ === 'P' && p.kier === 'z' && !md.systems[c.etap].some(q => Math.abs(q.x - p.x) < 1)) ptLoads.push({ x: p.x, ss: p.ss, case: c.id, etap: c.etap, P: p.P, wys: p.wys }); }));
  const ptRes = {};
  const KEYS = md.etapy.map((e, s) => ({ M: s + '|M', V: s + '|V', Vy: s + '|Vy', N: s + '|N', Vb: s + '|Vb', MV: s + '|MV71' }));
  combos.forEach((c, ci) => {
    const E = K.evaluate(an, c);
    const ev = env[c.etap];
    if (c.typ === 'char') {
      ev.nChar++;
      for (let i = 0; i < ns; i++) { if (E.w[i] > ev.wmax[i]) ev.wmax[i] = E.w[i]; if (E.w[i] < ev.wmin[i]) ev.wmin[i] = E.w[i]; }

    }

    ev.nSGN++;
    let mp = 0, mn = 0;
    for (let i = 0; i < ns; i++) {
      const m = E.M[i];
      if (m > ev.Mmax[i]) ev.Mmax[i] = m; if (m < ev.Mmin[i]) ev.Mmin[i] = m;
      if (E.V[i] > ev.Vmax[i]) ev.Vmax[i] = E.V[i]; if (E.V[i] < ev.Vmin[i]) ev.Vmin[i] = E.V[i];
      if (E.Mz[i] > ev.Mzmax[i]) ev.Mzmax[i] = E.Mz[i]; if (E.Mz[i] < ev.Mzmin[i]) ev.Mzmin[i] = E.Mz[i];
      if (m > mp) mp = m; if (m < mn) mn = m;

    Object.keys(E.R).forEach(id => { const r = ev.R[id] || (ev.R[id] = { max: -Infinity, min: Infinity, cmax: null, Mmax: 0, Mmin: 0, Rymax: 0 }); const v = E.R[id].R; if (v > r.max) { r.max = v; r.cmax = ci; } if (v < r.min) { r.min = v; r.cmin = ci; } r.Mmax = Math.max(r.Mmax, Math.abs(E.R[id].M)); r.Rymax = Math.max(r.Rymax, Math.abs(E.R[id].Ry || 0)); });
    const Nc = -E.N;
    const ctx = R.ctx(sec, base, ndp, Nc, mp, mn);
    for (let i = 0; i < ns; i++) {

      if (p.u > ev.uSec[i]) ev.uSec[i] = p.u;
      const kp = KEYS[c.etap];
      if (better(kp.M, p.uMN)) rec(kp.M, { util: p.uMN, M: E.M[i], N: E.N, Mz: E.Mz[i], V: E.V[i], p, x: xs[i], combo: c, etap: c.etap });
      if (better(kp.V, p.uV)) rec(kp.V, { util: p.uV, V: E.V[i], M: E.M[i], p, x: xs[i], combo: c, etap: c.etap });
      if (E.Vy[i] !== 0 && better(kp.Vy, p.uVy)) rec(kp.Vy, { util: p.uVy, V: E.Vy[i], p, x: xs[i], combo: c, etap: c.etap });
      if (Math.abs(E.N) > 1 && better(kp.N, p.uN)) rec(kp.N, { util: p.uN, N: E.N, p, x: xs[i], combo: c, etap: c.etap });
      if (sb.need) {
        const ub = Math.abs(E.V[i]) / sb.Vb;
        if (better(kp.Vb, ub)) rec(kp.Vb, { util: ub, V: E.V[i], x: xs[i], combo: c, etap: c.etap });
        const im = R.interMV(base, sb, E.M[i], E.V[i]);
        if (better(kp.MV, im.u)) rec(kp.MV, { util: im.u, im, M: E.M[i], V: E.V[i], x: xs[i], combo: c, etap: c.etap });
      }
    }
    // kandydaci do zwichrzenia: max |M| w segmentach
    const cand = ltbCand[c.etap];
    segsByStage[c.etap].forEach((sg, k) => {
      let a = 0, b = 0;
      for (let i = 0; i < ns; i++) if (xs[i] >= sg.x0 - 1e-6 && xs[i] <= sg.x1 + 1e-6) { if (E.M[i] > a) a = E.M[i]; if (E.M[i] < b) b = E.M[i]; }
      [['p' + k, a], ['n' + k, -b]].forEach(([key, v]) => { if (v > 1 && (!cand[key] || v > cand[key].v)) cand[key] = { v, ci }; });
      if (Math.abs(E.N) > 1 || ctx.Nc > 0) { const key = 'N' + k; const v = Math.max(0, Nc); if (v > 0 && (!cand[key] || v > cand[key].v)) cand[key] = { v, ci }; }
    });
    // siły skupione (docisk środnika)
    ptLoads.forEach((pl, k) => {
      if (pl.etap !== c.etap) return;

      if (!ptRes[k] || Fz > ptRes[k].F) ptRes[k] = { F: Fz, M: S.at(xs, E.M, pl.x), combo: c };
    });
  });
  out.env = env;
  // --- rejestr sprawdzeń przekroju

  const fmtCombo = (c) => (c ? c.opis : '');
  for (let s = 0; s < md.nE; s++) {

    if (m) out.checks.push(BS.check({ id: `${s}-M`, grp: g, etap: s, n: m.p.f === '6.41' ? 'Zginanie dwukierunkowe z siłą osiową' : Math.abs(m.N) > 1 ? 'Zginanie z siłą osiową (M + N)' : 'Zginanie (przekrój kl. ' + m.p.cls + ')', ref: m.p.f === '6.12' ? '6.2.5' : '6.2.9 (' + m.p.f + ')', Ed: Math.abs(m.M), Rd: m.p.MN || m.p.McRd, unit: 'M', util: m.util, x: m.x, combo: fmtCombo(m.combo), d: m }));

    if (sb.need) {
      const b = reg[`${s}|Vb`]; if (b) out.checks.push(BS.check({ id: `${s}-Vb`, grp: `PN-EN 1993-1-5 – środnik${stName(s)}`, etap: s, n: 'Wyboczenie przy ścinaniu', ref: 'PN-EN 1993-1-5, 5.2', Ed: Math.abs(b.V), Rd: sb.Vb, unit: 'F', util: b.util, x: b.x, combo: fmtCombo(b.combo), d: b }));
      const i7 = reg[`${s}|MV71`]; if (i7) out.checks.push(BS.check({ id: `${s}-MV`, grp: `PN-EN 1993-1-5 – środnik${stName(s)}`, etap: s, n: 'Interakcja M–V (wyboczenie przy ścinaniu)', ref: 'PN-EN 1993-1-5, 7.1', Ed: i7.util, Rd: 1, unit: '-', util: i7.util, x: i7.x, combo: fmtCombo(i7.combo), d: i7 }));

  // --- siły skupione na środnik (poza podporami)
  ptLoads.forEach((pl, k) => {
    const r = ptRes[k]; if (!r || r.F <= 0) return;
    const pr = R.patch(sec, base, ndp, { F: r.F, ss: pl.ss, typ: 'a', pas: pl.wys === 'pas_d' ? 'd' : 'g', a: U.num(st.analiza.zebraRozstaw) * 1000 });
    const e1 = Math.abs(r.M) / (Math.min(sec.Wel_t, sec.Wel_b) * base.fy / ndp.gM0);
    out.checks.push(BS.check({ id: `pt${k}`, grp: `PN-EN 1993-1-5 – środnik${stName(pl.etap)}`, etap: pl.etap, n: `Siła skupiona na środnik (x = ${U.fmt(pl.x / 1000, 2)} m)`, ref: 'PN-EN 1993-1-5, 6.2', Ed: r.F, Rd: pr.FRd, unit: 'F', util: pr.u, x: pl.x, combo: fmtCombo(r.combo), d: pr }));
    out.checks.push(BS.check({ id: `pt${k}i`, grp: `PN-EN 1993-1-5 – środnik${stName(pl.etap)}`, etap: pl.etap, n: `Interakcja F–M (x = ${U.fmt(pl.x / 1000, 2)} m)`, ref: 'PN-EN 1993-1-5, 7.2', Ed: pr.u + 0.8 * e1, Rd: 1.4, unit: '-', util: (pr.u + 0.8 * e1) / 1.4, x: pl.x, combo: fmtCombo(r.combo), d: { eta1: e1, eta2: pr.u } }));
  });
  // --- zwichrzenie i interakcja (każdy etap)
  out.ltb = [];
  for (let s = 0; s < md.nE; s++) {
    const cl = Object.values(ltbCand[s]).sort((a, b) => b.v - a.v);
    const uniq = []; cl.forEach(c => { if (!uniq.includes(c.ci)) uniq.push(c.ci); });
    const cand = uniq.slice(0, opt.fast ? 3 : 6).map(ci => ({ combo: combos[ci], E: K.evaluate(an, combos[ci]) }));
    if (!cand.length) { out.ltb.push(null); continue; }
    const r = T.stage(md, an, sec, base, ndp, s, cand, st.analiza);
    out.ltb.push(r);
    r.runs.forEach(rn => { if (rn.err) err(`Zwichrzenie (etap ${s + 1}): ${rn.err}`); });
    r.segs.forEach((sg, k) => {

    });
  }

  out.sgu = J.sgu(st, md, an, combos, sec, base, ndp);
  out.sgu.checks.forEach(c => out.checks.push(c));

  out.podpory = J.supports(st, md, an, combos, sec, base, mat, ndp, env, out);
  // --- pożar
  if (st.pozar.aktywny) {
    try { out.pozar = J.fire(st, md, an, combos, sec, base, ndp); out.pozar.checks.forEach(c => out.checks.push(c)); } catch (e) { err('Pożar: ' + e.message); }

    pozar: st.pozar.aktywny && out.pozar ? (out.pozar.prot ? `${st.pozar.ochrona === 'plyty' ? 'obudowa płytowa' : 'powłoka/natrysk'}: λp = ${st.pozar.lp} W/(m·K), dp = ${st.pozar.dp} mm (produkt z oceną właściwości użytkowych dla Ap/V = ${U.fmt(out.pozar.sf.ApV, 0)} m⁻¹, θcr = ${U.fmt(out.pozar.thcr, 0)} °C, R${st.pozar.R})` : `bez zabezpieczenia: θcr = ${U.fmt(out.pozar.thcr, 0)} °C`) : null,
    podniesienie: out.sgu && out.sgu.wcMax > 0.5 ? `strzałka podniesienia wykonawczego wc = ${U.fmt(out.sgu.wcMax, 0)} mm (kształt wg ugięcia od G)` : null,
    etapy: md.nE > 1 ? md.etapy.map((e, i) => `etap ${i + 1}: ${e.nazwa}`).join('; ') + (md.tmp.length ? `; podpory montażowe: ${md.tmp.map(t => `${t.id} (x = ${U.fmt(t.x / 1000, 2)} m, usunąć po etapie ${t.do + 1})`).join(', ')}` : '') + (md.stez.length ? `; stężenia: ${md.stez.map(z => `x = ${U.fmt(z.x / 1000, 2)} m od etapu ${z.od + 1}`).join(', ')}` : '') : null
  });

  out.nWarn = chk.filter(c => c.status === 'warn').length;
  out.uMax = chk.reduce((m, c) => (c.util !== null && isFinite(c.util) && c.util > m ? c.util : m), 0);
  out.gov = chk.reduce((g, c) => (!g || (c.util || 0) > (g.util || 0) ? c : g), null);
  out.time = Date.now() - t0;
  return out;
};

/* ---------------------------------------------------------- SGU */
J.sgu = function (st, md, an, combos, sec, base, ndp) {
  const o = st.sgu, out = { checks: [], seg: [], wc: null, wcMax: 0 };
  const s = md.nE - 1, xs = an.xs, ns = an.ns;
  const R = an.res[s];
  // ugięcie od G (charakterystyczne, z historią etapów)
  const wG = new Float64Array(ns);
  Object.keys(R).forEach(k => { if (S.RODZAJE[R[k].c.rodzaj].stale) for (let i = 0; i < ns; i++) wG[i] += R[k].tot.w[i]; });
  out.wG = wG;
  let wc = new Float64Array(ns);
  if (o.podniesienie === 'auto') wc = Float64Array.from(wG);
  else if (o.podniesienie === 'wartosc' && U.num(o.wc) > 0) { const m = Math.max(...wG); if (m > 0) for (let i = 0; i < ns; i++) wc[i] = wG[i] / m * U.num(o.wc); }
  out.wc = wc; out.wcMax = Math.max(0, ...wc);
  const chars = combos.filter(c => c.typ === 'char' && c.etap === s);
  const lim = { wmax: U.num(o.wmax, 250), w3: U.num(o.w3, 350) };
  const rel = (arr, sg) => {
    const a = S.at(xs, arr, sg.x0), b = S.at(xs, arr, sg.x1); let mx = -Infinity, mn = Infinity, xm = sg.x0;
    for (let i = 0; i < ns; i++) { const x = xs[i]; if (x < sg.x0 - 1e-6 || x > sg.x1 + 1e-6) continue; let r; if (sg.wsp) r = arr[i] - (sg.x0 === 0 ? b : a); else r = arr[i] - (a + (b - a) * (x - sg.x0) / (sg.x1 - sg.x0)); if (r > mx) { mx = r; xm = x; } if (r < mn) mn = r; }
    return { mx, mn, xm };

  md.seg.forEach(sg => {
    const Lref = sg.wsp ? 2 * (sg.x1 - sg.x0) : sg.x1 - sg.x0;
    let best = { v: -Infinity }, best3 = { v: -Infinity }, up = { v: Infinity };
    chars.forEach(c => {

      const r1 = rel(wn, sg), r3 = rel(Ev.w, sg);

      if (r1.mn < up.v) up = { v: r1.mn, c };
      if (r3.mx > best3.v) best3 = { v: r3.mx, x: r3.xm, c };
    });
    if (!chars.length) return;
    const rec = { sg, Lref, wmax: best.v, xw: best.x, w3: best3.v, x3: best3.x, wup: up.v, limMax: Lref / lim.wmax, lim3: Lref / lim.w3, cmax: best.c, c3: best3.c };
    out.seg.push(rec);
    out.checks.push(BS.check({ id: 'w-' + sg.id, grp: 'SGU – ugięcia (eksploatacja)', etap: s, n: `Ugięcie wmax – ${sg.n}${o.podniesienie !== 'brak' ? ' (po odjęciu podniesienia wc)' : ''}`, ref: 'PN-EN 1990 A1.4.3; PN-EN 1993-1-1 7.2.1', Ed: Math.max(0, rec.wmax), Rd: rec.limMax, unit: 'mm', util: Math.max(0, rec.wmax) / rec.limMax, x: rec.xw, combo: best.c ? best.c.opis : '', d: rec, lim: `${sg.wsp ? '2·' : ''}L/${lim.wmax}` }));
    out.checks.push(BS.check({ id: 'w3-' + sg.id, grp: 'SGU – ugięcia (eksploatacja)', etap: s, n: `Ugięcie od obciążeń zmiennych w3 – ${sg.n}`, ref: 'PN-EN 1990 A1.4.3', Ed: Math.max(0, rec.w3), Rd: rec.lim3, unit: 'mm', util: Math.max(0, rec.w3) / rec.lim3, x: rec.x3, combo: best3.c ? best3.c.opis : '', d: rec, lim: `${sg.wsp ? '2·' : ''}L/${lim.w3}` }));
  });
  // ugięcia w etapach montażu (informacyjnie)
  out.montaz = [];
  for (let e = 0; e < md.nE - 1; e++) {
    let mx = 0, xm = 0;
    combos.filter(c => c.typ === 'char' && c.etap === e).forEach(c => { const E = K.evaluate(an, c); for (let i = 0; i < ns; i++) if (E.w[i] > mx) { mx = E.w[i]; xm = xs[i]; } });
    out.montaz.push({ etap: e, w: mx, x: xm });
    out.checks.push(BS.check({ id: 'wm' + e, grp: 'SGU – ugięcia (eksploatacja)', etap: e, n: `Ugięcie w etapie ${e + 1} (${md.etapy[e].nazwa}) – informacyjnie`, ref: 'PN-EN 1991-1-6', Ed: mx, Rd: null, unit: 'mm', util: null, info: true, x: xm, combo: '' }));
  }
  // przemieszczenia poziome (gdy są obciążenia poziome)
  const hasY = md.cases.some(c => c.parts.some(p => p.kier === 'y'));
  if (hasY) {

    chars.forEach(c => { const E = K.evaluate(an, c); for (let i = 0; i < ns; i++) if (Math.abs(E.u[i]) > umax) { umax = Math.abs(E.u[i]); xu = xs[i]; cu = c; } });
    const Lm = Math.max(...md.seg.map(g => g.x1 - g.x0));
    out.checks.push(BS.check({ id: 'u', grp: 'SGU – ugięcia (eksploatacja)', n: 'Przemieszczenie poziome u', ref: 'PN-EN 1990 A1.4.3', Ed: umax, Rd: Lm / U.num(o.uLim, 200), unit: 'mm', util: umax / (Lm / U.num(o.uLim, 200)), x: xu, combo: cu ? cu.opis : '', lim: `L/${o.uLim}` }));
  }

  if (o.drgania !== false) {
    const mass = [], pm = [];
    Object.keys(R).forEach(k => {
      const c = R[k].c; let f = 0;
      if (S.RODZAJE[c.rodzaj].stale) f = 1; else if (c.rodzaj !== 'A' && c.etap === s) f = K.psi(c)[2];

        if (p.typ === 'q') {
          // podział na odcinki stałej intensywności (średnia na elemencie siatki)
          const n = 8; for (let j = 0; j < n; j++) { const a = p.x0 + (p.x1 - p.x0) * j / n, b = p.x0 + (p.x1 - p.x0) * (j + 1) / n, q = p.q0 + (p.q1 - p.q0) * (j + 0.5) / n; mass.push({ x0: a, x1: b, m: Math.max(0, f * q) / 9810 }); }
        } else if (p.typ === 'P') pm.push({ x: p.x, m: Math.max(0, f * p.P) / 9810 });
      });
    });
    try {
      const fr = F.freq({ xs: md.xs, EI: U.E * sec.Iy, mass, pm, supports: md.systems[s].map(p => ({ x: p.x, kv: p.kv, kr: p.kr })) });
      out.f1 = fr.f; out.mode = fr.shape;
      out.checks.push(BS.check({ id: 'f1', grp: 'SGU – drgania', n: 'Częstotliwość drgań własnych f1 (masa G + ψ2·Q)', ref: 'PN-EN 1990 A1.4.4; PN-EN 1993-1-1 7.2.3', Ed: fr.f, Rd: U.num(o.fmin, 3), unit: 'Hz', util: U.num(o.fmin, 3) / fr.f, combo: 'G + Σψ2·Q', d: fr, inverse: true }));
    } catch (e) { out.checks.push(BS.check({ id: 'f1', grp: 'SGU – drgania', n: 'Częstotliwość drgań własnych', ref: 'A1.4.4', util: null, info: true, Ed: null, Rd: null, unit: 'Hz', combo: e.message })); }
  }
  return out;
};

/* ---------------------------------------------------------- podpory i połączenia */
J.supports = function (st, md, an, combos, sec, base, mat, ndp, env, out) {
  const res = [];
  const equ = K.equ(md, an, ndp); out.equ = equ;
  const s = md.nE - 1;
  const allSup = md.sup.map(p => ({ p, etapy: md.etapy.map((e, i) => i) })).concat(md.tmp.map(t => ({ p: t, etapy: md.etapy.map((e, i) => i).filter(i => i <= t.do) })));
  allSup.forEach(({ p, etapy }) => {
    const r = { id: p.id, x: p.x, typ: p.typ, tymcz: p.tymcz, wezel: p.wezel, etapy: [], checks: [] };
    let Rmax = 0, Mmax = 0, cMax = null, eMax = 0;
    etapy.forEach(e => { const q = env[e].R[p.id]; if (q) { r.etapy.push({ e, max: q.max, min: q.min, M: q.Mmax, Ry: q.Rymax }); if (Math.abs(q.max) > Rmax) { Rmax = Math.abs(q.max); cMax = q.cmax; eMax = e; } if (q.Mmax > Mmax) Mmax = q.Mmax; } });
    r.Rmax = Rmax; r.Mmax = Mmax; r.etapMax = eMax;
    // reakcje charakterystyczne od przypadków (etap końcowy lub ostatni etap istnienia)
    const eK = Math.max(...etapy);
    r.Rk = Object.keys(an.res[eK]).map(k => ({ id: k, nazwa: an.res[eK][k].c.nazwa, rodzaj: an.res[eK][k].c.rodzaj, R: an.res[eK][k].tot.R[p.id] ? an.res[eK][k].tot.R[p.id].R : 0, M: an.res[eK][k].tot.R[p.id] ? an.res[eK][k].tot.R[p.id].M : 0 }));
    r.eK = eK;
    const q = equ.filter(z => z.id === p.id);
    r.equ = q;
    const grp = `Podpory i połączenia – podpora ${p.id}`;
    const Rmin = Math.min(...q.map(z => z.Rmin));
    if (Rmin < 0) {
      const anch = p.wezel && ['blacha_czolowa', 'blacha_zebrowa'].includes(p.wezel.typ);
      r.checks.push(BS.check({ id: `${p.id}-EQU`, grp, n: 'Odrywanie podpory (EQU) – wymagane zakotwienie', ref: 'PN-EN 1990 6.4.3.1, tabl. A1.2(A)', Ed: -Rmin, Rd: null, unit: 'F', util: null, forceStatus: anch ? 'warn' : 'fail', info: false, x: p.x, combo: 'EQU: 1,10/0,90·G + 1,5·Q', note: anch ? 'Siłę odrywającą musi przenieść połączenie (sprawdź śruby na rozciąganie).' : 'Oparcie bez zakotwienia – zaprojektuj kotwienie na siłę odrywającą.' }));
    }
    const isEnd = !p.tymcz && ((p.idx === 0 && md.wL === 0) || (p.idx === md.sup.length - 1 && md.wP === 0));
    const w = p.wezel || { typ: 'brak' };
    const conn = ['blacha_czolowa', 'blacha_zebrowa'].includes(w.typ);
    // docisk środnika / żebro
    if (!conn && Rmax > 0) {
      if (w.zebro) {
        const sr = R.stiffener(sec, base, ndp, { F: Rmax, bs: U.num(w.bs, 80), ts: U.num(w.ts, 10), ch: U.num(w.ch, 15), koniec: isEnd, e: U.num(p.src && p.src.c, 0) + U.num(p.ss) / 2 });
        r.zebro = sr;
        r.checks.push(BS.check({ id: `${p.id}-ZB`, grp, n: 'Żebro podporowe – wyboczenie (przekrój krzyżowy z 15εtw)', ref: 'PN-EN 1993-1-5 9.4; PN-EN 1993-1-1 6.3.1', Ed: Rmax, Rd: sr.NbRd, unit: 'F', util: sr.uB, x: p.x, combo: cMax !== null ? combos[cMax].opis : '', d: sr }));
        r.checks.push(BS.check({ id: `${p.id}-ZD`, grp, n: 'Żebro podporowe – docisk końców żeber', ref: 'PN-EN 1993-1-1 6.2.4', Ed: Rmax, Rd: sr.Fbear, unit: 'F', util: sr.uC, x: p.x, combo: '', d: sr }));
        if (sr.ctS > sr.ctLim) r.checks.push(BS.check({ id: `${p.id}-ZC`, grp, n: 'Żebro – smukłość ścianki bs/ts', ref: 'PN-EN 1993-1-5 9.2.1(8)', Ed: sr.ctS, Rd: sr.ctLim, unit: '-', util: sr.ctS / sr.ctLim, d: sr }));
      } else {
        const pr = R.patch(sec, base, ndp, { F: Rmax, ss: U.num(p.ss, 0), typ: isEnd ? 'c' : 'a', c: U.num(p.src && p.src.c, 0), pas: 'd', a: U.num(st.analiza.zebraRozstaw) * 1000 });
        r.patch = pr;
        r.checks.push(BS.check({ id: `${p.id}-PL`, grp, n: `Docisk środnika nad podporą (typ ${isEnd ? 'c' : 'a'})`, ref: 'PN-EN 1993-1-5 6.2–6.5', Ed: Rmax, Rd: pr.FRd, unit: 'F', util: pr.u, x: p.x, combo: cMax !== null ? combos[cMax].opis : '', d: pr }));
        if (!isEnd && Mmax > 0) {
          const e1 = Mmax / (Math.min(sec.Wel_t, sec.Wel_b) * base.fy / ndp.gM0);
          r.checks.push(BS.check({ id: `${p.id}-PI`, grp, n: 'Interakcja F–M nad podporą', ref: 'PN-EN 1993-1-5 7.2', Ed: pr.u + 0.8 * e1, Rd: 1.4, unit: '-', util: (pr.u + 0.8 * e1) / 1.4, x: p.x, combo: '', d: { eta1: e1, eta2: pr.u } }));
        }
      }
    }
    if (w.typ === 'oparcie' && w.podloze !== 'stal' && Rmax > 0) {
      const bp = C.bearingPlate(sec, mat, ndp, { podloze: w.podloze, bp: U.num(w.bp), lp: U.num(w.lp), tp: U.num(w.tp), beton: w.beton, alfa: w.alfa, fd: w.fd, beta: w.beta, lb: U.num(w.lb, U.num(w.lp)) }, Rmax);
      r.plyta = bp;
      bp.checks.forEach((c, k) => r.checks.push(BS.check({ id: `${p.id}-B${k}`, grp, n: c.n, ref: c.ref, Ed: c.Ed, Rd: c.Rd, unit: 'F', util: c.u, x: p.x, combo: cMax !== null ? combos[cMax].opis : '', d: c, f: c.f })));
      bp.uwagi.forEach(u => out.warnings.push(`Podpora ${p.id}: ${u}`));
    }
    if (conn && Rmax > 0) {
      const wv = Object.assign({}, w);
      ['hp', 'bp', 'tp', 'nr', 'n', 'e1', 'p1', 'e2', 'p3', 'a', 'tsup', 'fusup', 'z', 'e2b'].forEach(k => { if (wv[k] !== undefined) wv[k] = U.num(wv[k]); });
      let cr;
      try { cr = w.typ === 'blacha_czolowa' ? C.endPlate(sec, mat, ndp, wv, Rmax) : C.finPlate(sec, mat, ndp, wv, Rmax); } catch (e) { out.errors.push(`Połączenie ${p.id}: ${e.message}`); cr = null; }
      if (cr) {
        r.pol = cr;
        cr.checks.forEach((c, k) => r.checks.push(BS.check({ id: `${p.id}-C${k}`, grp, n: c.n, ref: c.ref, Ed: c.Ed, Rd: c.Rd, unit: c.Rd === 1 ? '-' : (c.n.indexOf('V·z') >= 0 && c.n.indexOf('Spoiny') < 0 ? 'M' : c.n.indexOf('Spoiny blachy do podpory') >= 0 ? 'q' : 'F'), util: c.u, x: p.x, combo: cMax !== null ? combos[cMax].opis : '', d: c, f: c.f })));
        cr.detal.filter(d => !d.ok).forEach(d => r.checks.push(BS.check({ id: `${p.id}-D${d.n}`, grp, n: `Rozmieszczenie łączników: ${d.n}`, ref: 'PN-EN 1993-1-8 tabl. 3.3', Ed: d.v, Rd: d.lim, unit: 'mm', util: d.lim / Math.max(d.v, 1e-9), inverse: true })));
        cr.uwagi.forEach(u => out.warnings.push(`Połączenie ${p.id}: ${u}`));
      }
    }
    r.checks.forEach(c => out.checks.push(c));
    res.push(r);
  });
  return res;
};

/* ---------------------------------------------------------- pożar */
J.fire = function (st, md, an, combos, sec, base, ndp) {
  const s = md.nE - 1, xs = an.xs;
  const fc = combos.filter(c => c.typ === 'poz' && c.etap === s);
  let gov = null;
  const intSup = md.sup.filter(p => !((p.idx === 0 && md.wL === 0) || (p.idx === md.sup.length - 1 && md.wP === 0)));
  fc.forEach(c => {
    const E = K.evaluate(an, c);
    for (let i = 0; i < xs.length; i++) {
      const atSup = intSup.some(p => Math.abs(p.x - xs[i]) < 1);
      const sc = Math.abs(E.M[i]) / (atSup ? 0.85 : 1);
      if (!gov || sc > gov.sc) gov = { sc, M: E.M[i], V: Math.max(...Array.from(E.V).map(Math.abs)), x: xs[i], c, E, atSup };
    }
  });
  if (!gov) return { checks: [] };
  let Mcr = Infinity;
  try { const r = T.mcrRun(md, an, sec, U.E, U.G, gov.c, gov.E.M); let mm = 0; for (let i = 0; i < xs.length; i++) mm = Math.max(mm, Math.abs(gov.E.M[i])); Mcr = r.lam * mm; } catch (e) { /* bez zwichrzenia */ }
  let Mlt = 0; for (let i = 0; i < xs.length; i++) Mlt = Math.max(Mlt, Math.abs(gov.E.M[i]));
  const Efi = { M: gov.M, V: gov.V, Mpos: gov.M >= 0, przyPodporze: gov.atSup, Mcr, Mlt };
  const r = X.fire(sec, base, ndp, st.pozar, Efi);
  r.Efi = Efi; r.combo = gov.c;
  r.checks = [
    BS.check({ id: 'fi-t', grp: 'Pożar – PN-EN 1993-1-2', n: `Odporność ogniowa R${r.Rreq}: czas osiągnięcia θa,cr`, ref: '4.2.3, 4.2.5', Ed: r.Rreq, Rd: r.tcr === null ? Infinity : r.tcr, unit: 'min', util: r.tcr === null ? 0 : r.Rreq / r.tcr, combo: gov.c.opis, d: r }),
    BS.check({ id: 'fi-u', grp: 'Pożar – PN-EN 1993-1-2', n: `Wytężenie w ${r.Rreq}. minucie (θa = ${U.fmt(r.thR, 0)} °C)`, ref: '4.2.3.3, 4.2.3.4', Ed: r.uR, Rd: 1, unit: '-', util: r.uR, x: gov.x, combo: gov.c.opis, d: r })
  ];
  return r;
};

/* ---------------------------------------------------------- zmęczenie */
J.fatigue = function (st, md, an, sec, base, ndp) {
  const o = st.zmeczenie, s = md.nE - 1, xs = an.xs, ns = an.ns;
  const ids = (o.przypadki || []).filter(k => an.res[s][k]);
  const out = { checks: [], ids };
  if (!ids.length) { out.checks.push(BS.check({ id: 'fat0', grp: 'Zmęczenie – PN-EN 1993-1-9', n: 'Nie wskazano przypadków obciążenia cyklicznego', ref: '', util: null, info: true, unit: '-' })); return out; }
  const dM = new Float64Array(ns), dV = new Float64Array(ns);
  const k = U.num(o.phi, 1) * (o.zmiennyZnak ? 2 : 1);
  ids.forEach(id => { const r = an.res[s][id].tot; for (let i = 0; i < ns; i++) { dM[i] += k * r.M[i]; dV[i] += k * r.V[i]; } });
  const gMf = X.gMf(o.ocena, o.skutki), gFf = ndp.gFf, n = U.num(o.n, 2e6);
  out.gMf = gMf; out.n = n;
  const zw = (m) => { // odległość włókna od osi obojętnej
    switch (m) { case 'pas_g': return sec.h - sec.zc; case 'spoina_g': return sec.h - sec.tg - sec.zc; case 'spoina_d': return sec.zc - sec.td; default: return sec.zc; }
  };
  out.det = (o.detale || []).map((d, j) => {
    const cat = X.DETALE.find(q => q.k === d.k) || X.DETALE[0];
    const dc = d.k === 'user' ? U.num(d.dc, 71) : cat.dc;
    let ds = 0, xm = 0;
    for (let i = 0; i < ns; i++) { const v = Math.abs(dM[i]) * zw(d.miejsce) / sec.Iy; if (v > ds) { ds = v; xm = xs[i]; } }
    const dsd = gFf * ds, dcd = dc / gMf;
    const Nf = X.Nsigma(dsd, dcd), D = n / Nf;
    const dsE2 = dsd * Math.pow(Math.max(D, 0) * Nf / 2e6, 1 / 3) || 0;
    const r = { cat, dc, ds, x: xm, dsd, dcd, Nf, D, miejsce: d.miejsce };
    out.checks.push(BS.check({ id: 'fat' + j, grp: 'Zmęczenie – PN-EN 1993-1-9', n: `Δσ – ${cat.n.split(' – ')[1] || cat.n} (${d.miejsce})`, ref: '8(2), 7.1, rys. 7.1; Palmgren–Miner', Ed: D, Rd: 1, unit: '-', util: D, x: xm, combo: `Δσ = ${U.fmt(ds, 1)} MPa, n = ${U.fmt(n, 0)}`, d: r }));
    out.checks.push(BS.check({ id: 'fatL' + j, grp: 'Zmęczenie – PN-EN 1993-1-9', n: 'Ograniczenie zakresu naprężeń Δσ ≤ 1,5·fy', ref: '8(1)', Ed: ds, Rd: 1.5 * base.fy, unit: 'MPa', util: ds / (1.5 * base.fy), x: xm }));
    return r;
  });
  let dt = 0, xt = 0;
  for (let i = 0; i < ns; i++) { const v = Math.abs(dV[i]) / (sec.hw * sec.tw); if (v > dt) { dt = v; xt = xs[i]; } }
  const dtc = U.num(o.dtc, 100), Nt = X.Ntau(gFf * dt, dtc / gMf), Dt = n / Nt;
  out.tau = { dt, x: xt, dtc, Nt, D: Dt };
  out.checks.push(BS.check({ id: 'fatT', grp: 'Zmęczenie – PN-EN 1993-1-9', n: 'Δτ – środnik (materiał rodzimy)', ref: '8(2), rys. 7.2', Ed: Dt, Rd: 1, unit: '-', util: Dt, x: xt, combo: `Δτ = ${U.fmt(dt, 1)} MPa`, d: out.tau }));
  return out;
};

/* ---------------------------------------------------------- kruche pękanie */
J.brittle = function (st, md, an, combos, sec, base, mat, ndp, outAll) {
  const o = st.kruche, s = md.nE - 1, xs = an.xs;
  const TEd = U.num(o.Tmd, -30) + U.num(o.dTr) + U.num(ndp.dTR) + U.num(o.dTeps) + U.num(o.dTcf);
  const out = { TEd, checks: [], el: [] };
  let sT = 0, sB = 0, sW = 0;
  combos.filter(c => c.typ === 'kruche' && c.etap === s).forEach(c => {
    const E = K.evaluate(an, c);
    const nT = Math.max(0, E.N) / sec.A;
    for (let i = 0; i < xs.length; i++) {
      const m = E.M[i];
      if (m < 0) sT = Math.max(sT, -m / sec.Wel_t + nT); else sB = Math.max(sB, m / sec.Wel_b + nT);
      sW = Math.max(sW, Math.abs(m) * Math.max(sec.h - sec.tg - sec.zc, sec.zc - sec.td) / sec.Iy + nT);
    }
  });
  const els = [{ n: 'pas górny', t: sec.tg, s: sT }, { n: 'pas dolny', t: sec.td, s: sB }, { n: 'środnik', t: sec.tw, s: sW }];
  (outAll.podpory || []).forEach(p => {
    const w = p.wezel || {};
    if (['blacha_czolowa', 'blacha_zebrowa'].includes(w.typ) && U.num(w.tp) > 0) els.push({ n: `blacha połączenia ${p.id}`, t: U.num(w.tp), s: null });
    if (w.zebro && U.num(w.ts) > 0) els.push({ n: `żebro podporowe ${p.id}`, t: U.num(w.ts), s: null });
    if (w.typ === 'oparcie' && U.num(w.tp) > 0 && w.podloze !== 'stal') els.push({ n: `płyta podporowa ${p.id}`, t: U.num(w.tp), s: null });
  });
  els.forEach((e, j) => {
    const fyt = M.fy(mat.gatunek, e.t, ndp.fySrc).fy - 0.25 * e.t;
    const ratio = e.s === null ? U.num(o.plyty, 0.75) : e.s / fyt;
    const r = X.tmax(mat.gatunek, mat.podgatunek, TEd, ratio);
    Object.assign(e, { fyt, ratio, r });
    out.el.push(e);
    if (r.err) { out.checks.push(BS.check({ id: 'kr' + j, grp: 'Kruche pękanie – PN-EN 1993-1-10', n: `Grubość – ${e.n}`, ref: '2.3, tabl. 2.1', util: null, forceStatus: 'fail', Ed: e.t, Rd: null, unit: 'mm', combo: r.err })); return; }
    out.checks.push(BS.check({ id: 'kr' + j, grp: 'Kruche pękanie – PN-EN 1993-1-10', n: `Grubość ${e.n} t = ${U.fmt(e.t, 1)} mm (${mat.gatunek}${mat.podgatunek}, TEd = ${U.fmt(TEd, 0)} °C, σEd = ${U.fmt(ratio, 2)}·fy(t))`, ref: '2.2, 2.3, tabl. 2.1', Ed: e.t, Rd: r.t, unit: 'mm', util: e.t / r.t, combo: e.s === null ? `σEd przyjęto ${U.fmt(ratio, 2)}·fy(t)` : 'G + ψ1·Q1 + Σψ2·Qi', d: e, forceStatus: r.over ? 'warn' : undefined }));
  });
  if (o.z && o.z.aktywny) {
    const z = { Za: X.Za(U.num(o.z.a)), Zb: U.num(o.z.Zb), Zc: X.Zc(U.num(o.z.s)), Zd: U.num(o.z.Zd), Ze: U.num(o.z.Ze) };
    const zc = X.zClass(z);
    out.z = Object.assign(z, zc);
    out.checks.push(BS.check({ id: 'krZ', grp: 'Kruche pękanie – PN-EN 1993-1-10', n: `Właściwości w kierunku grubości: ZEd = ${zc.ZEd} → ${zc.cls}`, ref: 'rozdz. 3, tabl. 3.1, 3.2', util: null, info: true, Ed: zc.ZEd, Rd: null, unit: '-', combo: `Za = ${z.Za}, Zb = ${z.Zb}, Zc = ${z.Zc}, Zd = ${z.Zd}, Ze = ${z.Ze}` }));
  }
  return out;
};

/* ---------------------------------------------------------- dobór kształtownika */
J.SERIE_DOBOR = ['IPE', 'HEA', 'HEB', 'HEM'];
J.candidates = function (series) {
  const list = [];
  (series || J.SERIE_DOBOR).forEach(sr => P.lista(sr).forEach(nr => { const p = P.props({ typ: 'walc', seria: sr, nr }); list.push({ seria: sr, nr, masa: p.masa, h: p.h }); }));
  return list.sort((a, b) => a.masa - b.masa);
};
J.passes = (r, lim) => !r.errors.length && r.checks.filter(c => !c.info).every(c => c.status !== 'fail' && (c.util === null || !isFinite(c.util) || c.util <= lim + 1e-9));

})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* src/ui/rysunki.js */
/* =====================================================================
   BelkaStal – rysunki SVG: schemat statyczny z obciążeniami i stężeniami,
   wykresy sił wewnętrznych i ugięć, przekrój, postać zwichrzenia,
   krzywe nagrzewania w pożarze.  Kolory z tokenów CSS (motyw jasny/ciemny).
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U;
const D = BS.D = {};
const esc = U.esc;
const f1 = (v) => U.fmt(v, 1), f2 = (v) => U.fmt(v, 2);

const C = {
  ink: 'var(--ink)', ink2: 'var(--ink2)', ink3: 'var(--ink3)', line: 'var(--line)', acc: 'var(--acc)',
  M: 'var(--cM, #c0262d)', V: 'var(--cV, #1d5bb8)', w: 'var(--cW, #1d7f3c)', z: 'var(--cZ, #8a5300)', fill: 'var(--panel2)'
};
D.C = C;

/* ---------------------------------------------------------- schemat */
// o: { width, etap, showLoads, sel (id przypadku) }
D.scheme = function (st, md, o) {
  o = o || {};
  const W = o.width || 760, padL = 40, padR = 40, L = md.L || 1;
  const s = o.etap === undefined ? md.nE - 1 : o.etap;
  const X = (x) => padL + (W - padL - padR) * x / L;
  const loads = (md.cases || []).filter(c => o.showLoads !== false && (S_RODZ(c).stale ? c.etap <= s : c.etap === s));
  const zLoads = []; loads.forEach(c => c.parts.forEach(p => { if (p.kier === 'z') zLoads.push({ c, p }); }));
  const distL = zLoads.filter(q => q.p.typ === 'q');
  const rowH = 20, top = 14;
  const nRows = Math.min(distL.length, 8);
  const yBeam = top + nRows * rowH + 46;
  let g = '';
  // obciążenia rozłożone – pasma
  distL.slice(0, 8).forEach((q, i) => {
    const p = q.p, y0 = top + i * rowH, x0 = X(p.x0), x1 = X(p.x1);
    const qm = Math.max(Math.abs(p.q0), Math.abs(p.q1)) || 1;
    const h0 = 6 + 10 * Math.abs(p.q0) / qm, h1 = 6 + 10 * Math.abs(p.q1) / qm;
    const yb = y0 + rowH - 2;
    const col = loadColor(q.c);
    g += `<polygon points="${x0},${yb} ${x0},${yb - h0} ${x1},${yb - h1} ${x1},${yb}" fill="${col}" fill-opacity=".13" stroke="${col}" stroke-width="1"/>`;
    const n = Math.max(2, Math.round((x1 - x0) / 26));
    for (let k = 0; k <= n; k++) { const x = x0 + (x1 - x0) * k / n; const hh = h0 + (h1 - h0) * k / n; if (p.q0 * p.q1 >= 0 && (p.q0 >= 0)) g += arrow(x, yb - hh, x, yb, col, 3); else g += arrow(x, yb, x, yb - hh, col, 3); }
    const lab = `${esc(q.c.id)}: ${U.fmt(p.q0, 2)}${p.q1 !== p.q0 ? '…' + U.fmt(p.q1, 2) : ''} kN/m${p.wys === 'pas_g' ? '' : p.wys === 'srodek' ? ' (ŚŚ)' : ' (pas d.)'}`;
    g += `<text x="${x0 + 3}" y="${y0 + 9}" font-size="9.5" fill="${col}">${lab}</text>`;
  });
  if (distL.length > 8) g += `<text x="${W - padR}" y="${top + nRows * rowH + 8}" font-size="9" text-anchor="end" fill="${C.ink3}">+ ${distL.length - 8} obc. rozłożonych</text>`;
  // belka
  g += `<line x1="${X(0)}" y1="${yBeam}" x2="${X(L)}" y2="${yBeam}" stroke="${C.ink}" stroke-width="3.2"/>`;
  // stężenie ciągłe
  const c = md.ciagle || {};
  if (c.pasG && U.num(c.odEtapu, 0) <= s) g += `<line x1="${X(0)}" y1="${yBeam - 4}" x2="${X(L)}" y2="${yBeam - 4}" stroke="${C.acc}" stroke-width="2" stroke-dasharray="2 3"/><text x="${X(L) - 2}" y="${yBeam - 8}" font-size="9" text-anchor="end" fill="${C.acc}">pas górny stężony ciągle</text>`;
  if (c.pasD && U.num(c.odEtapuD, 0) <= s) g += `<line x1="${X(0)}" y1="${yBeam + 4}" x2="${X(L)}" y2="${yBeam + 4}" stroke="${C.acc}" stroke-width="2" stroke-dasharray="2 3"/>`;
  // siły skupione i momenty
  zLoads.filter(q => q.p.typ !== 'q').forEach(q => {
    const p = q.p, x = X(p.x), col = loadColor(q.c);
    if (p.typ === 'P') { const up = p.P < 0; g += up ? arrow(x, yBeam - 2, x, yBeam - 34, col, 5, 1.6) : arrow(x, yBeam - 36, x, yBeam - 3, col, 5, 1.6); g += `<text x="${x + 4}" y="${yBeam - 26}" font-size="10" fill="${col}" font-weight="600">${esc(q.c.id)}: ${U.fmt(Math.abs(p.P) / 1000, 1)} kN</text>`; }
    if (p.typ === 'M') { g += `<path d="M ${x - 10} ${yBeam - 6} A 11 11 0 1 1 ${x + 10} ${yBeam - 6}" fill="none" stroke="${col}" stroke-width="1.5"/>${arrowHead(x + 10, yBeam - 6, p.M > 0 ? 100 : 260, col)}<text x="${x + 13}" y="${yBeam - 16}" font-size="10" fill="${col}">${U.fmt(p.M / 1e6, 1)} kNm</text>`; }
  });
  // podpory
  (md.systems[s] || []).forEach(p => { g += support(X(p.x), yBeam, p); });
  md.tmp.filter(t => s > t.do).forEach(t => { g += `<g opacity=".35">${support(X(t.x), yBeam, t)}</g><text x="${X(t.x)}" y="${yBeam + 40}" font-size="9" text-anchor="middle" fill="${C.ink3}">usunięta</text>`; });
  // stężenia dyskretne
  md.stez.forEach(z => {
    const act = z.od <= s, x = X(z.x), yy = z.wys === 'pas_d' ? yBeam + 6 : z.wys === 'srodek' ? yBeam : yBeam - 6;
    const col = act ? C.acc : C.ink3;
    g += `<g opacity="${act ? 1 : 0.35}"><circle cx="${x}" cy="${yy}" r="4.2" fill="var(--panel)" stroke="${col}" stroke-width="1.6"/>${z.typ !== 'boczne' ? `<line x1="${x - 3}" y1="${yy - 3}" x2="${x + 3}" y2="${yy + 3}" stroke="${col}" stroke-width="1.4"/><line x1="${x - 3}" y1="${yy + 3}" x2="${x + 3}" y2="${yy - 3}" stroke="${col}" stroke-width="1.4"/>` : `<circle cx="${x}" cy="${yy}" r="1.4" fill="${col}"/>`}</g>`;
  });
  // wymiary
  const yd = yBeam + 52;
  const pts = [0].concat(md.sup.map(p => p.x)).concat([L]).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b);
  for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; if (b - a < 1) continue; g += dim(X(a), X(b), yd, U.fmt((b - a) / 1000, 2)); }
  g += dim(X(0), X(L), yd + 24, `L = ${U.fmt(L / 1000, 2)} m`);
  // etykiety podpór
  md.sup.forEach(p => { g += `<text x="${X(p.x)}" y="${yBeam + 38}" font-size="11" font-weight="700" text-anchor="middle" fill="${C.ink}">${p.id}</text>`; });
  md.tmp.filter(t => s <= t.do).forEach(t => { g += `<text x="${X(t.x)}" y="${yBeam + 38}" font-size="10" text-anchor="middle" fill="${C.ink2}">${t.id}</text>`; });
  const H = yd + 40;
  return `<svg class="schemesvg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Schemat statyczny belki">${g}</svg>`;
};
const S_RODZ = (c) => (BS.S.RODZAJE[c.rodzaj] || {});
const LCOL = { G: '#5b6576', Q: '#1d5bb8', S: '#3a7ca5', W: '#7a4fb5', T: '#a35d00', Qc: '#b5413f', M: '#8a5300', A: '#c0262d' };
function loadColor(c) { return LCOL[c.rodzaj] || '#5b6576'; }
D.loadColor = loadColor;
function arrow(x1, y1, x2, y2, col, hs, sw) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = hs || 4;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw || 1}"/><path d="M ${x2} ${y2} L ${x2 - h * Math.cos(a - 0.45)} ${y2 - h * Math.sin(a - 0.45)} L ${x2 - h * Math.cos(a + 0.45)} ${y2 - h * Math.sin(a + 0.45)} Z" fill="${col}"/>`;
}
function arrowHead(x, y, ang, col) { const a = ang * Math.PI / 180, h = 5; return `<path d="M ${x} ${y} L ${x - h * Math.cos(a - 0.5)} ${y - h * Math.sin(a - 0.5)} L ${x - h * Math.cos(a + 0.5)} ${y - h * Math.sin(a + 0.5)} Z" fill="${col}"/>`; }
function dim(x0, x1, y, lab) {
  return `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.ink3}" stroke-width=".8"/><line x1="${x0 - 3}" y1="${y + 3}" x2="${x0 + 3}" y2="${y - 3}" stroke="${C.ink3}"/><line x1="${x1 - 3}" y1="${y + 3}" x2="${x1 + 3}" y2="${y - 3}" stroke="${C.ink3}"/><line x1="${x0}" y1="${y - 6}" x2="${x0}" y2="${y + 4}" stroke="${C.ink3}" stroke-width=".6"/><line x1="${x1}" y1="${y - 6}" x2="${x1}" y2="${y + 4}" stroke="${C.ink3}" stroke-width=".6"/><text x="${(x0 + x1) / 2}" y="${y - 4}" font-size="11" text-anchor="middle" fill="${C.ink2}">${lab}</text>`;
}
function support(x, y, p) {
  const col = C.ink, dash = p.tymcz ? ' stroke-dasharray="3 2"' : '';
  if (p.typ === 'utwierdzenie') return `<rect x="${x - 3}" y="${y - 14}" width="6" height="28" fill="${col}"/>` + [0, 1, 2, 3, 4].map(k => `<line x1="${x + (p.x === 0 ? -3 : 3)}" y1="${y - 12 + k * 6}" x2="${x + (p.x === 0 ? -9 : 9)}" y2="${y - 6 + k * 6}" stroke="${col}" stroke-width=".8"/>`).join('');
  let s = `<path d="M ${x} ${y + 2} L ${x - 8} ${y + 15} L ${x + 8} ${y + 15} Z" fill="var(--panel)" stroke="${col}" stroke-width="1.3"${dash}/>`;
  if (p.typ === 'sprezyna') s += `<path d="M ${x} ${y + 15} l 0 3 l -5 3 l 10 3 l -10 3 l 5 3 l 0 3" fill="none" stroke="${col}" stroke-width="1"/>`;
  else s += `<line x1="${x - 11}" y1="${y + 17}" x2="${x + 11}" y2="${y + 17}" stroke="${col}" stroke-width="1"${dash}/>` + [0, 1, 2, 3].map(k => `<line x1="${x - 9 + k * 6}" y1="${y + 17}" x2="${x - 13 + k * 6}" y2="${y + 22}" stroke="${col}" stroke-width=".7"/>`).join('');
  return s;
}

/* ---------------------------------------------------------- wykres funkcji x */
// o: { xs, L, series:[{y, col, lab, fill, dash}], scale, unit, title, down (wartości dodatnie w dół), sup:[x], width, height, marks }
D.plot = function (o) {
  const W = o.width || 760, H = o.height || 200, padL = 40, padR = 40, padT = 26, padB = 22;
  const L = o.L || 1, X = (x) => padL + (W - padL - padR) * x / L;
  let ymin = 0, ymax = 0;
  o.series.forEach(s => { for (let i = 0; i < s.y.length; i++) { const v = s.y[i] * (o.scale || 1); if (isFinite(v)) { if (v < ymin) ymin = v; if (v > ymax) ymax = v; } } });
  if (ymax - ymin < 1e-9) { ymax = 1; ymin = -1; }
  const span = ymax - ymin, H0 = H - padT - padB;
  const down = o.down !== false;
  const Y = (v) => down ? padT + H0 * (v - ymin) / span : padT + H0 * (ymax - v) / span;
  let g = '';
  const y0 = Y(0);
  g += `<line x1="${X(0)}" y1="${y0}" x2="${X(L)}" y2="${y0}" stroke="${C.ink2}" stroke-width="1.2"/>`;
  (o.sup || []).forEach(x => { g += `<line x1="${X(x)}" y1="${padT - 6}" x2="${X(x)}" y2="${H - padB + 4}" stroke="${C.line}" stroke-dasharray="3 3"/>`; });
  o.series.forEach(s => {
    let d = '';
    for (let i = 0; i < s.y.length; i++) { const v = s.y[i] * (o.scale || 1); if (!isFinite(v)) continue; d += (d ? ' L ' : 'M ') + X(o.xs[i]).toFixed(1) + ' ' + Y(v).toFixed(1); }
    if (s.fill && d) g += `<path d="${d} L ${X(o.xs[o.xs.length - 1]).toFixed(1)} ${y0} L ${X(o.xs[0]).toFixed(1)} ${y0} Z" fill="${s.col}" fill-opacity=".11" stroke="none"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.col}" stroke-width="${s.w || 1.6}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>`;
    // ekstrema
    if (s.lab !== false) {
      let iM = -1, im = -1;
      for (let i = 0; i < s.y.length; i++) { if (!isFinite(s.y[i])) continue; if (iM < 0 || s.y[i] > s.y[iM]) iM = i; if (im < 0 || s.y[i] < s.y[im]) im = i; }
      [iM, im].forEach((i, k) => {
        if (i < 0) return; const v = s.y[i] * (o.scale || 1); if (Math.abs(v) < 1e-6 * Math.max(Math.abs(ymax), Math.abs(ymin))) return;
        if (k === 1 && i === iM) return;
        const yy = Y(v), above = (down ? v < 0 : v > 0);
        g += `<circle cx="${X(o.xs[i])}" cy="${yy}" r="2.4" fill="${s.col}"/><text x="${X(o.xs[i])}" y="${above ? yy - 5 : yy + 12}" font-size="10.5" text-anchor="middle" fill="${s.col}" font-weight="600">${U.fmt(v, o.dec === undefined ? 1 : o.dec)}</text>`;
      });
    }
  });
  if (o.title) g += `<text x="${padL}" y="14" font-size="12" font-weight="650" fill="${C.ink}">${esc(o.title)}</text>`;
  const leg = o.series.filter(s => s.name);
  let lx = W - padR;
  leg.slice().reverse().forEach(s => { const tw = s.name.length * 5.6 + 26; lx -= tw; g += `<line x1="${lx}" y1="11" x2="${lx + 16}" y2="11" stroke="${s.col}" stroke-width="2"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/><text x="${lx + 20}" y="14" font-size="10" fill="${C.ink2}">${esc(s.name)}</text>`; });
  if (o.unit) g += `<text x="6" y="${padT + 6}" font-size="10" fill="${C.ink3}">${esc(o.unit)}</text>`;
  // oś x
  g += `<text x="${X(0)}" y="${H - 6}" font-size="9.5" fill="${C.ink3}" text-anchor="middle">0</text><text x="${X(L)}" y="${H - 6}" font-size="9.5" fill="${C.ink3}" text-anchor="middle">${U.fmt(L / 1000, 2)} m</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.title || 'wykres')}">${g}</svg>`;
};

/* ---------------------------------------------------------- przekrój */
D.section = function (sec, o) {
  o = o || {};
  const S = o.size || 260, pad = 34;
  const sc = (S - 2 * pad) / Math.max(sec.h, Math.max(sec.bg, sec.bd));
  const W = Math.max(sec.bg, sec.bd) * sc + 2 * pad + 40, H = sec.h * sc + 2 * pad;
  const cx = W / 2 - 10, X = (y) => cx + y * sc, Y = (z) => H - pad - z * sc;
  let g = '';
  const d = sec.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ') + ' Z';
  g += `<path d="${d}" fill="var(--secfill, #c9d3e3)" stroke="${C.ink}" stroke-width="1.2"/>`;
  // strefy nieefektywne
  (o.eff && o.eff.info || []).forEach(inf => {
    if (inf.el === 'środnik' && inf.hole) { g += `<rect x="${X(-sec.tw / 2)}" y="${Y(inf.hole[1])}" width="${sec.tw * sc}" height="${(inf.hole[1] - inf.hole[0]) * sc}" fill="var(--failbg)" stroke="var(--fail)" stroke-width="1" stroke-dasharray="3 2"/>`; }
    if (inf.el.startsWith('pas') && inf.rho < 1) {
      const top = inf.el === 'pas górny', b = top ? sec.bg : sec.bd, t = top ? sec.tg : sec.td, cut = (1 - inf.rho) * inf.c;
      const z0 = top ? sec.h - t : 0;
      [[-b / 2, -b / 2 + cut], [b / 2 - cut, b / 2]].forEach(([a, c]) => { g += `<rect x="${X(a)}" y="${Y(z0 + t)}" width="${(c - a) * sc}" height="${t * sc}" fill="var(--failbg)" stroke="var(--fail)" stroke-dasharray="3 2"/>`; });
    }
  });
  // osie i środki
  g += `<line x1="${X(-Math.max(sec.bg, sec.bd) / 2) - 12}" y1="${Y(sec.zc)}" x2="${X(Math.max(sec.bg, sec.bd) / 2) + 12}" y2="${Y(sec.zc)}" stroke="${C.acc}" stroke-dasharray="6 3 1 3" stroke-width=".8"/><text x="${X(Math.max(sec.bg, sec.bd) / 2) + 14}" y="${Y(sec.zc) + 3}" font-size="10" fill="${C.acc}">y</text>`;
  g += `<line x1="${X(0)}" y1="${Y(sec.h) - 12}" x2="${X(0)}" y2="${Y(0) + 12}" stroke="${C.acc}" stroke-dasharray="6 3 1 3" stroke-width=".8"/><text x="${X(0) + 3}" y="${Y(0) + 22}" font-size="10" fill="${C.acc}">z</text>`;
  if (!sec.sym) g += `<circle cx="${X(0)}" cy="${Y(sec.zs)}" r="3" fill="none" stroke="${C.M}"/><text x="${X(0) + 6}" y="${Y(sec.zs) - 4}" font-size="9" fill="${C.M}">ŚŚ</text>`;
  // wymiary
  const xr = X(Math.max(sec.bg, sec.bd) / 2) + 26;
  g += `<line x1="${xr}" y1="${Y(0)}" x2="${xr}" y2="${Y(sec.h)}" stroke="${C.ink3}" stroke-width=".8"/><text x="${xr + 4}" y="${(Y(0) + Y(sec.h)) / 2}" font-size="11" fill="${C.ink2}" transform="rotate(90 ${xr + 4} ${(Y(0) + Y(sec.h)) / 2})" text-anchor="middle">h = ${f1(sec.h)}</text>`;
  g += `<text x="${X(0)}" y="${Y(sec.h) - 8}" font-size="11" text-anchor="middle" fill="${C.ink2}">b = ${f1(sec.bg)}${sec.sym ? '' : ''}</text>`;
  if (!sec.sym) g += `<text x="${X(0)}" y="${Y(0) + 26}" font-size="11" text-anchor="middle" fill="${C.ink2}">b = ${f1(sec.bd)}</text>`;
  g += `<text x="${X(sec.tw / 2) + 4}" y="${Y(sec.h / 2)}" font-size="10" fill="${C.ink2}">tw = ${f1(sec.tw)}</text>`;
  g += `<text x="${X(-Math.max(sec.bg, sec.bd) / 2) - 4}" y="${Y(sec.h - sec.tg / 2) + 3}" font-size="10" fill="${C.ink2}" text-anchor="end">tf = ${f1(sec.tg)}</text>`;
  if (!sec.sym) g += `<text x="${X(-sec.bd / 2) - 4}" y="${Y(sec.td / 2) + 3}" font-size="10" fill="${C.ink2}" text-anchor="end">tf = ${f1(sec.td)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H + 10}" width="${W}" height="${H + 10}" role="img" aria-label="Przekrój">${g}</svg>`;
};

/* ---------------------------------------------------------- postać zwichrzenia */
D.mode = function (mode, L, sup, o) {
  o = o || {};
  if (!mode) return '<p class="hint">Brak postaci własnej (αcr = ∞).</p>';
  let um = 1e-30, pm = 1e-30;
  mode.u.forEach(v => { um = Math.max(um, Math.abs(v)); }); mode.phi.forEach(v => { pm = Math.max(pm, Math.abs(v)); });
  const sgn = Math.abs(Math.min(...mode.u)) > Math.max(...mode.u) ? -1 : 1;
  return D.plot({ xs: mode.xs, L, width: o.width, height: o.height || 150, title: o.title || 'Postać zwichrzenia (znormalizowana)', down: false, dec: 2, sup,
    series: [{ y: mode.u.map(v => sgn * v / um), col: C.V, name: 'u – przemieszczenie boczne ŚŚ', lab: false }, { y: mode.phi.map(v => sgn * v / pm), col: C.M, name: 'φ – kąt skręcenia', dash: '5 3', lab: false }] });
};

/* ---------------------------------------------------------- pożar: θ(t) */
D.fire = function (fr, o) {
  o = o || {};
  const W = o.width || 520, H = o.height || 230, pL = 44, pR = 14, pT = 22, pB = 30;
  const tmax = fr.hist[fr.hist.length - 1][0], Tm = 1200;
  const X = (t) => pL + (W - pL - pR) * t / tmax, Y = (T) => H - pB - (H - pT - pB) * T / Tm;
  let g = '';
  [0, 200, 400, 600, 800, 1000, 1200].forEach(T => { g += `<line x1="${pL}" y1="${Y(T)}" x2="${W - pR}" y2="${Y(T)}" stroke="${C.line}" stroke-width=".6"/><text x="${pL - 4}" y="${Y(T) + 3}" font-size="9" text-anchor="end" fill="${C.ink3}">${T}</text>`; });
  for (let t = 0; t <= tmax; t += 30) g += `<text x="${X(t)}" y="${H - pB + 13}" font-size="9" text-anchor="middle" fill="${C.ink3}">${t}</text>`;
  const pg = fr.hist.map((r, i) => (i ? 'L' : 'M') + X(r[0]).toFixed(1) + ' ' + Y(r[2]).toFixed(1)).join(' ');
  const pa = fr.hist.map((r, i) => (i ? 'L' : 'M') + X(r[0]).toFixed(1) + ' ' + Y(r[1]).toFixed(1)).join(' ');
  g += `<path d="${pg}" fill="none" stroke="${C.M}" stroke-width="1.4" stroke-dasharray="5 3"/><path d="${pa}" fill="none" stroke="${C.V}" stroke-width="1.8"/>`;
  g += `<line x1="${pL}" y1="${Y(fr.thcr)}" x2="${W - pR}" y2="${Y(fr.thcr)}" stroke="${C.z}" stroke-dasharray="3 3"/><text x="${W - pR}" y="${Y(fr.thcr) - 4}" font-size="10" text-anchor="end" fill="${C.z}">θa,cr = ${U.fmt(fr.thcr, 0)} °C</text>`;
  g += `<line x1="${X(fr.Rreq)}" y1="${pT}" x2="${X(fr.Rreq)}" y2="${H - pB}" stroke="${C.ink2}" stroke-dasharray="2 3"/><text x="${X(fr.Rreq) + 3}" y="${pT + 10}" font-size="10" fill="${C.ink2}">R${fr.Rreq}</text>`;
  g += `<text x="${pL}" y="14" font-size="11.5" font-weight="650" fill="${C.ink}">Temperatura gazów (ISO 834) i stali θa(t)</text><text x="${W - pR}" y="${H - 4}" font-size="9.5" text-anchor="end" fill="${C.ink3}">t [min]</text><text x="6" y="${pT}" font-size="9.5" fill="${C.ink3}">θ [°C]</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Krzywe nagrzewania">${g}</svg>`;
};

/* ---------------------------------------------------------- połączenie (widok) */
D.joint = function (sec, w) {
  const W = 280, H = 230, sc = 160 / Math.max(sec.h, 1), cx = 140, cy = 115;
  let g = '';
  const hh = sec.h * sc, yt = cy - hh / 2;
  g += `<rect x="${cx - 6}" y="${yt}" width="${W - cx}" height="${sec.tg * sc}" fill="var(--secfill,#c9d3e3)" stroke="${C.ink}"/><rect x="${cx - 6}" y="${yt + hh - sec.td * sc}" width="${W - cx}" height="${sec.td * sc}" fill="var(--secfill,#c9d3e3)" stroke="${C.ink}"/><rect x="${cx - 6}" y="${yt + sec.tg * sc}" width="${W - cx}" height="${hh - (sec.tg + sec.td) * sc}" fill="var(--panel2)" stroke="${C.ink3}" stroke-width=".6"/>`;
  if (w.typ === 'blacha_czolowa' || w.typ === 'blacha_zebrowa') {
    const hp = U.num(w.hp) * sc, tp = Math.max(3, U.num(w.tp) * sc);
    const yp = cy - hp / 2;
    if (w.typ === 'blacha_czolowa') {
      g += `<rect x="${cx - 6 - tp}" y="${yp}" width="${tp}" height="${hp}" fill="var(--acc2)" stroke="${C.acc}"/>`;
      const nr = Math.max(1, Math.round(U.num(w.nr))); const e1 = U.num(w.e1) * sc, p1 = U.num(w.p1) * sc;
      for (let i = 0; i < nr; i++) g += `<rect x="${cx - 6 - tp - 10}" y="${yp + e1 + i * p1 - 3}" width="${tp + 20}" height="6" fill="${C.ink}" opacity=".75"/>`;
      g += `<rect x="${cx - 40}" y="10" width="${34 - tp}" height="${H - 20}" fill="var(--panel2)" stroke="${C.ink3}"/><text x="${cx - 23 - tp / 2}" y="${H - 14}" font-size="9" text-anchor="middle" fill="${C.ink3}" transform="rotate(-90 ${cx - 23 - tp / 2} ${H - 14})" dx="40">podpora</text>`;
    } else {
      const z = U.num(w.z) * sc;
      g += `<rect x="${cx - 40}" y="10" width="34" height="${H - 20}" fill="var(--panel2)" stroke="${C.ink3}"/><rect x="${cx - 6}" y="${yp}" width="${z + U.num(w.e2) * sc}" height="${hp}" fill="var(--acc2)" fill-opacity=".8" stroke="${C.acc}"/>`;
      const n = Math.max(1, Math.round(U.num(w.n))); const e1 = U.num(w.e1) * sc, p1 = U.num(w.p1) * sc;
      for (let i = 0; i < n; i++) g += `<circle cx="${cx - 6 + z}" cy="${yp + e1 + i * p1}" r="${Math.max(2.5, 8 * sc)}" fill="${C.ink}" opacity=".8"/>`;
    }
  } else if (w.typ === 'oparcie') {
    g += `<rect x="${cx - 30}" y="${yt + hh}" width="${Math.max(30, U.num(w.lp) * sc)}" height="${Math.max(3, U.num(w.tp) * sc)}" fill="var(--acc2)" stroke="${C.acc}"/><rect x="${cx - 60}" y="${yt + hh + Math.max(3, U.num(w.tp) * sc)}" width="${120}" height="${H - (yt + hh) - 10}" fill="var(--panel2)" stroke="${C.ink3}"/>`;
    if (w.zebro) g += `<rect x="${cx + 10}" y="${yt + sec.tg * sc}" width="${Math.max(3, U.num(w.ts) * sc)}" height="${hh - (sec.tg + sec.td) * sc}" fill="var(--acc2)" stroke="${C.acc}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Szkic węzła">${g}</svg>`;
};

})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* src/ui/widoki.js */
/* =====================================================================
   BelkaStal – widoki zakładek wyników
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U, D = BS.D, K = BS.K, S0 = BS.S;
const V = BS.V = {};
const esc = U.esc;
const kN = (v) => U.fmt(v / 1e3, 1), kNm = (v) => U.fmt(v / 1e6, 1);
V.unitFmt = function (v, unit) {
  if (v === null || v === undefined) return '—';
  if (v === Infinity) return '∞';
  switch (unit) {
    case 'M': return U.fmt(v / 1e6, 1) + ' kNm';
    case 'F': return U.fmt(v / 1e3, 1) + ' kN';
    case 'q': return U.fmt(v, 1) + ' N/mm';
    case 'mm': return U.fmt(v, 1) + ' mm';
    case 'Hz': return U.fmt(v, 2) + ' Hz';
    case 'min': return U.fmt(v, 1) + ' min';
    case 'MPa': return U.fmt(v, 1) + ' MPa';
    default: return U.fmt(v, 3);
  }
};
V.ub = function (u, st) {
  if (u === null || u === undefined) return '<span class="hint">—</span>';
  const w = isFinite(u) ? Math.min(100, u * 100) : 100;
  return `<span class="ub ${st === 'fail' ? 'fail' : st === 'warn' || u > 0.9 ? 'warn' : ''}"><i style="width:${w}%"></i></span><span class="pct">${isFinite(u) ? Math.round(u * 100) + '%' : '∞'}</span>`;
};
V.stBadge = (st) => `<span class="st ${st}">${st === 'ok' ? 'OK' : st === 'fail' ? 'NIE' : st === 'warn' ? 'UWAGA' : 'INFO'}</span>`;
const noRes = (R) => (!R || !R.md ? `<div class="msg err">${R && R.errors ? R.errors.map(esc).join('<br>') : 'Brak wyników.'}</div>` : '');

/* ---------------------------------------------------------- przekrój */
V.sec = function (S, R) {
  if (!R || !R.sec) return noRes(R);
  const s = R.sec, b = R.base, m = R.mat;
  let h = `<div class="h2">${esc(s.nazwa)} <small>${esc(m.gatunek)}${esc(m.podgatunek)} · fy = ${m.fy} MPa, fu = ${m.fu} MPa (${esc(m.zr)}) · ε = ${U.fmt(b.eps, 3)}</small></div><div class="flex">`;
  h += `<div class="box"><h4>Przekrój</h4>${D.section(s, { size: 300, eff: b.effNeg || b.effPos })}${(b.effNeg || b.effPos) ? '<p class="hint">Kolor czerwony – części nieefektywne (kl. 4, PN-EN 1993-1-5, 4.4).</p>' : ''}</div>`;
  const row = (a, v, u) => `<tr><td>${a}</td><td>${v}</td><td>${u || ''}</td></tr>`;
  h += `<div class="box"><h4>Charakterystyki geometryczne</h4><table class="kv">${row('A', U.fmt(s.A / 100, 2), 'cm²')}${row('I<sub>y</sub>', U.fmt(s.Iy / 1e4, 0), 'cm⁴')}${row('I<sub>z</sub>', U.fmt(s.Iz / 1e4, 1), 'cm⁴')}${row('W<sub>el,y</sub> (góra / dół)', U.fmt(s.Wel_t / 1e3, 1) + ' / ' + U.fmt(s.Wel_b / 1e3, 1), 'cm³')}${row('W<sub>pl,y</sub>', U.fmt(s.Wpl_y / 1e3, 1), 'cm³')}${row('W<sub>el,z</sub> / W<sub>pl,z</sub>', U.fmt(s.Wel_z / 1e3, 1) + ' / ' + U.fmt(s.Wpl_z / 1e3, 1), 'cm³')}${row('i<sub>y</sub> / i<sub>z</sub>', U.fmt(s.iy / 10, 2) + ' / ' + U.fmt(s.iz / 10, 2), 'cm')}${row('I<sub>t</sub>', U.fmt(s.It / 1e4, 2), 'cm⁴')}${row('I<sub>w</sub>', U.fmt(s.Iw / 1e9, 1), '×10³ cm⁶')}${row('A<sub>v,z</sub>', U.fmt(b.Av / 100, 2), 'cm²')}${row('z<sub>c</sub> / z<sub>s</sub> (od spodu)', U.fmt(s.zc, 1) + ' / ' + U.fmt(s.zs, 1), 'mm')}${!s.sym ? row('β<sub>z</sub> (monosymetria)', U.fmt(s.betaZ, 1), 'mm') : ''}${row('masa / g<sub>k</sub>', U.fmt(s.masa, 1) + ' / ' + U.fmt(s.gk, 3), 'kg/m / kN/m')}</table><p class="hint">Z geometrii (wymiary PN-EN 10365${s.typ === 'walc' ? ', zaokrąglenia r' : ', spoiny pominięte'}); I<sub>t</sub> ${s.typ === 'walc' ? 'wzorem dla kształtowników walcowanych z zaokrągleniami' : '= Σ b·t³/3'}.</p></div>`;
  // klasyfikacja
  const cls = (k, t) => `<h4>${t}: klasa ${k.cls}</h4><table class="grid"><tr><th>Ścianka</th><th>c [mm]</th><th>t [mm]</th><th>c/t</th><th>granice kl. 1/2/3</th><th>klasa</th></tr>${k.all.map(p => `<tr><td>${esc(p.n)}${p.alpha !== undefined && p.typ === 'wewnętrzna' ? ` <span class="hint">α = ${U.fmt(p.alpha, 3)}, ψ = ${isFinite(p.psi) ? U.fmt(p.psi, 3) : '—'}</span>` : ''}</td><td class="n">${U.fmt(p.c, 1)}</td><td class="n">${U.fmt(p.t, 1)}</td><td class="n">${U.fmt(p.ct, 2)}</td><td class="n">${p.lim.map(l => isFinite(l) ? U.fmt(l, 1) : '—').join(' / ')}</td><td class="n"><b>${p.cls}</b></td></tr>`).join('')}</table>`;
  h += `<div class="box" style="flex:1 1 420px"><h4>Klasyfikacja (PN-EN 1993-1-1, tabl. 5.2)</h4>${cls(b.kPos, 'Zginanie M > 0 (ściskany pas górny)')}${cls(b.kNeg, 'Zginanie M < 0 (ściskany pas dolny)')}${cls(b.kN, 'Ściskanie osiowe')}</div>`;
  // nośności
  h += `<div class="box"><h4>Nośności obliczeniowe przekroju</h4><table class="kv">${row('M<sub>c,Rd</sub> (M > 0)', kNm(b.Mc_pos), 'kNm')}${row('M<sub>c,Rd</sub> (M < 0)', kNm(b.Mc_neg), 'kNm')}${row('M<sub>pl,Rd</sub>', kNm(b.Mpl_pos), 'kNm')}${row('M<sub>c,z,Rd</sub>', kNm(b.Mcz), 'kNm')}${row('V<sub>pl,z,Rd</sub>', kN(b.Vpl), 'kN')}${row('N<sub>pl,Rd</sub> / N<sub>c,Rd</sub>', kN(b.Npl) + ' / ' + kN(b.Nc), 'kN')}${row('M<sub>f,Rd</sub> (pasy)', kNm(b.Mf), 'kNm')}${row('h<sub>w</sub>/t<sub>w</sub>', U.fmt(R.sb.ht, 1), `granica ${U.fmt(R.sb.limit, 1)}`)}${R.sb.need ? row('V<sub>b,Rd</sub> (wyboczenie przy ścinaniu)', kN(R.sb.Vb), `χw = ${U.fmt(R.sb.chi, 3)}`) : ''}</table>`;
  [['effPos', 'M > 0'], ['effNeg', 'M < 0'], ['effN', 'ściskanie']].forEach(([k, t]) => {
    const e = b[k]; if (!e) return;
    h += `<p class="hint"><b>Przekrój efektywny (${t})</b>: ${e.info.map(i => `${esc(i.el)}: λ̄p = ${U.fmt(i.lp, 3)}, kσ = ${U.fmt(i.kS, 2)}, ρ = ${U.fmt(i.rho, 3)}`).join('; ')} → A<sub>eff</sub> = ${U.fmt(e.A / 100, 2)} cm²${e.Weff ? `, W<sub>eff,min</sub> = ${U.fmt(e.Weff / 1e3, 1)} cm³` : ''}</p>`;
  });
  h += '</div></div>';
  return h;
};

/* ---------------------------------------------------------- wykresy */
V.chart = function (S, R, o) {
  if (!R || !R.md) return noRes(R);
  const md = R.md, s = o.etap, an = R.an, ev = R.env[s];
  const sup = md.systems[s].map(p => p.x);
  let h = `<div class="bar"><b class="h2" style="margin:0">Siły wewnętrzne i ugięcia – ${esc(md.etapy[s].nazwa)}</b><span class="sp"></span>${o.stageSeg}</div>`;
  h += `<div class="box">${D.scheme(S, md, { etap: s, width: 900 })}</div>`;
  const P = (o2) => `<div class="box">${D.plot(Object.assign({ xs: an.xs, L: md.L, width: 900, height: 210, sup }, o2))}</div>`;
  h += P({ title: 'Momenty zginające M_Ed [kNm] – obwiednia SGN (rysowane po stronie włókien rozciąganych)', unit: 'kNm', scale: 1e-6, series: [{ y: ev.Mmax, col: D.C.M, fill: true, name: 'max' }, { y: ev.Mmin, col: D.C.M, fill: true, dash: '4 2', name: 'min' }] });
  h += P({ title: 'Siły poprzeczne V_Ed [kN] – obwiednia SGN', unit: 'kN', scale: 1e-3, down: false, series: [{ y: ev.Vmax, col: D.C.V, fill: true, name: 'max' }, { y: ev.Vmin, col: D.C.V, fill: true, dash: '4 2', name: 'min' }] });
  if (Math.max(...ev.Mzmax.map(Math.abs), ...ev.Mzmin.map(Math.abs)) > 1) h += P({ title: 'Momenty M_z,Ed [kNm] – płaszczyzna pozioma', unit: 'kNm', scale: 1e-6, series: [{ y: ev.Mzmax, col: D.C.z, fill: true }, { y: ev.Mzmin, col: D.C.z, fill: true }] });
  if (isFinite(ev.Nmax) && (Math.abs(ev.Nmax) > 1 || Math.abs(ev.Nmin) > 1)) h += `<div class="msg inf">Siła osiowa N<sub>Ed</sub> (stała na długości): od ${kN(ev.Nmin)} do ${kN(ev.Nmax)} kN (+ rozciąganie).</div>`;
  h += P({ title: 'Ugięcia w [mm] – obwiednia kombinacji charakterystycznych', unit: 'mm', dec: 1, series: [{ y: ev.wmax, col: D.C.w, fill: true, name: 'max' }, { y: ev.wmin, col: D.C.w, dash: '4 2', name: 'min' }].concat(s === md.nE - 1 && R.sgu && R.sgu.wcMax > 0 ? [{ y: R.sgu.wc, col: D.C.ink3, dash: '2 3', name: 'podniesienie wc', lab: false }] : []) });
  // reakcje
  h += `<div class="box"><h4>Reakcje podpór – etap ${s + 1}</h4><table class="grid"><tr><th>Podpora</th><th>x [m]</th><th>R<sub>Ed,max</sub> [kN]</th><th>R<sub>Ed,min</sub> [kN]</th><th>|M<sub>Ed</sub>| [kNm]</th><th>R<sub>y,Ed</sub> [kN]</th>${Object.keys(an.res[s]).map(k => `<th>R<sub>k</sub> ${esc(an.res[s][k].c.id)}</th>`).join('')}<th>EQU R<sub>min</sub> [kN]</th></tr>`;
  md.systems[s].forEach(p => {
    const r = ev.R[p.id] || {}; const eq = (R.equ || []).find(z => z.id === p.id && z.etap === s);
    h += `<tr><td><b>${esc(p.id)}</b>${p.tymcz ? ' (tymcz.)' : ''}</td><td class="n">${U.fmt(p.x / 1000, 2)}</td><td class="n">${kN(r.max)}</td><td class="n">${kN(r.min)}</td><td class="n">${kNm(r.Mmax || 0)}</td><td class="n">${kN(r.Rymax || 0)}</td>${Object.keys(an.res[s]).map(k => { const q = an.res[s][k].tot.R[p.id]; return `<td class="n">${q ? kN(q.R) : '—'}</td>`; }).join('')}<td class="n"${eq && eq.Rmin < 0 ? ' style="color:var(--fail);font-weight:700"' : ''}>${eq ? kN(eq.Rmin) : '—'}</td></tr>`;
  });
  h += '</table><p class="hint">R<sub>k</sub> – reakcje charakterystyczne od przypadków (z historią etapów); dodatnie – docisk. EQU – γ<sub>G,sup</sub> = 1,10 / γ<sub>G,inf</sub> = 0,90 dla części G w segmentach, zmienne niekorzystne γ<sub>Q</sub> = 1,5.</p></div>';
  // wykresy od przypadków
  h += '<details class="box"><summary><b>Wykresy charakterystyczne od poszczególnych przypadków</b></summary>';
  Object.keys(an.res[s]).forEach(k => { const r = an.res[s][k]; h += D.plot({ xs: an.xs, L: md.L, width: 900, height: 150, sup, title: `${r.c.id} – ${r.c.nazwa}: M_k [kNm]`, scale: 1e-6, series: [{ y: r.tot.M, col: D.loadColor(r.c), fill: true }] }); });
  h += '</details>';
  return h;
};

/* ---------------------------------------------------------- stateczność */
V.ltb = function (S, R, o) {
  if (!R || !R.md) return noRes(R);
  const md = R.md, s = o.etap, L = R.ltb[s];
  let h = `<div class="bar"><b class="h2" style="margin:0">Zwichrzenie i interakcja – ${esc(md.etapy[s].nazwa)}</b><span class="sp"></span>${o.stageSeg}</div>`;
  if (!L) return h + '<p class="hint">Brak momentów zginających w tym etapie.</p>';
  h += `<div class="box">${D.scheme(S, md, { etap: s, width: 900 })}</div>`;
  h += `<div class="msg inf">Metoda: χ<sub>LT</sub> wg ${L.met === '6.3.2.3' ? '6.3.2.3 (kształtowniki walcowane i spawane równoważne), λ̄<sub>LT,0</sub> = ' + U.fmt(+R.ndp.lamLT0, 2) + ', β = ' + U.fmt(+R.ndp.betaLT, 2) : '6.3.2.2 (przypadek ogólny)' }. M<sub>cr</sub> – MES (4 st. swobody w węźle: u, u′, φ, φ′; ${md.xl.length - 1} elementów) dla rozkładu M<sub>y</sub> z kombinacji SGN; α<sub>cr</sub> dotyczy całej belki, M<sub>cr,seg</sub> = α<sub>cr</sub>·|M<sub>Ed,max,seg</sub>|.</div>`;
  h += `<div class="box"><h4>Kombinacje analizowane (najbardziej wytężające segmenty)</h4><table class="grid"><tr><th>Kombinacja</th><th>α<sub>cr</sub></th><th>|M<sub>Ed</sub>|<sub>max</sub> [kNm]</th></tr>${L.runs.map(r => `<tr><td>${esc(r.combo.opis)}</td><td class="n">${r.err ? '<span style="color:var(--fail)">' + esc(r.err) + '</span>' : r.lam === Infinity ? '∞' : U.fmt(r.lam, 3)}</td><td class="n">${kNm(Math.max(...Array.from(r.E.M).map(Math.abs)))}</td></tr>`).join('')}</table></div>`;
  h += `<div class="box"><h4>Segmenty zwichrzeniowe</h4><table class="grid"><tr><th>Segment [m]</th><th>|M<sub>Ed</sub>| [kNm]</th><th>M<sub>cr</sub> [kNm]</th><th>λ̄<sub>LT</sub></th><th>krzywa</th><th>χ<sub>LT</sub></th><th>k<sub>c</sub> / f</th><th>χ<sub>LT,mod</sub></th><th>M<sub>b,Rd</sub> [kNm]</th><th>wytężenie</th></tr>`;
  L.segs.forEach(g => {
    if (g.brak) { h += `<tr><td>${U.fmt(g.sg.x0 / 1000, 2)}–${U.fmt(g.sg.x1 / 1000, 2)}</td><td colspan="9" class="hint">brak momentu</td></tr>`; return; }
    const l = g.ltb;
    h += `<tr><td>${U.fmt(g.sg.x0 / 1000, 2)}–${U.fmt(g.sg.x1 / 1000, 2)}${g.sg.free ? ' (wspornik)' : ''}</td><td class="n">${kNm(g.sh.mabs)} ${g.Mpos ? '(+)' : '(−)'}</td><td class="n">${g.Mcr === Infinity ? '∞' : kNm(g.Mcr)}</td><td class="n">${U.fmt(g.lam, 3)}</td><td class="n">${l.curve} (α = ${U.fmt(l.alLT, 2)})</td><td class="n">${U.fmt(l.chi, 3)}</td><td class="n">${l.skip ? '—' : U.fmt(l.kc, 3) + ' / ' + U.fmt(l.f, 3)}</td><td class="n">${U.fmt(l.chimod, 3)}${l.skip ? ' <span class="hint">(λ̄ ≤ λ̄₀)</span>' : ''}</td><td class="n">${kNm(g.Mb)}</td><td>${V.ub(g.u, g.u > 1 ? 'fail' : 'ok')}</td></tr>`;
    if (l.kcSrc) h += `<tr><td></td><td colspan="9" class="hint">${esc(l.kcSrc)} · ${esc(g.combo.opis)}</td></tr>`;
  });
  h += '</table></div>';
  const gov = L.runs.filter(r => r.mode).sort((a, b) => a.lam - b.lam)[0];
  if (gov && gov.lam <= 100) h += `<div class="box">${D.mode(gov.mode, md.L, md.systems[s].map(p => p.x), { width: 900, title: `Postać zwichrzenia – α_cr = ${U.fmt(gov.lam, 3)} (${gov.combo.opis.slice(0, 80)})` })}</div>`;
  else if (gov) h += `<div class="msg inf">α<sub>cr</sub> = ${U.fmt(gov.lam, 1)} > 100 – zwichrzenie praktycznie wykluczone (np. ściskany pas stężony ciągle); postaci własnej nie pokazano.</div>`;
  if (L.inter.length) {
    h += `<div class="box"><h4>Interakcja N + M<sub>y</sub> + M<sub>z</sub> (6.3.3, zał. B)</h4><table class="grid"><tr><th>Segment</th><th>N<sub>Ed</sub> [kN]</th><th>M<sub>y</sub> / M<sub>z</sub> [kNm]</th><th>χ<sub>y</sub> / χ<sub>z</sub> / χ<sub>T</sub></th><th>χ<sub>LT</sub></th><th>C<sub>my</sub> / C<sub>mz</sub> / C<sub>mLT</sub></th><th>k<sub>yy</sub> / k<sub>yz</sub> / k<sub>zy</sub> / k<sub>zz</sub></th><th>(6.61)</th><th>(6.62)</th></tr>`;
    L.inter.forEach(it => { h += `<tr><td>${U.fmt(it.sg.x0 / 1000, 2)}–${U.fmt(it.sg.x1 / 1000, 2)}</td><td class="n">${kN(it.Nc)}</td><td class="n">${kNm(it.My)} / ${kNm(it.Mz)}</td><td class="n">${[it.chiy, it.chiz, it.chiT].map(v => U.fmt(v, 3)).join(' / ')}</td><td class="n">${U.fmt(it.chiLT, 3)}</td><td class="n">${[it.Cmy, it.Cmz, it.CmLT].map(v => U.fmt(v, 3)).join(' / ')}</td><td class="n">${[it.kyy, it.kyz, it.kzy, it.kzz].map(v => U.fmt(v, 3)).join(' / ')}</td><td>${V.ub(it.u61, it.u61 > 1 ? 'fail' : 'ok')}</td><td>${V.ub(it.u62, it.u62 > 1 ? 'fail' : 'ok')}</td></tr>`; });
    h += '</table></div>';
  }
  return h;
};

/* ---------------------------------------------------------- podpory i połączenia */
V.sup = function (S, R) {
  if (!R || !R.md) return noRes(R);
  let h = '<div class="h2">Podpory, oparcia i połączenia</div>';
  (R.podpory || []).forEach(p => {
    h += `<div class="box" style="margin-bottom:14px"><h4>Podpora ${esc(p.id)}${p.tymcz ? ' (tymczasowa)' : ''} – x = ${U.fmt(p.x / 1000, 2)} m · ${esc(({ przegub: 'przegubowa', utwierdzenie: 'utwierdzenie', sprezyna: 'sprężysta', podatne: 'podatna' })[p.typ] || p.typ)} · węzeł: ${esc(({ brak: 'oparcie na elemencie stalowym', oparcie: 'oparcie na płycie', blacha_czolowa: 'krótka blacha czołowa', blacha_zebrowa: 'blacha żebrowa' })[(p.wezel || {}).typ] || '—')}</h4><div class="flex">`;
    h += `<div>${D.joint(R.sec, p.wezel || {})}</div><div style="flex:1 1 380px">`;
    h += `<table class="kv"><tr><td>R<sub>Ed,max</sub> (SGN, etap ${p.etapMax + 1})</td><td>${kN(p.Rmax)}</td><td>kN</td></tr><tr><td>|M<sub>Ed</sub>| nad podporą</td><td>${kNm(p.Mmax)}</td><td>kNm</td></tr>${p.equ.map(e => `<tr><td>EQU R<sub>min</sub> – etap ${e.etap + 1}</td><td${e.Rmin < 0 ? ' style="color:var(--fail)"' : ''}>${kN(e.Rmin)}</td><td>kN${e.Rmin < 0 ? ' (odrywanie)' : ''}</td></tr>`).join('')}</table>`;
