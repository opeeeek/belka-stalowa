<style id="appcss">/* Układ: aplikacja dwupanelowa – dane po lewej, wyniki po prawej; na telefonie przełącznik Dane / Wyniki. */
:root {
  --bg: #eef0f3; --panel: #ffffff; --panel2: #f7f8fa; --line: #d9dde3; --line2: #e8ebef;
  --ink: #1b2230; --ink2: #4a5466; --ink3: #7a8494;
  --acc: #1d5bb8; --acc2: #e8f0fc; --acc3: #0f3f86; --onacc: #ffffff; --focus: #8fb2ea;
  --ok: #1d7f3c; --okbg: #e6f4ea; --warn: #a35d00; --warnbg: #fdf1dc; --fail: #c0262d; --failbg: #fde8e8; --info: #5b6576; --infobg: #eef0f3;
  --errln: #f3c2c4; --wrnln: #f0d6a8; --ubbg: #edf0f3; --ubwarn: #d89a2b;
  --field: #ffffff; --hover: #e3e7ed; --grp: #f2f5f9; --itembg: #fbfcfe; --addln: #a9c3ec; --addhov: #d6e5fb; --dashln: #b9c6da;
  --shadow: rgba(20, 30, 50, .18); --scrim: rgba(15, 22, 35, .45); --toastbg: #1d2636; --toastink: #ffffff;
  --hdr: #172235; --hdr2: #22314b; --hdrln: #34486b; --hdrhov: #24344f; --hdrbot: #0b1220;
  --hdrink: #e9eef6; --hdrink2: #dbe4f2; --hdrmut: #8ea2c2; --hdrtag: #b8c7de; --hdrtagln: #4e6386; --hdrfocus: #5d8fe0;
  --stok: #1f6b3a; --stfail: #a8232a; --stwarn: #8a5300; --onst: #ffffff;
  --brand1: #dfe6f1; --brand2: #9fb3d4; --brand3: #b5413f; --brand4: #172235; --brand5: #3b5b8f; --cM: #c0262d; --cV: #1d5bb8; --cW: #1d7f3c; --cZ: #8a5300; --secfill: #c9d3e3;
  --mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --ui: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Liberation Sans", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
    --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
    --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
    --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
    --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
    --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
    --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
  --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
  --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
  --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
  --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
  --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
  --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
  --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--ui); color: var(--ink); background: var(--bg); overflow: hidden; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hdr); }
button { font: inherit; }
sub, sup { font-size: 72%; line-height: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- pasek górny */
#top { min-height: 50px; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; background: var(--hdr); color: var(--hdrink); border-bottom: 1px solid var(--hdrbot); }
.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; white-space: nowrap; }
.brand b { font-weight: 650; letter-spacing: .2px; }
.brand .tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--hdrtagln); border-radius: 3px; color: var(--hdrtag); }
#projName { width: 190px; background: var(--hdr2); border: 1px solid var(--hdrln); color: var(--hdrink); padding: 5px 8px; border-radius: 4px; font: inherit; }
#projName:focus { outline: 2px solid var(--hdrfocus); outline-offset: -1px; }
.tb { display: flex; gap: 4px; align-items: center; }
.tb button { background: transparent; color: var(--hdrink2); border: 1px solid transparent; padding: 6px 9px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.tb button:hover { background: var(--hdrhov); border-color: var(--hdrln); }
.tb button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.tb .sep { width: 1px; height: 22px; background: var(--hdrln); margin: 0 4px; }
#status { margin-left: auto; padding: 6px 12px; border-radius: 4px; font-weight: 600; white-space: nowrap; font-size: 13px; color: var(--onst); background: var(--hdr2); }
#status.ok { background: var(--stok); } #status.fail { background: var(--stfail); } #status.warn { background: var(--stwarn); }
#fileName { color: var(--hdrmut); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- układ */
main { display: flex; height: calc(100% - 50px); }
#inputs { min-width: 0; columns: 3 330px; column-gap: 14px; }
#inputs details.grp { break-inside: avoid; display: block; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.datawrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
#dataside { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }
#dataside .box { padding: 10px 12px; }
#dataside .schemewrap svg { width: 100%; height: auto; }
#dataside .hint { margin: 6px 0 0; }
.schemesvg .supp { cursor: pointer; }
.schemesvg .supp:hover .suphl { fill: var(--acc2); stroke: var(--acc); }
.secedit .zhit { cursor: pointer; }
.secedit .zhit:hover { fill: var(--acc); fill-opacity: .14; stroke: var(--acc); stroke-dasharray: 4 3; }
.rebbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.rebbar .ttl { font-weight: 650; color: var(--acc3); margin-right: 4px; font-size: 12.5px; }
.rebbar select { width: auto; height: 28px; }
.zed { display: flex; flex-direction: column; gap: 8px; }
.zed .zl { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel2); }
.zed .zl h5 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); display: flex; align-items: center; gap: 8px; }
.zed .zl h5 .sp { flex: 1; }
.zed .zg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 3px 0; font-size: 12.5px; color: var(--ink2); }
.zed .zg select { width: auto; height: 26px; }
.zed .zg .txt { height: 26px; width: 74px; text-align: right; }
.zed .zg .txt.wide { width: 220px; text-align: left; }
.zed .iss { font-size: 12px; color: var(--fail); }
.zed .okm { font-size: 12px; color: var(--ok); }
.dlg.zpop { max-width: 980px !important; }
.zpop .zcols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.zpop .zprev { position: sticky; top: 0; }
.zpop .fields { display: block; }
.suppop .zg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
.suppop label.rad { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; flex: 1 1 180px; }
.suppop label.rad.on { border-color: var(--acc); background: var(--acc2); }
.suppop .txt { width: 110px; height: 28px; text-align: right; }
.suppop label.rad svg { flex: none; }
.suppop label.rad small { color: var(--ink3); }
.suptab { margin-top: 6px; }
.suptab tr { cursor: pointer; }
.suptab tr:hover td { background: var(--acc2); }
.suptab td { font-size: 12px; padding: 3px 6px; }
.kv.suptab td:nth-child(2) { text-align: left; font-weight: 400; }
.kv.suptab td:nth-child(3) { white-space: nowrap; }
.zprev table.kv td:nth-child(2) { white-space: nowrap; }
.rebbar label.vib { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); margin-left: auto; }
.rebbar label.vib.vibon { cursor: pointer; }
.rebbar label.vib.vibon + label.vib { margin-left: 0; }
.rebbar label.vib.off { opacity: 0.45; }
.rebbar .btn.sm { text-align: left; }
.dlg.fpop { max-width: 620px; }
.dlg.fpop .fields { padding: 0; }
.minisec svg { max-width: 100%; height: auto; }
.zed .hint { margin: 2px 0; }
#out { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------- formularz */
details.grp { border-bottom: 1px solid var(--line); }
details.grp > summary { list-style: none; cursor: pointer; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; font-weight: 650; font-size: 12.5px; letter-spacing: .3px; text-transform: uppercase; color: var(--acc3); background: var(--panel2); display: flex; align-items: center; gap: 8px; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); transform: rotate(-45deg); transition: transform .12s; margin-right: 2px; }
details.grp[open] > summary::before { transform: rotate(45deg); }
.fields { padding-block: 6px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.row { display: grid; grid-template-columns: 1fr 156px 38px; align-items: center; gap: 6px; min-height: 30px; }
.row label { color: var(--ink2); font-size: 12.5px; }
.row .unit { color: var(--ink3); font-size: 11.5px; }
.row.wide { grid-template-columns: 1fr 218px; }
.hint { font-size: 11.5px; color: var(--ink3); margin: 0 0 6px; padding-left: 2px; }
.hint b { color: var(--ink2); font-weight: 600; }
select, .combo input, .txt, .mtab input { height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); font: inherit; color: var(--ink); padding: 0 6px; width: 100%; }
select:focus, .combo input:focus, .txt:focus, .mtab input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--acc); }
select { padding-right: 2px; }
.combo { display: flex; position: relative; }
.combo input { border-radius: 4px 0 0 4px; text-align: right; padding-right: 6px; }
.combo button { width: 24px; border: 1px solid var(--line); border-left: 0; background: var(--panel2); border-radius: 0 4px 4px 0; cursor: pointer; color: var(--ink2); padding: 0; }
.combo button:hover { background: var(--acc2); }
.combo input.bad, .txt.bad, .mtab input.bad { border-color: var(--fail); background: var(--failbg); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 28px; color: var(--ink2); font-size: 12.5px; cursor: pointer; }
.chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--acc); flex: none; }
.barrow { display: grid; grid-template-columns: 1fr 60px 14px 74px 38px; align-items: center; gap: 4px; min-height: 30px; }
.barrow .x { text-align: center; color: var(--ink3); }
.barrow label { color: var(--ink2); font-size: 12.5px; }
.mtab { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
.mtab th { font-weight: 500; color: var(--ink3); font-size: 11.5px; padding: 2px; text-align: center; }
.mtab td { padding: 2px; }
.mtab td:first-child { color: var(--ink2); font-size: 12px; white-space: nowrap; }
.mtab input { height: 25px; text-align: right; padding: 0 5px; }
#pop { position: fixed; z-index: 130; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 18px var(--shadow); border-radius: 4px; max-height: 260px; overflow-y: auto; display: none; min-width: 120px; }
#pop div { padding: 4px 10px; cursor: pointer; text-align: right; }
#pop div:hover, #pop div.cur { background: var(--acc2); color: var(--acc3); }

/* ---------- zakładki */
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding-block: 8px 0; padding-left: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 14px; cursor: pointer; color: var(--ink2); border-radius: 5px 5px 0 0; font-weight: 550; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button.on { background: var(--panel); border-color: var(--line); color: var(--acc3); margin-bottom: -1px; }
.pane { display: none; flex: 1; overflow: auto; background: var(--panel); padding-block: 16px 30px; padding-left: 18px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pane.on { display: block; }
.tscroll { max-width: 100%; overflow-x: auto; }

/* ---------- podsumowanie */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); position: relative; overflow: hidden; min-width: 0; }
.card .t { font-size: 11.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
.card .v { font-size: 20px; font-weight: 650; margin-top: 3px; }
.card .s { font-size: 12px; color: var(--ink2); margin-top: 1px; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.card.ok::before { background: var(--ok); } .card.fail::before { background: var(--fail); } .card.warn::before { background: var(--warn); }
.msgs { margin: 0 0 14px; }
.msg { padding: 7px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 12.5px; }
.msg.err { background: var(--failbg); color: var(--fail); border: 1px solid var(--errln); }
.msg.wrn { background: var(--warnbg); color: var(--warn); border: 1px solid var(--wrnln); }
table.ctab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.ctab th { text-align: left; font-weight: 600; color: var(--ink3); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel2); position: sticky; top: -16px; z-index: 1; }
table.ctab td { padding: 5px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.ctab tr.g td { background: var(--grp); font-weight: 650; color: var(--acc3); padding-top: 9px; font-size: 12px; letter-spacing: .2px; }
table.ctab td.ref { color: var(--ink3); white-space: nowrap; font-size: 11.5px; }
table.ctab td.val { white-space: nowrap; text-align: right; font-family: var(--ui); }
table.ctab td.nt { color: var(--ink3); font-size: 11.5px; }
.ub { width: 120px; height: 8px; background: var(--ubbg); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.ub i { display: block; height: 100%; background: var(--ok); }
.ub.warn i { background: var(--ubwarn); } .ub.fail i { background: var(--fail); }
.pct { display: inline-block; width: 48px; text-align: right; margin-left: 6px; font-weight: 600; font-size: 12px; }
.st { display: inline-block; min-width: 26px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; }

  table.ctab tr { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "n s" "r r" "v b"; gap: 2px 10px; padding-block: 8px; border-bottom: 1px solid var(--line2); }
  table.ctab tr.g { display: block; padding: 0; border: 0; }

}

<script>/* src/engine/core.js */
/* =====================================================================
   BelkaStal – rdzeń silnika: przestrzeń nazw, wersja, narzędzia,
   kanoniczny JSON i SHA-256 (odtwarzalność obliczeń).
   Jednostki wewnętrzne: N, mm, MPa (N/mm²).  kN/m ≡ N/mm, kNm = 1e6 Nmm.
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS = root.BS || {};

BS.APP = 'BelkaStal';
BS.VERSION = '1.0.0';
// Wersja silnika obliczeniowego – zmienia się przy każdej zmianie wzorów,
// tabel lub algorytmów (raport podaje ją razem z sumą kontrolną danych).
BS.ENGINE = 'BS-ENG 1.0.0 (2026-11-16)';
BS.FORMAT = 'belkastal/1';

const U = BS.U = {};
U.E = 210000;           // MPa – PN-EN 1993-1-1, 3.2.6
U.G = 81000;            // MPa
U.NU = 0.3;
U.RHO = 7850;           // kg/m³
U.GAMMA_STEEL = 78.5;   // kN/m³ – PN-EN 1991-1-1, tabl. A.4 (stal)
U.g = 9.81;

U.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
U.sq = v => v * v;
U.round = (v, n) => { const p = Math.pow(10, n || 0); return Math.round(v * p) / p; };
U.sum = a => a.reduce((s, v) => s + v, 0);
U.max = a => a.reduce((m, v) => (v > m ? v : m), -Infinity);
U.min = a => a.reduce((m, v) => (v < m ? v : m), Infinity);
U.isNum = v => typeof v === 'number' && isFinite(v);
U.num = (v, d) => { const x = typeof v === 'string' ? parseFloat(v.replace(',', '.')) : +v; return isFinite(x) ? x : (d === undefined ? 0 : d); };
U.clone = o => JSON.parse(JSON.stringify(o));
U.uid = (p) => (p || 'id') + Math.random().toString(36).slice(2, 8);
// interpolacja liniowa w tablicy par [x, y] (x rosnące); poza zakresem – wartości skrajne
U.interp = (tab, x) => {
  if (x <= tab[0][0]) return tab[0][1];
  for (let i = 1; i < tab.length; i++) {
    if (x <= tab[i][0]) { const [x0, y0] = tab[i - 1], [x1, y1] = tab[i]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0); }
  }
  return tab[tab.length - 1][1];
};

/* ---- formatowanie liczb po polsku (przecinek dziesiętny) */
U.fmt = (v, n) => {
  if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return '—';
  if (v === Infinity) return '∞';
  if (v === -Infinity) return '−∞';
  const d = n === undefined ? 2 : n;
  let s = (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d);
  s = s.replace('-', '−').replace('.', ',');
  // separator tysięcy (wąska spacja) dla dużych liczb
  const parts = s.split(',');
  if (Math.abs(v) >= 10000) parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return parts.join(',');
};
// liczba cyfr znaczących ~3–4
U.fmtS = (v) => {
  if (!U.isNum(v)) return U.fmt(v);
  const a = Math.abs(v);
  if (a >= 1000) return U.fmt(v, 0);
  if (a >= 100) return U.fmt(v, 1);
  if (a >= 10) return U.fmt(v, 2);
  if (a >= 1) return U.fmt(v, 3);
  if (a === 0) return '0';
  return U.fmt(v, 4);
};
U.pct = (v) => (U.isNum(v) ? Math.round(v * 100) + '%' : '—');
U.esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---- kanoniczny JSON: klucze sortowane, liczby w postaci JS – stała reprezentacja danych */
U.canon = function canon(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined && !k.startsWith('_')).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
};

/* ---- SHA-256 (FIPS 180-4), synchronicznie – wynik jako hex */
U.sha256 = function (str) {
  const utf8 = unescape(encodeURIComponent(str));
  const bytes = new Uint8Array(utf8.length);
  for (let i = 0; i < utf8.length; i++) bytes[i] = utf8.charCodeAt(i);
  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
  const l = bytes.length, nBlk = ((l + 9 + 63) >> 6);
  const m = new Uint8Array(nBlk * 64); m.set(bytes); m[l] = 0x80;
  const bitLen = l * 8;
  m[m.length - 4] = (bitLen >>> 24) & 255; m[m.length - 3] = (bitLen >>> 16) & 255; m[m.length - 2] = (bitLen >>> 8) & 255; m[m.length - 1] = bitLen & 255;
  m[m.length - 5] = Math.floor(bitLen / 4294967296) & 255;
  const W = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let b = 0; b < nBlk; b++) {
    for (let i = 0; i < 16; i++) { const o = b * 64 + i * 4; W[i] = (m[o] << 24) | (m[o + 1] << 16) | (m[o + 2] << 8) | m[o + 3]; }
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(W[i - 15], 7) ^ rotr(W[i - 15], 18) ^ (W[i - 15] >>> 3);
      const s1 = rotr(W[i - 2], 17) ^ rotr(W[i - 2], 19) ^ (W[i - 2] >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
    }
    let a = H[0], bb = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + W[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const mj = (a & bb) ^ (a & c) ^ (bb & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + bb) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  return Array.from(H).map(x => x.toString(16).padStart(8, '0')).join('');
};

/* ---- rejestr sprawdzeń: każde sprawdzenie ma identyfikator, grupę, punkt normy,
   wartość obliczeniową, nośność, wytężenie i status.  Raport korzysta z pól „tok”. */
BS.check = function (o) {
  const c = Object.assign({ status: 'ok', util: null, info: false }, o);
  if (c.util !== null && c.util !== undefined && !c.info) {
    if (!isFinite(c.util) || c.util > 1.0 + 1e-9) c.status = 'fail';
    else if (c.warnAt && c.util > c.warnAt) c.status = 'warn';
  }
  if (c.forceStatus) c.status = c.forceStatus;
  return c;
};

})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>/* src/engine/normy.js */
/* =====================================================================
   BelkaStal – PROFIL NORMOWY PROJEKTU
   Jawny zestaw dokumentów: kraj, generacja Eurokodów, dokładne wydania,
   zmiany (A), poprawki (AC/Ap), załączniki krajowe (ZK/NA), data
   i autor weryfikacji zestawu.  Zasady:
     • generacji nie miesza się – cały projekt liczony jest wg jednej generacji;
     • ZK do 1. generacji nie jest przenoszony do 2. generacji
       (PKN: ZK opublikowany do Eurokodu 1. edycji stosuje się wyłącznie z nim);
     • gdy zestaw 2. generacji potrzebny dla zakresu projektu jest niekompletny
       (brak PN, brak ZK, brak obsługi w silniku) – stosuje się w całości
       zestaw 1. generacji zgodnie z aktualnymi wytycznymi PKN dotyczącymi
       okresu współistnienia; decyzja i jej uzasadnienie trafiają do raportu.
   Oznaczenia dokumentów są danymi profilu: projektant potwierdza każdą
   pozycję w katalogu PKN (pole „zweryfikowano”) i wpisuje datę weryfikacji.
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS;
const N = BS.N = {};

N.KRAJE = { PL: 'Polska (PN-EN, załączniki krajowe PL)' };
N.GENERACJE = {
  1: '1. generacja Eurokodów (EN 1990…1999:2002–2007 ze zmianami i poprawkami)',
  2: '2. generacja Eurokodów (EN 1990:2023, EN 1993-1-1:2022 i kolejne)'
};
// Obsługa generacji przez silnik obliczeniowy tej wersji programu.
N.SILNIK = { 1: true, 2: false };

// Stan wiedzy wbudowany w program (do potwierdzenia przez projektanta – pole data weryfikacji).
N.STAN_WIEDZY = {
  data: '2026-11-16',
  tekst: [
    'Eurokody 2. edycji (EN 1990…EN 1999) mają zostać wprowadzone do zbioru Polskich Norm najpóźniej do 30.09.2027 r.; załączniki krajowe do 2. edycji będą opracowywane przez komitety techniczne PKN w terminie późniejszym (informacja PKN – strona „Eurokody”).',
    'Załącznik krajowy opublikowany do Eurokodu 1. edycji stosuje się wyłącznie z Eurokodem 1. edycji (informacja PKN).',
    'Termin wycofania (DoW) Eurokodów 1. generacji przyjęty przez CEN: 30.03.2028 r. Do tego czasu 1. generacja z ZK pozostaje kompletnym, spójnym zestawem do projektowania w Polsce.',
    'Komunikat PKN nr 2/2026 (cytowany w źródłach wtórnych) – części 1. generacji pozostają aktualne do 31.03.2028 r. Treść komunikatu należy potwierdzić u źródła.'
  ],
  zrodla: ['PKN – Eurokody (pkn.pl, sektor: budownictwo i konstrukcje budowlane)', 'CEN/TC 250 – program 2. generacji (DoP 30.09.2027, DoW 30.03.2028)', 'JRC – Eurocodes: EN 1993-1-1:2022 opublikowana przez CEN 2022-11-09']
};

/* ------------------------------------------------------------------
   Katalog dokumentów.  Pole „gdy” – warunek zakresu (funkcja stanu projektu).
   Pole „pewnosc”: 'tak' – oznaczenie zgodne ze stanem wiedzy programu;
   'sprawdz' – szczególnie wymaga potwierdzenia w katalogu PKN.
   ------------------------------------------------------------------ */
const always = () => true;
const has = (rodzaj) => (st) => (st.obciazenia || []).some(o => o.rodzaj === rodzaj && o.aktywne !== false);
const anyConn = (st) => (st.podpory || []).some(p => p.wezel && ['blacha_czolowa', 'blacha_zebrowa'].includes(p.wezel.typ));
const anyBearing = (kind) => (st) => (st.podpory || []).some(p => p.wezel && p.wezel.typ === 'oparcie' && p.wezel.podloze === kind);
const anyAnchors = (st) => (st.podpory || []).some(p => p.wezel && p.wezel.typ === 'oparcie' && p.wezel.podloze === 'beton' && p.wezel.kotwy && p.wezel.kotwy.on !== false);
const stages = (st) => (st.etapy || []).length > 1 || (st.podpory || []).some(p => p.tymczasowa);
const fire = (st) => !!(st.pozar && st.pozar.aktywny);
const fat = (st) => !!(st.zmeczenie && st.zmeczenie.aktywny);

const DOC1 = [
  { k: 'EN1990', oznaczenie: 'PN-EN 1990:2004', en: 'EN 1990:2002', tytul: 'Eurokod – Podstawy projektowania konstrukcji',

  { k: 'EN1991-1-1', oznaczenie: 'PN-EN 1991-1-1:2004', en: 'EN 1991-1-1:2002', tytul: 'Eurokod 1 – Oddziaływania ogólne – Ciężar objętościowy, ciężar własny, obciążenia użytkowe w budynkach',

  { k: 'EN1991-1-3', oznaczenie: 'PN-EN 1991-1-3:2005', en: 'EN 1991-1-3:2003', tytul: 'Eurokod 1 – Oddziaływania ogólne – Obciążenie śniegiem',
    zmiany: ['PN-EN 1991-1-3:2005/A1:2015'], poprawki: ['PN-EN 1991-1-3:2005/AC:2009'], zk: 'Załącznik krajowy NA – w polskiej wersji normy (strefy obciążenia śniegiem 1–5)', gdy: has('S'), zakres: 'obciążenie śniegiem dachu s = μᵢ·Cₑ·Cₜ·sₖ', pewnosc: 'sprawdz' },
  { k: 'EN1991-1-4', oznaczenie: 'PN-EN 1991-1-4:2008', en: 'EN 1991-1-4:2005', tytul: 'Eurokod 1 – Oddziaływania ogólne – Oddziaływania wiatru',
    zmiany: ['PN-EN 1991-1-4:2008/A1:2010'], poprawki: ['PN-EN 1991-1-4:2008/AC:2009'], zk: 'PN-EN 1991-1-4:2008/NA:2010', gdy: has('W'), zakres: 'ciśnienie/ssanie wiatru na przekrycie przekazywane na belkę', pewnosc: 'sprawdz' },
  { k: 'EN1991-1-5', oznaczenie: 'PN-EN 1991-1-5:2005', en: 'EN 1991-1-5:2003', tytul: 'Eurokod 1 – Oddziaływania ogólne – Oddziaływania termiczne',
    zmiany: [], poprawki: ['PN-EN 1991-1-5:2005/AC:2009'], zk: 'Załącznik krajowy NA – w polskiej wersji normy (mapy Tmin/Tmax)', gdy: always, zakres: 'temperatura minimalna Tmd do doboru gatunku stali (PN-EN 1993-1-10), oddziaływania termiczne', pewnosc: 'tak' },
  { k: 'EN1991-1-6', oznaczenie: 'PN-EN 1991-1-6:2007', en: 'EN 1991-1-6:2005', tytul: 'Eurokod 1 – Oddziaływania ogólne – Oddziaływania w czasie wykonywania konstrukcji',
    zmiany: [], poprawki: ['PN-EN 1991-1-6:2007/AC:2008'], zk: 'Załącznik krajowy NA – w polskiej wersji normy', gdy: (st) => stages(st) || has('Qc')(st), zakres: 'obciążenia montażowe Qca…Qcf, sytuacje przejściowe – etapy realizacji', pewnosc: 'tak' },
  { k: 'EN1991-1-7', oznaczenie: 'PN-EN 1991-1-7:2008', en: 'EN 1991-1-7:2006', tytul: 'Eurokod 1 – Oddziaływania ogólne – Oddziaływania wyjątkowe',
    zmiany: ['PN-EN 1991-1-7:2008/A1:2014'], poprawki: ['PN-EN 1991-1-7:2008/AC:2010'], zk: 'Załącznik krajowy NA – w polskiej wersji normy', gdy: has('A'), zakres: 'oddziaływania wyjątkowe Ad (uderzenie, wybuch) – kombinacja 6.11', pewnosc: 'sprawdz' },
  { k: 'EN1991-3', oznaczenie: 'PN-EN 1991-3:2009', en: 'EN 1991-3:2006', tytul: 'Eurokod 1 – Oddziaływania wywołane dźwignicami i maszynami',
    zmiany: [], poprawki: ['PN-EN 1991-3:2009/AC:2012'], zk: 'Załącznik krajowy NA – w polskiej wersji normy', gdy: has('M'), zakres: 'oddziaływania od urządzeń i maszyn (współczynniki dynamiczne)', pewnosc: 'sprawdz' },

  { k: 'EN1993-1-1', oznaczenie: 'PN-EN 1993-1-1:2006', en: 'EN 1993-1-1:2005', tytul: 'Eurokod 3 – Projektowanie konstrukcji stalowych – Reguły ogólne i reguły dla budynków',
    zmiany: ['PN-EN 1993-1-1:2006/A1:2014-07'], poprawki: ['PN-EN 1993-1-1:2006/AC:2009'], zk: 'Załącznik krajowy NA – w polskiej wersji normy', gdy: always, zakres: 'analiza, klasyfikacja przekrojów, nośność przekroju (6.2), stateczność (6.3), SGU (7), wybór klasy wykonania (zał. C)', pewnosc: 'tak' },

<script>/* src/engine/mes.js */
/* =====================================================================

     podpory sztywne i sprężyste; dokładne M(x), V(x) w elemencie;

      const a = xsup[i], b = xsup[i + 1], n = Math.ceil((b - a) / lt - 1e-9);

  const keys = [];

  seg.forEach(s => { keys.push(s.x0, s.x1); });
  cases.forEach(c => c.parts.forEach(p => { if (p.typ === 'q') keys.push(p.x0, p.x1); else keys.push(p.x); }));

/* ------------------------------------------------------- analiza */
// zwraca: an.res[stage][caseId] = { tot:{M,V,w,Mz,Vy,u,R}, seg:[{...}] }, an.xs (punkty próbkowania)
S.analyze = function (md, sec) {
  const E = BS.U.E;
  const EIy = E * sec.Iy, EIz = E * sec.Iz;
  const xsamp = F.sample(F.plane({ xs: md.xs, EI: EIy, supports: [{ x: 0, kv: 'fix', kr: 'fix' }] })).xs;
  const ns = xsamp.length;
  const zero = () => ({ M: new Float64Array(ns), V: new Float64Array(ns), w: new Float64Array(ns), Mz: new Float64Array(ns), Vy: new Float64Array(ns), u: new Float64Array(ns), R: {} });
  const addTo = (A, B, f) => {
    for (let i = 0; i < ns; i++) { A.M[i] += f * B.M[i]; A.V[i] += f * B.V[i]; A.w[i] += f * B.w[i]; A.Mz[i] += f * B.Mz[i]; A.Vy[i] += f * B.Vy[i]; A.u[i] += f * B.u[i]; }
    Object.keys(B.R).forEach(k => { const a = A.R[k] || (A.R[k] = { R: 0, M: 0, Ry: 0 }); const b = B.R[k]; a.R += f * b.R; a.M += f * b.M; a.Ry += f * (b.Ry || 0); });
  };
  const cloneR = (o) => { const z = zero(); addTo(z, o, 1); return z; };
  const supVert = (sys) => sys.map(s => ({ id: s.id, x: s.x, kv: s.kv, kr: s.kr }));
  const supHor = (stage) => {
    const a = md.sup.map(s => ({ id: s.id, x: s.x, kv: 'fix', kr: s.typ === 'utwierdzenie' && s.ltb === 'pelne' ? 'fix' : 0 }));
    md.stez.filter(s => s.bocznieY && s.od <= stage && (s.typ === 'boczne' || s.typ === 'pelne')).forEach((s, i) => { if (!a.some(q => Math.abs(q.x - s.x) < 1)) a.push({ id: 'S' + (i + 1), x: s.x, kv: 'fix', kr: 0 }); });
    return a;
  };
  // rozwiązanie jednej płaszczyzny
  const solveV = (sys, loads) => {
    const r = F.plane({ xs: md.xs, EI: EIy, supports: supVert(sys), dist: loads.dist, point: loads.point, mom: loads.mom });
    const s = F.sample(r), o = zero();
    o.M.set(s.M); o.V.set(s.V); o.w.set(s.w);
    r.reactions.forEach(q => { o.R[q.id] = { R: q.R, M: q.M, Ry: 0 }; });

  };
  const solveH = (stage, loads) => {
    const sp = supHor(stage);

    const s = F.sample(r), o = zero();
    o.Mz.set(s.M); o.Vy.set(s.V); o.u.set(s.w);

  const loadsOf = (c, gi, kier) => {
    const L = { dist: [], point: [], mom: [] };
    c.parts.forEach(p => {
      if (p.kier !== kier) return;
      const sg = gi >= 0 ? md.seg[gi] : null;
      const sgn = kier === 'z' ? -1 : 1; // grawitacja w dół → q w górę ujemne
      if (p.typ === 'q') {
        let a = p.x0, b = p.x1;
        if (sg) { a = Math.max(a, sg.x0); b = Math.min(b, sg.x1); if (b - a < 1e-6) return; }
        const qa = p.q0 + (p.q1 - p.q0) * (a - p.x0) / (p.x1 - p.x0), qb = p.q0 + (p.q1 - p.q0) * (b - p.x0) / (p.x1 - p.x0);
        L.dist.push({ x0: a, x1: b, q0: sgn * qa, q1: sgn * qb });

        if (sg && md.segOf(p.x) !== gi) return;
        L.point.push({ x: p.x, P: sgn * p.P });
      } else if (p.typ === 'M') {
        if (sg && md.segOf(p.x) !== gi) return;
        L.mom.push({ x: p.x, M: p.M });
      }
    });
    return L;
  };
  const isEmpty = (L) => !L.dist.length && !L.point.length && !L.mom.length;

  const res = md.etapy.map(() => ({}));
  md.cases.forEach(c => {
    const stale = S.RODZAJE[c.rodzaj].stale;
    const segIdx = md.seg.map((s, i) => i);
    const one = (gi) => {
      // wynik części przypadku dla wszystkich etapów (null – nieaktywny)
      const out = md.etapy.map(() => null);
      const LV = loadsOf(c, gi, 'z'), LH = loadsOf(c, gi, 'y');
      if (isEmpty(LV) && isEmpty(LH)) return out;
      const k = c.etap;
      let acc = isEmpty(LV) ? zero() : solveV(md.systems[k], LV);
      if (!isEmpty(LH)) addTo(acc, solveH(k, LH), 1);
      out[k] = cloneR(acc);
      if (stale) {
        for (let s = k + 1; s < md.nE; s++) {
          const prev = md.systems[s - 1], cur = md.systems[s];
          const removed = prev.filter(p => !cur.some(q => q.id === p.id));
          if (removed.length && !isEmpty(LV)) {
            const pl = { dist: [], point: removed.map(p => ({ x: p.x, P: -((acc.R[p.id] && acc.R[p.id].R) || 0) })), mom: [] };
            const d = solveV(cur, pl);
            removed.forEach(p => { if (acc.R[p.id]) acc.R[p.id].R = 0; });
            addTo(acc, d, 1);
          }
          if (!isEmpty(LH)) { // płaszczyzna pozioma – bez historii (układ etapu s)
            const prevH = solveH(s - 1, LH), curH = solveH(s, LH);

    md.etapy.forEach((e, s) => {
      if (!tot[s]) return;
      res[s][c.id] = { tot: tot[s], seg: parts.map(p => p[s] || zero()), N: c.Nn, c };
    });
  });
  return { xs: Float64Array.from(xsamp), ns, res, zero, addTo };
};

/* wartości w punkcie x (interpolacja liniowa po próbkach; przy nieciągłości – większa |wartość|) */
S.at = function (xs, arr, x) {
  // wyszukiwanie binarne pierwszego indeksu z xs[i] ≥ x − ε
  let lo = 0, hi = xs.length - 1;
  if (x <= xs[0]) return arr[0];
  if (x >= xs[hi]) { let b = arr[hi]; for (let i = hi; i >= 0 && Math.abs(xs[i] - x) < 1e-6; i--) if (Math.abs(arr[i]) > Math.abs(b)) b = arr[i]; return b; }

  if (Math.abs(xs[lo] - x) < 1e-6) { let b = arr[lo]; for (let i = lo + 1; i < xs.length && Math.abs(xs[i] - x) < 1e-6; i++) if (Math.abs(arr[i]) > Math.abs(b)) b = arr[i]; return b; }

<script>/* src/engine/kombinacje.js */
/* =====================================================================
   BelkaStal – kombinacje oddziaływań wg PN-EN 1990 (zał. A1)
   SGN STR: 6.10 lub mniej korzystna z 6.10a i 6.10b (sytuacje trwałe
   i przejściowe – etapy realizacji), sytuacja wyjątkowa 6.11b, sytuacja
   pożarowa, SGU: charakterystyczna 6.14b, częsta 6.15b, quasi-stała 6.16b,
   kombinacja do doboru stali (PN-EN 1993-1-10, 2.2(5)), EQU – obwiednia
   reakcji z rozdziałem G na części korzystne/niekorzystne.
   Obciążenia stałe – „jednolite źródło” (γG,sup lub γG,inf dla całości),
   zmienne – wybór podzbiorów, wiodące, grupy wykluczające się,
   układy szachownicowe w przęsłach.
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U, N = BS.N, S = BS.S;
const K = BS.K = {};

K.psi = function (c) {
  if (Array.isArray(c.psi) && c.psi.length === 3 && c.psi.every(v => v !== '' && v !== null && isFinite(+v))) return c.psi.map(Number);
  const R = S.RODZAJE[c.rodzaj];
  if (!R || !R.psiKey) return [1, 1, 1];
  const e = N.PSI[R.psiKey(c)];
  return e ? e.p.slice() : [1, 1, 1];
};

// układy obciążenia przęseł (indeksy segmentów)
K.patterns = function (md) {
  const n = md.seg.length;
  const all = md.seg.map((s, i) => i);
  if (n <= 1) return [{ id: 'all', n: 'wszystkie', set: all }];
  const P = [{ id: 'all', n: 'wszystkie segmenty', set: all }];
  const odd = all.filter(i => i % 2 === 0), even = all.filter(i => i % 2 === 1);
  P.push({ id: 'odd', n: 'segmenty ' + odd.map(i => md.seg[i].n).join(', '), set: odd });
  if (even.length) P.push({ id: 'even', n: 'segmenty ' + even.map(i => md.seg[i].n).join(', '), set: even });
  for (let j = 0; j < n - 1; j++) {
    const set = all.filter(i => i === j || i === j + 1 || (i < j && (j - i) % 2 === 0) || (i > j + 1 && (i - j - 1) % 2 === 0));
    const key = set.join(',');
    if (!P.some(p => p.set.join(',') === key)) P.push({ id: 'adj' + j, n: 'przy podporze ' + (md.seg[j].x1 / 1000).toFixed(2) + ' m: ' + set.map(i => md.seg[i].n).join(', '), set });
  }
  return P;
};

const fmtF = (f) => U.fmt(f, 3).replace(/,?0+$/, '').replace(/,$/, '');

/* generacja kombinacji dla etapu s */
K.generate = function (md, an, ndp, opt) {
  opt = opt || {};
  const out = [], warn = [];
  const kfi = +ndp.KFI || 1;
  const gS = ndp.gG_sup * kfi, gI = ndp.gG_inf, gQ = ndp.gQ * kfi, xi = ndp.xi;
  const pats = K.patterns(md);
  const finalS = md.nE - 1;
  const seen = new Set();
  const push = (c) => {
    const key = c.typ + '|' + c.etap + '|' + c.terms.map(t => t.id + (t.seg ? ':' + t.seg.join('.') : '') + '=' + t.f.toFixed(5)).sort().join(';');
    if (seen.has(key)) return; seen.add(key);
    c.id = c.typ + (out.filter(o => o.typ === c.typ).length + 1);
    out.push(c);
  };
  for (let s = 0; s < md.nE; s++) {
    const R = an.res[s] || {};
    const ids = Object.keys(R);
    const Gc = ids.filter(k => S.RODZAJE[R[k].c.rodzaj].stale);
    const Ac = ids.filter(k => R[k].c.rodzaj === 'A' && R[k].c.etap === s);
    const Vc = ids.filter(k => !S.RODZAJE[R[k].c.rodzaj].stale && R[k].c.rodzaj !== 'A' && R[k].c.etap === s);
    // sloty: grupy wykluczające się
    const slots = [], grp = {};
    Vc.forEach(k => { const w = (R[k].c.wyklucz || '').trim(); if (w) { if (!grp[w]) { grp[w] = []; slots.push(grp[w]); } grp[w].push(k); } else slots.push([k]); });
    let choices = [[]];
    const total = slots.reduce((p, sl) => p * (sl.length + 1), 1);
    if (total <= 1024) {
      slots.forEach(sl => { const nx = []; choices.forEach(ch => { nx.push(ch); sl.forEach(k => nx.push(ch.concat([k]))); }); choices = nx; });
    } else {
      warn.push(`Etap ${s + 1}: ${slots.length} niezależnych oddziaływań zmiennych – ograniczono przegląd podzbiorów (wszystkie razem lub pojedynczo).`);
      choices = [[]]; slots.forEach(sl => sl.forEach(k => choices.push([k])));
      const allFirst = slots.map(sl => sl[0]); choices.push(allFirst);
    }
    const patterned = (k) => R[k].c.uklad === 'szachownica' && md.seg.length > 1;
    const sit = md.etapy[s].typ === 'montaz' ? 'przejściowa' : 'trwała';
    const term = (k, f, pat) => ({ id: k, f, seg: pat && patterned(k) ? pat.set : null });
    const desc = (parts) => parts.filter(p => p).join(' + ');
    const lbl = (k) => R[k].c.id;
    const mk = (typ, gf, lead, acc, accF, leadF, pat, form) => {
      const terms = Gc.map(k => ({ id: k, f: gf, seg: null }));
      if (lead) terms.push(term(lead, leadF, pat));
      acc.forEach((k, i) => { if (accF[i] > 0) terms.push(term(k, accF[i], pat)); });
      const ps = [];
      if (Gc.length) ps.push(fmtF(gf) + '·G');
      if (lead) ps.push(fmtF(leadF) + '·' + lbl(lead));
      acc.forEach((k, i) => { if (accF[i] > 0) ps.push(fmtF(accF[i]) + '·' + lbl(k)); });
      const usesPat = pat && terms.some(t => t.seg);
      return { typ, etap: s, sytuacja: typ === 'SGN' ? sit : typ, forma: form, gf, lead: lead || null, terms, opis: (form ? form + ': ' : '') + desc(ps) + (usesPat ? ` [układ: ${pat.n}]` : ''), pat: usesPat ? pat.id : 'all' };
    };
    choices.forEach(ch => {
      const pList = ch.some(patterned) ? pats : [pats[0]];
      pList.forEach(pat => {
        const psi = (k) => K.psi(R[k].c);
        // ---- SGN (STR)
        [gS, gI].forEach(gf => {
          if (!ch.length) { push(mk('SGN', gf, null, [], [], 0, pat, ndp.komb === '6.10' ? '6.10' : '6.10a')); return; }
          if (ndp.komb === '6.10') {
            ch.forEach(L => { const acc = ch.filter(k => k !== L); push(mk('SGN', gf, L, acc, acc.map(k => gQ * psi(k)[0]), gQ, pat, '6.10')); });
          } else {
            push(mk('SGN', gf, null, ch, ch.map(k => gQ * psi(k)[0]), 0, pat, '6.10a'));
            ch.forEach(L => { const acc = ch.filter(k => k !== L); push(mk('SGN', gf === gS ? xi * gS : gI, L, acc, acc.map(k => gQ * psi(k)[0]), gQ, pat, '6.10b')); });
          }
        });
        // ---- SGU charakterystyczna (wszystkie etapy – ugięcia montażowe informacyjnie)
        if (!ch.length) push(mk('char', 1, null, [], [], 0, pat, '6.14b'));
        ch.forEach(L => { const acc = ch.filter(k => k !== L); push(mk('char', 1, L, acc, acc.map(k => psi(k)[0]), 1, pat, '6.14b')); });
        if (s !== finalS) return;
        // ---- częsta, quasi-stała, do doboru stali (kruche pękanie)
        if (!ch.length) { push(mk('czest', 1, null, [], [], 0, pat, '6.15b')); push(mk('qp', 1, null, [], [], 0, pat, '6.16b')); push(mk('kruche', 1, null, [], [], 0, pat, 'PN-EN 1993-1-10 (2.6)')); }
        ch.forEach(L => {
          const acc = ch.filter(k => k !== L);
          push(mk('czest', 1, L, acc, acc.map(k => psi(k)[2]), psi(L)[1], pat, '6.15b'));
          push(mk('kruche', 1, L, acc, acc.map(k => psi(k)[2]), psi(L)[1], pat, 'PN-EN 1993-1-10 (2.6)'));
        });
        if (ch.length) push(mk('qp', 1, null, ch, ch.map(k => psi(k)[2]), 0, pat, '6.16b'));
        // ---- pożar
        if (opt.pozar) {
          const pf = (k) => (ndp.psiAcc === 'psi2' ? psi(k)[2] : psi(k)[1]);
          if (!ch.length) push(mk('poz', 1, null, [], [], 0, pat, '6.11b (pożar)'));
          ch.forEach(L => { const acc = ch.filter(k => k !== L); push(mk('poz', 1, L, acc, acc.map(k => psi(k)[2]), pf(L), pat, '6.11b (pożar)')); });
        }
        // ---- wyjątkowa
        Ac.forEach(A => {
          const pf = (k) => (ndp.psiAcc === 'psi2' ? psi(k)[2] : psi(k)[1]);
          const base = (L, acc, accF, lf) => { const c = mk('wyj', 1, L, acc, accF, lf, pat, '6.11b'); c.terms.push({ id: A, f: 1, seg: null }); c.opis = c.opis.replace('6.11b: ', '6.11b: ' + lbl(A) + ' + '); return c; };
          if (!ch.length) push(base(null, [], [], 0));
          ch.forEach(L => { const acc = ch.filter(k => k !== L); push(base(L, acc, acc.map(k => psi(k)[2]), pf(L))); });
        });
      });
    });

  return { list: out, warn };

/* ewaluacja kombinacji: zwraca tablice wyników w punktach próbkowania */
K.evaluate = function (an, c) {
  const z = an.zero(); let Nsum = 0;
  const R = an.res[c.etap];
  c.terms.forEach(t => {
    const r = R[t.id]; if (!r) return;
    if (t.seg) t.seg.forEach(gi => an.addTo(z, r.seg[gi], t.f));
    else an.addTo(z, r.tot, t.f);
    // siła osiowa: przy układzie szachownicowym przyjęto pełną wartość N przypadku
    Nsum += t.f * (r.N || 0);
  });
  z.N = Nsum;
  return z;
};

/* EQU – minimalne (i maksymalne) reakcje pionowe podpór: obwiednia z rozdziałem
   G na segmenty (γG,sup = 1,10 / γG,inf = 0,90) i zmiennych niekorzystnych */
K.equ = function (md, an, ndp) {
  const out = [];
  for (let s = 0; s < md.nE; s++) {
    const R = an.res[s] || {}, ids = Object.keys(R);
    md.systems[s].forEach(sp => {
      let rmin = 0, rmax = 0, rk = 0;
      const vars = [];
      ids.forEach(k => {
        const r = R[k], c = r.c, st = S.RODZAJE[c.rodzaj].stale;
        if (c.rodzaj === 'A') return;
        const segVals = r.seg.map(g => (g.R[sp.id] ? g.R[sp.id].R : 0));
        if (st) {
          segVals.forEach(v => { rmin += v > 0 ? ndp.gG_inf_equ * v : ndp.gG_sup_equ * v; rmax += v > 0 ? ndp.gG_sup_equ * v : ndp.gG_inf_equ * v; rk += v; });
        } else if (c.etap === s) {
          const psi0 = K.psi(c)[0];
          const neg = segVals.reduce((a, v) => a + Math.min(0, v), 0), pos = segVals.reduce((a, v) => a + Math.max(0, v), 0);
          vars.push({ k, neg, pos, psi0, grp: (c.wyklucz || '').trim() });
        }
      });
      // wiodące = największy wpływ niekorzystny; grupy wykluczające się – jedno z grupy
      const pick = (sel) => {
        const byGrp = {}; const list = [];
        vars.forEach(v => { const val = sel(v); if (val === 0) return; if (v.grp) { if (!byGrp[v.grp] || Math.abs(val) > Math.abs(sel(byGrp[v.grp]))) byGrp[v.grp] = v; } else list.push(v); });
        return list.concat(Object.values(byGrp));
      };
      const negV = pick(v => v.neg), posV = pick(v => v.pos);
      const comb = (arr, key) => { let best = 0; arr.forEach(L => { let t = ndp.gQ_equ * L[key]; arr.forEach(o => { if (o !== L) t += ndp.gQ_equ * o.psi0 * o[key]; }); if (Math.abs(t) > Math.abs(best)) best = t; }); return best; };
      out.push({ etap: s, id: sp.id, x: sp.x, tymcz: sp.tymcz, Rmin: rmin + comb(negV, 'neg'), Rmax: rmax + comb(posV, 'pos'), RkG: rk });
    });
  }
  return out;
};

<script>/* src/engine/nosnosc.js */
/* =====================================================================
   BelkaStal – nośność przekroju (PN-EN 1993-1-1, rozdz. 5.5 i 6.2)
   oraz elementy płytowe (PN-EN 1993-1-5: 4, 5, 6, 7, 9).
   Znak momentu: M > 0 – ściskany pas górny; N > 0 – ściskanie (Nc).
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U, P = BS.P;
const R = BS.R = {};
const s3 = Math.sqrt(3);

/* ---------------------------------------------------------- klasyfikacja (tabl. 5.2) */
// położenie osi obojętnej plastycznej przy sile Nc (ściskanie +) i ściskanej stronie Mpos

  const Ac = U.clamp((sec.A + Nc / fy) / 2, 0, sec.A);
  let lo = 0, hi = sec.h;
  for (let k = 0; k < 60; k++) {
    const m = (lo + hi) / 2;
    const a = P.integrals(P.clip(sec.rings, m, Mpos), 0).A; // pole po stronie ściskanej
    if (Mpos) { if (a > Ac) lo = m; else hi = m; } else { if (a > Ac) hi = m; else lo = m; }

R.plasticNA = plasticNA;
// klasa ścianki wewnętrznej przy rozkładzie (α – plastycznie, ψ – sprężyście)
function internalClass(ct, eps, alpha, ps) {

    l1 = alpha > 0.5 ? 396 * eps / (13 * alpha - 1) : 36 * eps / Math.max(alpha, 1e-6);
    l2 = alpha > 0.5 ? 456 * eps / (13 * alpha - 1) : 41.5 * eps / Math.max(alpha, 1e-6);
    l3 = ps > -1 ? 42 * eps / (0.67 + 0.33 * ps) : 62 * eps * (1 - ps) * Math.sqrt(-ps);

/* pełna klasyfikacja dla stanu (M, Nc): M > 0 – ściskana góra przekroju; Nc > 0 – ściskanie */
R.classAt = function (sec, fy, M, Nc) {
  const eps = Math.sqrt(235 / fy);
  const Mpos = M >= 0, hasM = Math.abs(M) > 1;
  const sig = (z) => Nc / sec.A + (hasM ? M : 0) * (z - sec.zc) / sec.Iy; // ściskanie +
  const out = { eps, all: [] };
  if (sec.kind === 'L') {
    // kątowniki: przy ściskaniu – tabl. 5.2 (ark. 3); przy zginaniu – ramiona jako ścianki wspornikowe (ark. 2) z rozkładem naprężeń
    const { h, b, t } = sec;
    if (!hasM) {
      const r1 = h / t, r2 = (b + h) / (2 * t), c3 = r1 <= 15 * eps && r2 <= 11.5 * eps;
      out.all.push({ n: 'kątownik ściskany: h/t', typ: 'kątownik', c: h, t, ct: r1, lim: [Infinity, Infinity, 15 * eps], cls: c3 ? 3 : 4, ref: 'tabl. 5.2 (ark. 3)' });
      out.all.push({ n: 'kątownik ściskany: (b + h)/2t', typ: 'kątownik', c: (b + h) / 2, t, ct: r2, lim: [Infinity, Infinity, 11.5 * eps], cls: c3 ? 3 : 4, ref: 'tabl. 5.2 (ark. 3)' });
    } else {
      const zpL = plasticNA(sec, fy, Nc, Mpos);
      const top = sec.poz === 'gora';
      // ramię pionowe: krawędź swobodna u góry (poz = dol) lub u dołu (gora)
      const zTip = top ? 0 : h, zRoot = top ? h : 0;
      const sTip = sig(zTip), sRoot = sig(zRoot), ct = h / t;
      if (Math.max(sTip, sRoot) <= 0) out.all.push({ n: 'ramię pionowe', typ: 'wspornikowa', c: h, t, ct, lim: [Infinity, Infinity, Infinity], cls: 1, tension: true, ref: 'tabl. 5.2 (ark. 2)' });
      else {
        const tipC = sTip >= sRoot;
        const alpha = U.clamp(tipC ? Math.abs(zTip - zpL) / h : Math.abs(zpL - zRoot) / h, 1e-6, 1);
        let ks, l1, l2;

        else { const ps = sTip / sRoot; ks = ps >= 1 ? 0.43 : ps > 0 ? 0.578 / (ps + 0.34) : ps > -1 ? 1.7 - 5 * ps + 17.1 * ps * ps : 23.8; l1 = 9 * eps / (alpha * Math.sqrt(alpha)); l2 = 10 * eps / (alpha * Math.sqrt(alpha)); }
        const l3 = 21 * eps * Math.sqrt(ks);
        out.all.push({ n: `ramię pionowe (${tipC ? 'ściskana krawędź swobodna' : 'rozciągana krawędź swobodna'})`, typ: 'wspornikowa', c: h, t, ct, alpha, lim: [l1, l2, l3], cls: ct <= l1 ? 1 : ct <= l2 ? 2 : ct <= l3 ? 3 : 4, ref: 'tabl. 5.2 (ark. 2)' });
      }

      if (sH <= 0) out.all.push({ n: 'ramię poziome', typ: 'wspornikowa', c: b, t, ct: cth, lim: [Infinity, Infinity, Infinity], cls: 1, tension: true, ref: 'tabl. 5.2 (ark. 2)' });
      else { const lim = [9 * eps, 10 * eps, 14 * eps]; out.all.push({ n: 'ramię poziome (ściskane)', typ: 'wspornikowa', c: b, t, ct: cth, lim, cls: cth <= lim[0] ? 1 : cth <= lim[1] ? 2 : cth <= lim[2] ? 3 : 4, ref: 'tabl. 5.2 (ark. 2)' }); }
    }
    out.cls = Math.max(...out.all.map(p => p.cls)); out.alpha = 0.5; out.parts = out.all.slice(1); out.web = out.all[0];
    return out;
  }
  const zp = hasM ? plasticNA(sec, fy, Nc, Mpos) : null;
  sec.parts.forEach(p => {
    const ct = p.c / p.t;
    if (p.side === 'web') {
      const c = p.z1 - p.z0;
      let alpha;
      if (!hasM) alpha = Nc >= 0 ? 1 : 0;
      else alpha = U.clamp(Mpos ? (p.z1 - zp) / c : (zp - p.z0) / c, 0, 1);
      const sT = sig(p.z1), sB = sig(p.z0), smax = Math.max(sT, sB), smin = Math.min(sT, sB);
      if (smax <= 0) { out.all.push({ n: p.n, typ: 'wewnętrzna', c: p.c, t: p.t, ct, alpha, psi: -Infinity, lim: [Infinity, Infinity, Infinity], cls: 1, tension: true, ref: 'tabl. 5.2 (ark. 1)' }); return; }
      const ps = smin / smax, k = internalClass(ct, eps, alpha, ps);
      out.all.push({ n: p.n, typ: 'wewnętrzna', c: p.c, t: p.t, ct, alpha, psi: ps, lim: k.lim, cls: k.cls, ref: 'tabl. 5.2 (ark. 1)' });
      out.alpha = alpha;
    } else {
      const sg = sig(p.z);
      if (sg <= 0) { out.all.push({ n: p.n, typ: p.typ === 'wsp' ? 'wspornikowa' : 'wewnętrzna', c: p.c, t: p.t, ct, lim: [Infinity, Infinity, Infinity], cls: 1, tension: true, ref: p.typ === 'wsp' ? 'tabl. 5.2 (ark. 2)' : 'tabl. 5.2 (ark. 1)' }); return; }
      const lim = p.typ === 'wsp' ? [9 * eps, 10 * eps, 14 * eps] : [33 * eps, 38 * eps, 42 * eps];
      out.all.push({ n: p.n, typ: p.typ === 'wsp' ? 'wspornikowa' : 'wewnętrzna', c: p.c, t: p.t, ct, lim, cls: ct <= lim[0] ? 1 : ct <= lim[1] ? 2 : ct <= lim[2] ? 3 : 4, ref: p.typ === 'wsp' ? 'tabl. 5.2 (ark. 2)' : 'tabl. 5.2 (ark. 1)' });
    }

  out.parts = out.all.filter(p => !/środnik|boczne/.test(p.n));
  out.web = out.all.find(p => /środnik|boczne/.test(p.n)) || out.all[out.all.length - 1];
  return out;
};

/* ---------------------------------------------------------- przekrój efektywny (PN-EN 1993-1-5, 4.4) */
const rhoInternal = (lp, psi) => (lp <= 0.5 + Math.sqrt(0.085 - 0.055 * psi) ? 1 : Math.min(1, (lp - 0.055 * (3 + psi)) / (lp * lp)));
const rhoOutstand = (lp) => (lp <= 0.748 ? 1 : Math.min(1, (lp - 0.188) / (lp * lp)));
const kSigInternal = (psi) => (psi >= 1 ? 4 : psi > 0 ? 8.2 / (1.05 + psi) : psi === 0 ? 7.81 : psi > -1 ? 7.81 - 6.29 * psi + 9.78 * psi * psi : psi >= -3 ? 5.98 * (1 - psi) * (1 - psi) : 5.98 * 16);

// mode: 'Mpos' | 'Mneg' | 'N' – zwraca prostokąty efektywne i charakterystyki
R.effective = function (sec, fy, mode) {
  if (sec.kind === 'L') throw new Error('Kątownik klasy 4 – przekrój efektywny kątownika nie jest obsługiwany (dobierz grubszy kątownik).');
  const eps = Math.sqrt(235 / fy);
  let rects = P.rects(sec);
  const info = [];
  const flange = (id) => {
    const p = sec.parts.find(q => q.side === (id === 'fg' ? 'top' : 'bot'));
    if (!p) return;
    const out = p.typ === 'wsp';
    const kS = out ? 0.43 : 4;
    const lp = (p.c / p.t) / (28.4 * eps * Math.sqrt(kS));
    const rho = out ? rhoOutstand(lp) : rhoInternal(lp, 1), cut = (1 - rho) * p.c;
    info.push({ el: p.n, lp, rho, kS, beff: rho * p.c, c: p.c });
    if (cut <= 1e-6) return;
    const r = rects.find(q => q.id === id);
    rects = rects.filter(q => q !== r);
    if (!out) { const ym = (r.y0 + r.y1) / 2; rects.push(Object.assign({}, r, { y1: ym - cut / 2, id: id + 'L' }), Object.assign({}, r, { y0: ym + cut / 2, id: id + 'P' })); }   // ścianka wewnętrzna – część środkowa nieefektywna
    else if (r.tip === 'right') rects.push(Object.assign({}, r, { y1: r.y1 - cut, id: id + 'e' }));
    else rects.push(Object.assign({}, r, { y0: r.y0 + cut, y1: r.y1 - cut, id: id + 'e' }));     // dwuteownik – krawędzie swobodne po obu stronach
  };

  if (mode === 'Mneg' || mode === 'N') flange('fd');
  // ścianki pionowe – rozkład naprężeń z przekroju z efektywnymi pasami i pełnymi ściankami
  const g1 = P.rectProps(rects);
  const pw = sec.parts.find(q => q.side === 'web');
  const zTw = pw.z1, zBw = pw.z0, c = zTw - zBw;
  let psi; const zc = g1.zc;
  if (mode === 'N') psi = 1;
  else if (mode === 'Mpos') psi = (zBw - zc) / (zTw - zc); // σ ∝ (z − zc), ściskanie u góry
  else psi = (zTw - zc) / (zBw - zc);
  const kS = kSigInternal(psi);
  const lp = (c / pw.t) / (28.4 * eps * Math.sqrt(kS));
  const rho = rhoInternal(lp, psi);
  const bc = psi < 0 ? c / (1 - psi) : c; // długość strefy ściskanej
  const beff = rho * bc;
  let hole = null;
  if (rho < 1) {
    let be1, be2;
    if (psi >= 1) { be1 = 0.5 * beff; be2 = 0.5 * beff; }
    else if (psi >= 0) { be1 = 2 * beff / (5 - psi); be2 = beff - be1; }
    else { be1 = 0.4 * beff; be2 = 0.6 * beff; }
    if (mode === 'Mpos') hole = [zTw - bc + be2, zTw - be1];
    else if (mode === 'Mneg') hole = [zBw + be1, zBw + bc - be2];
    else hole = [zBw + be2, zTw - be1];
    const ws = rects.filter(q => q.id === 'w');
    rects = rects.filter(q => q.id !== 'w');
    ws.forEach(w => rects.push(Object.assign({}, w, { z1: hole[0], id: 'w1' }), Object.assign({}, w, { z0: hole[1], id: 'w2' })));
  }
  info.push({ el: pw.n, lp, rho, kS, psi, bc, beff, c, hole });
  const g = P.rectProps(rects);
  return { rects, A: g.A, zc: g.zc, Iy: g.Iy, Wt: g.Wt, Wb: g.Wb, Weff: mode === 'N' ? null : Math.min(g.Wt, g.Wb), eN: g.zc - sec.zc, info, reduced: info.some(i => i.rho < 1) };
};

/* ---------------------------------------------------------- nośności podstawowe */
R.basic = function (sec, mat, ndp) {
  const fy = mat.fy, g0 = ndp.gM0, g1 = ndp.gM1;
  const eta = fy > 460 ? 1.0 : ndp.eta;
  const Av = sec.kind === 'I' ? (sec.typ === 'walc' ? Math.max(sec.Avz, eta * sec.hw * sec.tw) : eta * sec.hw * sec.tw) : sec.Avz;
  const o = {
    fy, eps: Math.sqrt(235 / fy), eta, Av,
    Npl: sec.A * fy / g0,
    Vpl: Av * fy / (s3 * g0),
    Vplz_y: sec.Avy * fy / (s3 * g0),
    Mpl_pos: sec.Wpl_y * fy / g0, Mpl_neg: sec.Wpl_y * fy / g0,
    Mel_pos: Math.min(sec.Wel_t, sec.Wel_b) * fy / g0, Mel_neg: Math.min(sec.Wel_t, sec.Wel_b) * fy / g0,
    Mplz: sec.Wpl_z * fy / g0, Melz: sec.Wel_z * fy / g0,

  o.effPos = o.kPos.cls === 4 ? R.effective(sec, fy, 'Mpos') : null;
  o.effNeg = o.kNeg.cls === 4 ? R.effective(sec, fy, 'Mneg') : null;
  o.effN = null;
  if (o.kN.cls === 4) { try { o.effN = R.effective(sec, fy, 'N'); } catch (e) { o.effNerr = e.message; } }
  const Wfor = (k, eff) => (k.cls <= 2 ? sec.Wpl_y : k.cls === 3 ? Math.min(sec.Wel_t, sec.Wel_b) : eff.Weff);
  o.Wy_pos = Wfor(o.kPos, o.effPos); o.Wy_neg = Wfor(o.kNeg, o.effNeg);
  o.Mc_pos = o.Wy_pos * fy / g0; o.Mc_neg = o.Wy_neg * fy / g0;
  o.Aeff = o.effN ? o.effN.A : sec.A;   // kątownik kl. 4 przy ściskaniu – sprawdzenie blokowane w projekt.js
  o.Nc = o.Aeff * fy / g0;

  o.Wz = o.kN.cls <= 2 ? sec.Wpl_z : sec.Wel_z;
  o.Mcz = o.Wz * fy / g0;

};

/* nośność plastyczna przy zginaniu ze siłą osiową (przekrój dowolny – numerycznie): MN,y,Rd */
R.MNpl = function (sec, fy, Nc, Mpos, g0) {
  // oś obojętna: pole ściskane − pole rozciągane = Nc/fy
  const A = sec.A, Ac = U.clamp((A + Nc / fy) / 2, 0, A);
  let lo = 0, hi = sec.h;
  for (let k = 0; k < 60; k++) {
    const m = (lo + hi) / 2;
    const a = P.integrals(P.clip(sec.rings, m, Mpos), 0).A;
    if (Mpos) { if (a > Ac) lo = m; else hi = m; } else { if (a > Ac) hi = m; else lo = m; }
  }
  const zp = (lo + hi) / 2;
  const up = P.integrals(P.clip(sec.rings, zp, true), sec.zc), dn = P.integrals(P.clip(sec.rings, zp, false), sec.zc);
  // moment względem środka ciężkości: ściskanie u góry (Mpos) → M = fy(∫_up z − ∫_dn z)
  // moment względem środka ciężkości przekroju brutto (ściskanie po stronie Mpos)
  const M = fy * (up.Sz - dn.Sz);
  return Math.abs(M) / g0;

/* ---------------------------------------------------------- sprawdzenie przekroju w punkcie */
// kontekst kombinacji: klasa i nośności zależne od N (stałej w kombinacji) i znaku M
R.ctx = function (sec, b, ndp, Nc, Mpos, Mneg) {
  const fy = b.fy, g0 = ndp.gM0;
  const small = Math.abs(Nc) < 1e-3 * b.Npl;
  const one = (sign, Mref) => {
    const k = small ? (sign > 0 ? b.kPos : b.kNeg) : R.classAt(sec, fy, sign * Math.max(Math.abs(Mref), 1e3), Nc);
    let Wy, eff = null;
    if (k.cls <= 2) Wy = sec.Wpl_y; else if (k.cls === 3) Wy = Math.min(sec.Wel_t, sec.Wel_b);
    else { eff = sign > 0 ? (b.effPos || R.effective(sec, fy, 'Mpos')) : (b.effNeg || R.effective(sec, fy, 'Mneg')); Wy = eff.Weff; }
    let MN = null, negl = true;

      MN = negl ? Wy * fy / g0 : Math.min(Wy * fy / g0, R.MNpl(sec, fy, Nc, sign > 0, g0));
    }
    return { k, cls: k.cls, Wy, eff, MN, negl };

// e: { M, V, Mz, Vy } [Nmm, N]; ctx – z R.ctx; zwraca wytężenia składowe
R.atPoint = function (sec, b, ndp, e, ctx) {
  const fy = b.fy, g0 = ndp.gM0, Nc = ctx.Nc;
  const M = e.M, V = Math.abs(e.V), Mz = Math.abs(e.Mz || 0), Vy = Math.abs(e.Vy || 0);
  const c = M >= 0 ? ctx.pos : ctx.neg;
  const out = { cls: c.cls };
  out.uV = V / b.Vpl; out.uVy = Vy / b.Vplz_y;
  const rho = V > 0.5 * b.Vpl ? Math.pow(2 * V / b.Vpl - 1, 2) : 0;
  out.rho = rho;
  let McRd = c.Wy * fy / g0, red = 1;
  if (rho > 0) {

      red = Math.min(1, Math.min(rp.Wt, rp.Wb) / Math.min(sec.Wel_t, sec.Wel_b));
    }
    McRd *= red;
  }
  out.McRd = McRd;
  const n = Math.abs(Nc) / b.Npl;
  if (c.cls <= 2) {
    const MN = c.MN * red;
    const a = sec.kind === 'RHS' ? Math.min(0.5, (sec.A - 2 * sec.b * sec.t) / sec.A) : sec.kind === 'I' ? Math.min(0.5, (sec.A - (sec.bg * sec.tg + sec.bd * sec.td)) / sec.A) : 0.5;
    const MNz = n <= a ? b.Mplz : b.Mplz * (1 - Math.pow((n - a) / (1 - a), 2));

    if (Mz > 0) { const be = Math.max(1, 5 * n); out.uMN = Math.pow(Math.abs(M) / MN, 2) + Math.pow(Mz / MNz, be); out.f = '6.41'; }

  out.u = Math.max(out.uMN, out.uV, out.uVy, out.uN);
  return out;
};

/* ---------------------------------------------------------- wyboczenie przy ścinaniu (PN-EN 1993-1-5, 5) */
R.shearBuckling = function (sec, b, ndp, opt) {
  const fy = b.fy, eps = b.eps, eta = b.eta, t = sec.tw, hw = sec.hw;
  const a = opt && opt.a > 0 ? opt.a : Infinity;
  const kt = a === Infinity ? 5.34 : (a / hw >= 1 ? 5.34 + 4 * Math.pow(hw / a, 2) : 4 + 5.34 * Math.pow(hw / a, 2));
  const limit = a === Infinity ? 72 * eps / eta : 31 * eps * Math.sqrt(kt) / eta;
  const need = hw / t > limit;
  const lw = a === Infinity ? hw / (86.4 * t * eps) : hw / (37.4 * t * eps * Math.sqrt(kt));
  const rigid = opt && opt.sztywny;
  let chi;
  if (lw < 0.83 / eta) chi = eta;
  else if (lw < 1.08) chi = 0.83 / lw;
  else chi = rigid ? 1.37 / (0.7 + lw) : 0.83 / lw;
  const nw = sec.nWeb || 1;
  const Vbw = nw * chi * fy * hw * t / (s3 * ndp.gM1);
  const Vmax = nw * eta * fy * hw * t / (s3 * ndp.gM1);
  return { need, limit, ht: hw / t, kt, a, lw, chi, Vbw, Vb: Math.min(Vbw, Vmax), Vmax, rigid };
};

/* interakcja M–V z wyboczeniem przy ścinaniu (7.1) */
R.interMV = function (b, sb, M, V) {
  const e1 = Math.abs(M) / b.Mpl_pos, e3 = Math.abs(V) / sb.Vbw;
  const mf = b.Mf / b.Mpl_pos;

<script>/* src/engine/polaczenia.js */
/* =====================================================================
   BelkaStal – podpory i połączenia przegubowe
   • oparcie belki: docisk środnika (PN-EN 1993-1-5, 6), żebro podporowe
     (9.4), płyta podporowa na betonie (PN-EN 1993-1-8, 6.2.5;
     PN-EN 1992-1-1, 6.7) lub na murze (PN-EN 1996-1-1, 6.1.3 – fd i β
     podaje projektant);
   • krótka blacha czołowa (połączenie przegubowe) i blacha żebrowa
     (nakładka jednostronna) – PN-EN 1993-1-8: tabl. 3.3, 3.4, 3.10.2, 4.5.3.3.
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U, M = BS.M;

/* ---------------------------------------------------------- śruby (tabl. 3.4) */
C.boltShear = function (d, cls, gM2, gwintWPl) {
  const b = M.SRUBY[d], k = M.SRUBY_KL[cls];
  const A = gwintWPl === false ? b.A : b.As;
  const av = gwintWPl === false ? 0.6 : k.av;
  return { Fv: av * k.fub * A / gM2, av, A, fub: k.fub, d0: b.d0, d: b.d };
};
// docisk: e1, p1 – w kierunku obciążenia; e2, p2 – prostopadle (Infinity – brak krawędzi/rzędu)
C.bearing = function (d, cls, t, fu, gM2, g) {
  const b = M.SRUBY[d], k = M.SRUBY_KL[cls], d0 = b.d0;
  const end = g.koniec !== false;
  const ad = end ? g.e1 / (3 * d0) : g.p1 / (3 * d0) - 0.25;
  const ab = Math.min(ad, k.fub / fu, 1);

  const k1 = edge ? Math.min(2.8 * g.e2 / d0 - 1.7, (g.p2 && g.p2 !== Infinity ? 1.4 * g.p2 / d0 - 1.7 : 2.5), 2.5) : Math.min(g.p2 && g.p2 !== Infinity ? 1.4 * g.p2 / d0 - 1.7 : 2.5, 2.5);

};
// minimalne odległości (tabl. 3.3)
C.detailing = function (d0, g) {
  const out = [];
  const chk = (n, v, lim) => { if (v !== undefined && v !== null && isFinite(v)) out.push({ n, v, lim, ok: v >= lim - 1e-9 }); };
  chk('e1 ≥ 1,2·d0', g.e1, 1.2 * d0); chk('e2 ≥ 1,2·d0', g.e2, 1.2 * d0);
  chk('p1 ≥ 2,2·d0', g.p1, 2.2 * d0); chk('p2 ≥ 2,4·d0', g.p2, 2.4 * d0);

/* ---------------------------------------------------------- krótka blacha czołowa */
// w: { hp, bp, tp, nr (rzędy), d, kl, e1, p1, e2, p3 (rozstaw poprzeczny), a, tsup, fusup, gwint }
C.endPlate = function (sec, mat, ndp, w, VEd) {
  const g0 = ndp.gM0, g2 = ndp.gM2;
  const pl = M.fy(mat.gatunek, w.tp, ndp.fySrc);
  const nr = Math.max(1, Math.round(w.nr)), n = 2 * nr;
  const bs = C.boltShear(w.d, w.kl, g2, w.gwint !== false), d0 = bs.d0;
  const hp = w.hp, tp = w.tp, e1 = w.e1, p1 = w.p1, e2 = w.e2, p3 = w.p3;
  const out = { typ: 'blacha_czolowa', VEd, n, bolt: bs, plate: pl, checks: [] };
  const add = (n2, ref, Ed, Rd, f) => out.checks.push({ n: n2, ref, Ed, Rd, u: Math.abs(Ed) / Rd, f });
  add('Ścinanie śrub', 'PN-EN 1993-1-8 tabl. 3.4', VEd, n * bs.Fv, `n·Fv,Rd = ${n}·αv·fub·A/γM2 = ${n}·${U.fmt(bs.av, 1)}·${bs.fub}·${U.fmt(bs.A, 0)}/${U.fmt(g2, 2)}`);
  // docisk do blachy czołowej: rząd skrajny (e1) i pośrednie (p1); krawędź boczna e2, p2 = p3

  // docisk do elementu podpierającego (pas słupa / środnik podciągu) – śruby jak wewnętrzne
  if (w.tsup > 0) {
    const bS = C.bearing(w.d, w.kl, w.tsup, w.fusup || 360, g2, { koniec: false, p1, e2: Infinity, p2: p3 });
    add('Docisk śrub do elementu podpierającego', 'tabl. 3.4', VEd, n * Math.min(bs.Fv, bS.Fb), `t = ${U.fmt(w.tsup, 1)} mm, fu = ${w.fusup || 360} MPa, k1 = ${U.fmt(bS.k1, 2)}, αb = ${U.fmt(bS.ab, 3)}`);

  add('Blacha czołowa – ścinanie przekroju brutto', 'PN-EN 1993-1-1 6.2.6', VEd, 2 * hp * tp * pl.fy / (s3 * g0), `Av = 2·hp·tp = 2·${hp}·${tp}`);
  add('Blacha czołowa – ścinanie przekroju netto', 'PN-EN 1993-1-1 6.2.6; 1-8 3.10', VEd, 2 * (hp - nr * d0) * tp * pl.fu / (s3 * g2), `Anv = 2·(hp − nr·d0)·tp`);
  const Ant = (e2 - d0 / 2) * tp, Anv = (hp - e1 - (nr - 0.5) * d0) * tp;
  add('Blacha czołowa – rozerwanie blokowe', 'PN-EN 1993-1-8 3.10.2 (3.10)', VEd, 2 * (0.5 * pl.fu * Ant / g2 + pl.fy * Anv / (s3 * g0)), `2·(0,5·fu·Ant/γM2 + fy·Anv/(√3·γM0)), Ant = ${U.fmt(Ant, 0)} mm², Anv = ${U.fmt(Anv, 0)} mm²`);
  // środnik belki na wysokości blachy
  add('Środnik belki – ścinanie na wysokości blachy', 'PN-EN 1993-1-1 6.2.6', VEd, hp * sec.tw * mat.fy / (s3 * g0), `Av = hp·tw = ${hp}·${U.fmt(sec.tw, 1)}`);
  // spoina pachwinowa dwustronna środnik–blacha
  const bw = (M.STAL[mat.gatunek] || {}).bw || 0.9;

  add('Spoiny pachwinowe środnik–blacha', 'PN-EN 1993-1-8 4.5.3.3', VEd, fv * w.a * Lw, `fvw,d = fu/(√3·βw·γM2) = ${U.fmt(fv, 1)} MPa, a = ${w.a} mm, ΣL = 2·(hp − 2a) = ${U.fmt(Lw, 0)} mm`);
  out.detal = C.detailing(d0, { e1, e2, p1: nr > 1 ? p1 : undefined, p2: p3 });
  out.uwagi = [];
  if (hp < 0.6 * sec.hw) out.uwagi.push('Zalecana wysokość blachy hp ≥ 0,6·h (stabilizacja skrętna podpory – podpora widełkowa).');
  if (tp > M.SRUBY[w.d].d / 2 && /8\.8|10\.9/.test(w.kl)) out.uwagi.push('Dla zapewnienia zdolności do obrotu (przegub) zaleca się tp ≤ d/2 (śruby 8.8) – sprawdź ciągliwość połączenia.');
  if (w.a < 0.4 * sec.tw) out.uwagi.push('Spoina a < 0,4·tw – rozważ spoinę o pełnej nośności środnika.');

/* ---------------------------------------------------------- blacha żebrowa (nakładka jednostronna) */
// w: { hp, tp, n, d, kl, e1, p1, e2 (od osi śrub do krawędzi blachy), z (od lica podpory do osi śrub), e2b (od osi śrub do końca belki), a, gwint }
C.finPlate = function (sec, mat, ndp, w, VEd) {
  const g0 = ndp.gM0, g2 = ndp.gM2;
  const pl = M.fy(mat.gatunek, w.tp, ndp.fySrc);
  const n = Math.max(1, Math.round(w.n));

  const { hp, tp, e1, p1, e2, z } = w;
  const out = { typ: 'blacha_zebrowa', VEd, n, bolt: bs, plate: pl, checks: [] };
  const add = (n2, ref, Ed, Rd, f) => out.checks.push({ n: n2, ref, Ed, Rd, u: Math.abs(Ed) / Rd, f });

  const bV = C.bearing(w.d, w.kl, tp, pl.fu, g2, { koniec: n === 1, e1, p1, e2, p2: Infinity });
  const bVe = C.bearing(w.d, w.kl, tp, pl.fu, g2, { koniec: true, e1, e2, p2: Infinity });
  const bH = C.bearing(w.d, w.kl, tp, pl.fu, g2, { koniec: true, e1: e2, e2: e1, p2: n > 1 ? p1 : Infinity });
  const FbVp = Math.min(bV.Fb, bVe.Fb);
  add('Docisk do blachy (interakcja pion/poziom)', 'tabl. 3.4 (interakcja kierunków)', Math.sqrt(Math.pow(Fv / FbVp, 2) + Math.pow(Fh / bH.Fb, 2)), 1, `(Fv/Fb,ver)² + (Fh/Fb,hor)² ≤ 1: Fb,ver = ${U.fmt(FbVp / 1e3, 1)} kN, Fb,hor = ${U.fmt(bH.Fb / 1e3, 1)} kN`);
  // docisk – środnik belki (pionowo: śruby wewnętrzne; poziomo: krawędź e2b)
  const wV = C.bearing(w.d, w.kl, sec.tw, mat.fu, g2, { koniec: false, p1: n > 1 ? p1 : 3 * d0, e2: Infinity, p2: Infinity });
  const wH = C.bearing(w.d, w.kl, sec.tw, mat.fu, g2, { koniec: true, e1: w.e2b, e2: Infinity, p2: n > 1 ? p1 : Infinity });
  add('Docisk do środnika belki (interakcja)', 'tabl. 3.4', Math.sqrt(Math.pow(Fv / wV.Fb, 2) + Math.pow(Fh / wH.Fb, 2)), 1, `Fb,ver = ${U.fmt(wV.Fb / 1e3, 1)} kN, Fb,hor = ${U.fmt(wH.Fb / 1e3, 1)} kN (e2,b = ${w.e2b} mm)`);
  add('Blacha – ścinanie brutto', 'PN-EN 1993-1-1 6.2.6', VEd, hp * tp * pl.fy / (s3 * g0), `Av = hp·tp = ${hp}·${tp}`);
  add('Blacha – ścinanie netto', '3.10; 6.2.6', VEd, (hp - n * d0) * tp * pl.fu / (s3 * g2), `Anv = (hp − n·d0)·tp`);
  const Ant = (e2 - d0 / 2) * tp, Anv = (hp - e1 - (n - 0.5) * d0) * tp;
  add('Blacha – rozerwanie blokowe', 'PN-EN 1993-1-8 3.10.2 (3.10)', VEd, 0.5 * pl.fu * Ant / g2 + pl.fy * Anv / (s3 * g0), `Ant = ${U.fmt(Ant, 0)} mm², Anv = ${U.fmt(Anv, 0)} mm²`);

/* ---------------------------------------------------------- oparcie na płycie podporowej */
// w: { podloze: 'beton'|'mur'|'stal', bp, lp, tp, beton:'C25/30', alfa (√(Ac1/Ac0) ≤ 3), fd (mur), beta (mur), lb (długość docisku belki) }
C.bearingPlate = function (sec, mat, ndp, w, REd) {

  if (w.podloze === 'stal' || !(w.bp > 0 && w.lp > 0)) return out;

      const hc = w.hc > 0 ? w.hc : Infinity, ex = Math.max(0, Math.min(w.bc / 2 - (w.ec || 0), w.bc / 2 + (w.ec || 0)) - w.lp / 2), ey = w.lc > 0 ? Math.max(0, (w.lc - w.bp) / 2) : Infinity;
      const kx = Math.min((w.lp + 2 * ex) / w.lp, (w.lp + hc) / w.lp), ky = Math.min((w.bp + 2 * ey) / w.bp, (w.bp + hc) / w.bp);
      al = U.clamp(Math.min(3, kx, ky), 1, 3);
      aTxt = `; α = √(A_c1/A_c0) = ${U.fmt(al, 2)} z wymiarów podpory (A_c1 współśrodkowe, podobne do płyty, w obrysie elementu, ≤ 3)`;
    } else al = U.clamp(U.num(w.alfa, 1), 1, 3);
    fjd = ndp.betaJ * al * fcd;
    desc = `fjd = βj·α·fcd = ${U.fmt(ndp.betaJ, 3)}·${U.fmt(al, 2)}·${U.fmt(fcd, 2)} = ${U.fmt(fjd, 2)} MPa (${w.beton}, fcd = αcc·fck/γc)${aTxt}`;
    out.alfa = al; out.alfaAuto = autoA;
  } else {

    fjd = be * fd;

  }

  const lb = Math.min(w.lb || w.lp, w.lp);
  const beff = Math.min(w.bp, sec.bd + 2 * c), leff = Math.min(w.lp, lb + 2 * c);
  const FRd = fjd * beff * leff;

  out.checks.push({ n: 'Docisk płyty do podłoża (pole efektywne)', ref: w.podloze === 'beton' ? 'PN-EN 1993-1-8 6.2.5; PN-EN 1992-1-1 6.7' : 'PN-EN 1996-1-1 6.1.3', Ed: REd, Rd: FRd, u: Math.abs(REd) / FRd,
    f: `${desc}; c = tp·√(fy/(3·fjd·γM0)) = ${U.fmt(c, 1)} mm; Aeff = ${U.fmt(beff, 0)}×${U.fmt(leff, 0)} mm` });
  if (w.podloze === 'mur' && lb < 100) out.uwagi.push('Długość oparcia na murze < 100 mm – sprawdź wymagania konstrukcyjne dla oparcia belek na murze.');

  const minPer = Math.min(B.Fv, fbE.Fb, nIn ? fbI.Fb : Infinity, sup ? sup.R / n : Infinity);
  const grp = B.Fv >= Math.max(fbE.Fb, nIn ? fbI.Fb : 0) ? Math.min(FbPl, sup ? sup.R : Infinity) : n * minPer;
  o.add('Śruby', 'Nośność grupy łączników', 'PN-EN 1993-1-8 3.7(1)', V, grp, 'F', B.Fv >= Math.max(fbE.Fb, nIn ? fbI.Fb : 0) ? `F_v,Rd ≥ F_b,Rd każdej śruby → ΣF_b,Rd = ${kN(grp)} kN` : `n·min(F_v,Rd; F_b,Rd) = ${n}·${kN(minPer)} = ${kN(grp)} kN`);
  slip(o, B, V, F.Vser, n);
  // --- blacha
  o.add('Blacha czołowa', 'Ścinanie przekroju brutto (2 płaszczyzny)', 'PN-EN 1993-1-1 6.2.6; SCI P358 (1,27)', V, 2 * hp * tp * pl.fy / (1.27 * s3 * g0), 'F', `2·h_p·t_p·f_y/(1,27·√3·γM0) = 2·${f(hp, 0)}·${f(tp)}·${pl.fy}/(1,27·√3·${f(g0, 2)}) – współczynnik 1,27 uwzględnia zginanie w płaszczyźnie blachy`);
  o.add('Blacha czołowa', 'Ścinanie przekroju netto', 'PN-EN 1993-1-8 3.10; 1-1 6.2.6', V, 2 * (hp - nr * B.d0) * tp * pl.fu / (s3 * g2), 'F', `2·(h_p − n_r·d₀)·t_p·f_u/(√3·γM2) = 2·(${f(hp, 0)} − ${nr}·${B.d0})·${f(tp)}·${pl.fu}/(√3·${f(g2, 2)})`);
  const Ant = (e2 - B.d0 / 2) * tp, Anv = (hp - e1 - (nr - 0.5) * B.d0) * tp;
  o.add('Blacha czołowa', 'Rozerwanie blokowe (2 bloki)', 'PN-EN 1993-1-8 3.10.2 (3.10)', V, 2 * (0.5 * pl.fu * Ant / g2 + pl.fy * Anv / (s3 * g0)), 'F', `2·(0,5·f_u·A_nt/γM2 + f_y·A_nv/(√3·γM0)); A_nt = (e₂ − d₀/2)·t_p = ${f(Ant, 0)} mm², A_nv = (h_p − e₁ − (n_r − 0,5)·d₀)·t_p = ${f(Anv, 0)} mm²`);
  // --- belka
  o.add('Belka', 'Środnik belki – ścinanie na wysokości blachy', 'PN-EN 1993-1-1 6.2.6', V, hp * sec.tw * mat.fy / (s3 * g0), 'F', `A_v = h_p·t_w = ${f(hp, 0)}·${f(sec.tw)} mm²`);
  if (U.num(w.dnt) > 0 || U.num(w.dnb) > 0) { const nw = notchW(sec, U.num(w.dnt), U.num(w.dnb)); o.add('Belka', 'Środnik podcięty – ścinanie brutto', 'PN-EN 1993-1-1 6.2.6', V, nw.hr * sec.tw * mat.fy / (s3 * g0), 'F', `h_r = ${f(nw.hr, 0)} mm`); }
  // --- spoiny środnik–blacha (dwustronne)
  const wk = weaker(pl, { fu: mat.fu, bw: bwOf(mat.gatunek) }), bw = wk.bw, fuW = wk.fu, Lw = Math.max(1, hp - 2 * a);
  const tl = V / (2 * a * Lw), wf = W.fillet(fuW, bw, g2, 0, 0, tl);
  o.add('Spoiny', 'Spoiny pachwinowe środnik–blacha (ścinanie τ∥)', 'PN-EN 1993-1-8 4.5.3.2 (4.1)', wf.s, wf.R1, 'MPa', `τ∥ = V/(2·a·l_w) = ${kN(V)}·10³/(2·${f(a)}·${f(Lw, 0)}) = ${f(tl)} MPa; √(3τ∥²) = ${f(wf.s)} ≤ f_u/(β_w·γM2) = ${fuW}/(${f(bw, 2)}·${f(g2, 2)}) = ${f(wf.R1)} MPa`);
  const aF = W.aFull(sec.tw, mat.fy, fuW, bw, g0, g2);
  o.dmin('spoiny', `a ≥ a_pełnonośna środnika = ${f(aF)} mm (zalecenie SCI – ciągliwość)`, a, aF, 'zal');
  o.dmin('spoiny', 'a ≥ 3 mm', a, 3);
  // --- wiązanie (rozciąganie) – sytuacja wyjątkowa, osobno od ścinania
  if (Nt > 0) {
    const m = Math.max(1, (p3 - sec.tw) / 2 - 0.8 * a * Math.SQRT2), nn = Math.min(e2, 1.25 * m);
    const Bp = 0.6 * Math.PI * B.dm * tp * pl.fu / g2, Bt = Object.assign({}, B, { Ft: Math.min(B.Ft, Bp) });
    const T = tstub(o, 'Wiązanie', m, nn, 2 * hp, tp, pl.fy, g0, n, Bt);
    o.add('Wiązanie (N_t)', 'Blacha czołowa jako T-króciec – rozciąganie', 'PN-EN 1993-1-8 6.2.4, tabl. 6.2', Nt, T.FT, 'F', `m = ${f(m)} mm, n = ${f(nn)} mm, Σl_eff = 2·h_p = ${f(2 * hp, 0)} mm; F_T,1 = ${kN(T.F1)}, F_T,2 = ${kN(T.F2)}, F_T,3 = ΣF_t,Rd = ${kN(T.F3)} kN (F_t,Rd = min(0,9·f_ub·A_s/γM2; B_p,Rd = 0,6·π·d_m·t_p·f_u/γM2 = ${kN(Bp)} kN)) → postać ${T.mode}`);
    o.add('Wiązanie (N_t)', 'Środnik belki – rozciąganie na wysokości blachy', 'PN-EN 1993-1-8 6.2.6.8', Nt, hp * sec.tw * mat.fy / g0, 'F', `h_p·t_w·f_y/γM0`);
    const sw = Nt / (2 * a * Lw), wt = W.fillet(fuW, bw, g2, sw / Math.SQRT2, sw / Math.SQRT2, 0);
    o.add('Wiązanie (N_t)', 'Spoiny środnik–blacha – rozciąganie', 'PN-EN 1993-1-8 4.5.3.2', wt.s, wt.R1, 'MPa', `σ_w = N_t/(2·a·l_w) = ${f(sw)} MPa; σ⊥ = τ⊥ = σ_w/√2`, { u: wt.u });
    o.uwagi.push('Siła wiązania N_t – sytuacja wyjątkowa (integralność konstrukcji); sprawdzana niezależnie od siły poprzecznej (PN-EN 1991-1-7, zał. A).');
  }
  // --- konstrukcja i ciągliwość
  spacing(o, 'blacha czołowa', B, tp, { e1, e2, p1: nr > 1 ? p1 : undefined, p2: p3, exp: w.exp });
  o.dmin('blacha czołowa', 'otwory w obrysie blachy: e₁,dół = h_p − e₁ − (n_r − 1)·p₁ ≥ 1,2·d₀', e1d, 1.2 * B.d0);
  o.dmin('blacha czołowa', 'otwór poza spoiną środnika: (p₃ − t_w)/2 − a√2 ≥ d₀/2', (p3 - sec.tw) / 2 - a * Math.SQRT2, B.d0 / 2);
  const tpMax = (pl.fy <= 275 ? 0.5 : 0.42) * B.dd * (B.cl === '10.9' ? 0.85 : 1);
